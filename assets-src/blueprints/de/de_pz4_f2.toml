# Panzer IV Ausf. F2 (1942), prompt 063: chassis, hull and turret of
# de_pz4_g.toml / de_pz4_h.toml, checked against the onwar.com Ausf. F2
# drawing. Differences to the Ausf. G: single-baffle ball muzzle brake, no
# turret skirt (turret side hatches), spare road wheels at the rear corners
# of the fenders, spare track links on the nose.
unit = "de_pz4_f2"
assembly = "tank"

[layout]
turret_y = 0.28
turret_ring_diameter = 1.68

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.47
road_wheels = [1.66, 1.16, 0.71, 0.21, -0.21, -0.71, -1.16, -1.66]
sprocket = { y = 2.42, z = 0.74, diameter = 0.68, teeth = 20 }
idler = { y = -2.40, z = 0.56, diameter = 0.60 }
return_rollers = { y = [1.45, 0.48, -0.48, -1.45], z = 0.86, diameter = 0.25 }

[hull]
part = "plate_hull"
# lower hull between the tracks: nose plate (14 deg), lower glacis, belly
# rear plate at -2.62 m: the fenders and the muffler under them reach the hull
# length (onwar.com drawing)
lower = [[-2.50, 0.42], [2.30, 0.42], [2.90, 0.78], [2.96, 1.03], [-2.62, 1.03], [-2.62, 0.62]]
# superstructure: short upper glacis, driver plate (10 deg), roof, engine deck
upper = [[-2.62, 1.02], [2.96, 1.02], [2.96, 1.08], [2.38, 1.27], [2.31, 1.70], [-1.95, 1.70],
         [-2.62, 1.58]]
upper_half_width = 1.25
fender_front = 2.96
fender_rear = -2.96
fender_slope_front = 0.18

[turret]
part = "plate_turret"
height = "fit"
# plan relative to the ring center: narrow front, faceted sides, chamfered rear
plan = [[-0.62, 0.95], [0.62, 0.95], [0.86, 0.42], [0.86, -0.82], [0.66, -1.02], [-0.66, -1.02],
        [-0.86, -0.82], [-0.86, 0.42]]
side_slope_deg = 25
front_slope_deg = 10

[cupola]
x = 0.0
y = -0.62
diameter = 0.72
height = 0.28
vision_blocks = 5
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [0.80, 0.36]
mantlet = { kind = "box", size = [0.78, 0.14, 0.46] }
sleeve = [0.42, 0.105]
segments = [["fit", 0.058, 0.05]]
muzzle_brake = "single_baffle"

[[mg]]  # coaxial MG 34, left of the main gun
part = "mg"
mount = "coax"
position = [-0.22, 0.2, 0.0]

[[mg]]  # hull MG 34 in the radio operator's ball mount
part = "mg"
mount = "ball"
position = [0.62, 2.36, 1.48]
length = 1.0

[[part]]
part = "turret_bustle_box"
y = -1.02
size = [1.05, 0.42, 0.42]
z = 0.25

[[part]]
