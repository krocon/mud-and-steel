# Focke-Wulf Fw 190 A-8: single-seat fighter, BMW 801 radial, wide-track
# retractable gear, 2 MG 131 over the engine, 4 MG 151/20 in the wings,
# optional SC 500 on the ETC 501 centerline rack.
# Main dimensions from data/catalog/de.toml (length 8.95 m, span 10.506 m,
# height 3.15 m). Modeling estimates from Fw 190 A three-views (wing area
# 18.3 m2 per Wikipedia -> mean chord 1.74 m; root/tip chord 2.3/1.2 m),
# cowling diameter ~1.3 m, VDM three-blade propeller 3.3 m, main wheels
# 700x175 mm, track ~3.5 m, SC 500 2.0 x 0.40 m.
# Attitude: the kit builds the wing level; the fuselage is tilted ~4 degrees
# nose up (shallower than the real ~13 degree three-point attitude) so the fin
# top ends at the catalog height. The catalog height excludes the propeller
# (published heights are tail-down to the fin top), hence exclude_height.
unit = "de_fw190_a8"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
# [y, width, height, z_center, exponent], tail -> nose, drawn level around z = 2.0 (prompt 215)
sections = [[-6.05, 0.04, 0.24, 2.00, 2.0], [-5.10, 0.34, 0.62, 2.00, 2.2], [-3.40, 0.66, 1.02, 1.98, 2.3],
            [-1.70, 0.92, 1.24, 1.96, 2.4], [-0.20, 1.06, 1.32, 1.96, 2.3], [1.05, 1.24, 1.32, 1.98, 2.1],
            [2.15, 1.30, 1.30, 2.00, 2.0], [2.42, 1.10, 1.10, 2.00, 2.0]]
segments = 16

[wing]
part = "wing"
y = 0.0
z = 1.48
root_chord = 2.30
tip_chord = 1.15
planform = "rounded"
sweep_deg = 5.0
dihedral_deg = 5.5
thickness = 0.14
aileron = [0.58, 0.92]

[tail]
part = "tail"
y = -4.90
z = 2.10
span = 3.65
root_chord = 1.05
tip_chord = 0.58
planform = "rounded"
# Characteristic tall, straight-raked Fw 190 fin and rounded rudder
fin_outline = [[-4.70, 2.12], [-5.20, 3.20], [-5.45, 3.82], [-5.68, 3.84], [-5.74, 3.70], [-5.74, 2.02]]
rudder_outline = [[-5.74, 1.88], [-5.74, 3.78], [-5.94, 3.74], [-6.03, 3.35], [-6.04, 2.45], [-5.92, 1.92]]

[canopy]
part = "canopy"
y = [-2.25, -0.45]
z = 2.50
width = 0.68
height = 0.44
profile = [[0.0, 0.45], [0.22, 0.82], [0.52, 1.0], [0.80, 0.94], [0.94, 0.68], [1.0, 0.38]]
frames = 2

[landing_gear]
part = "landing_gear"
main_y = 0.30
main_track = 3.50
main_wheel_diameter = 0.70
strut_top_z = 1.45
ground_z = 0.00
tail_y = -5.15
tail_wheel_diameter = 0.36
tail_strut_top_z = 1.75
tail_ground_z = 0.58

[[propeller]]
part = "propeller"
position = [0.0, 2.52, 2.00]
diameter = 3.30
blades = 3
phase_deg = 90
spinner = [0.56, 0.62]
blade_width = 0.21

[[part]]
part = "fixed_guns"            # MG 151/20 E: wing roots (inner) and outer wing
muzzles = [[0.95, 0.22, 1.56], [2.40, 0.08, 1.72]]
length = 0.45
radius = 0.02

[[part]]
part = "fixed_guns"            # MG 131 over the engine, firing through the propeller arc
muzzles = [[0.16, 1.95, 2.60]]
length = 0.55
radius = 0.014

[[part]]
part = "bomb_load"             # SC 500 on the ETC 501 centerline rack
bombs = [[0.0, -0.35, 1.06]]
mirror = false
length = 2.0
diameter = 0.40

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.62, 1.30, 1.92]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.62, 1.30, 1.92]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.6, 2.45]

[[part]]
part = "marking"
name = "Wing_L"
position = [-3.6, -0.95, 1.95]
normal = [0.0, 0.0, 1.0]
size = 1.0

[[part]]
part = "marking"
name = "Wing_R"
position = [3.6, -0.95, 1.95]
normal = [0.0, 0.0, 1.0]
size = 1.0

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.34, -3.2, 1.98]
normal = [-1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "marking"
name = "Hull_R"
position = [0.34, -3.2, 1.98]
normal = [1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "shadow_proxy"

[validate]
exclude_height = ["Propeller"]
