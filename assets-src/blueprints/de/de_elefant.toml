# Panzerjäger Tiger (P) "Elefant" (Sd.Kfz. 184), the 1943/44 rebuild of the
# Ferdinand (prompt 063, group ger-heavy).
# Main dimensions from data/catalog/de.toml (onwar.com): length 8.14 m with
# gun, hull 6.80 m (track front to the casemate rear), width 3.38 m, height
# 2.97 m (casemate roof).
# Measured on the onwar.com drawing (docs/.vorlagen, not in the repo; about
# 158 px/m along the hull, 152 px/m in height), which shows the Ferdinand:
# Porsche running gear with six 0.75 m road wheels in three pairs on
# longitudinal torsion bars, FRONT idler, REAR sprocket, no return rollers,
# 0.65 m track (data.json), ground clearance 0.48 m (data.json); hull front
# plate at +2.23 m behind the idlers with the sloped track guards ahead of
# it; engine deck at 1.76 m; casemate from +0.25 m (base) to the rear end,
# front plate 17 deg, sides about 21 deg (front view), rear plate 28 deg.
# Elefant features from the rebuild (not in the drawing): ball-mounted bow
# MG in the front plate, commander's cupola on the roof.
unit = "de_elefant"
assembly = "casemate"

[layout]
fender_overhang = 0.0

[running_gear]
part = "small_wheel_bogie"              # Porsche bogies: two wheels on longitudinal torsion bars
per_bogie = 2
spring = "none"
track_width = 0.65
link_pitch = 0.13
road_wheel_diameter = 0.75
road_wheels = [2.02, 1.25, 0.40, -0.38, -1.15, -1.99]
sprocket = { y = -2.83, z = 0.66, diameter = 0.72, teeth = 19 }
idler = { y = 2.99, z = 0.79, diameter = 0.74 }

[hull]
part = "plate_hull"
# lower hull: sloped nose under the track guards, flat belly, rear plate
lower = [[-3.20, 0.48], [2.60, 0.48], [3.40, 0.98], [3.40, 1.04], [-3.42, 1.04], [-3.42, 0.80]]
# over the tracks: track guards ahead of the vertical hull front plate
# (+2.23 m), engine deck at 1.76 m
upper = [[-3.42, 1.03], [3.40, 1.03], [3.40, 1.05], [2.23, 1.05], [2.23, 1.76], [-3.42, 1.76]]
fender_front = 3.40
fender_rear = -3.42

[casemate]
part = "casemate"
z = 1.75
plan = [[-1.60, 0.25], [1.60, 0.25], [1.60, -3.42], [-1.60, -3.42]]
top_plan = [[-1.13, -0.13], [1.13, -0.13], [1.13, -2.78], [-1.13, -2.78]]

[cupola]                                 # Elefant: StuG III type cupola, right of the roof
x = 0.55
y = -1.40
diameter = 0.66
height = 0.20
vision_blocks = 7
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.05, 2.36]      # model space: y, z
mantlet = { kind = "ball", size = [0.72, 0.40, 0.72] }
sleeve = [0.35, 0.14]
segments = [["fit", 0.09, 0.075]]
muzzle_brake = "double_baffle"

[[mg]]  # Elefant: bow MG 34 in a ball mount, right of the hull front plate
part = "mg"
mount = "ball"
position = [0.60, 2.24, 1.45]
length = 0.9

[[mg]]  # second (loose) MG 34 for local defense, on a low mount at the casemate front
part = "pintle_mg"
position = [-0.95, 0.70, 1.78]
length = 1.22
post = 0.10

[[part]]
part = "hull_hatch"           # loader's hatch, left of the roof
center = [-0.55, -1.30]
z = "casemate"
size = [0.50, 0.50]
hinge = "rear"

[[part]]
part = "hull_hatch"           # driver's hatch on the front deck
center = [-0.70, 1.75]
size = [0.55, 0.55]
hinge = "rear"
socket = true

[[part]]
part = "hull_hatch"           # radio operator's hatch
center = [0.70, 1.75]
size = [0.55, 0.55]
hinge = "rear"

[[part]]
part = "deck_box"             # engine and radiator grilles on the deck
center = [-0.90, 1.00]
size = [0.90, 0.80, 0.04]

[[part]]
part = "deck_box"
center = [0.90, 1.00]
size = [0.90, 0.80, 0.04]

[[part]]
part = "cylinder_prop"        # round loading hatch in the casemate rear plate
from = [0.0, -3.05, 2.30]
to = [0.0, -3.14, 2.27]
radius = 0.40
segments = 14

[[part]]
part = "cylinder_prop"        # exhaust pipes at the rear, under the casemate
from = [-0.70, -3.30, 1.00]
to = [-0.70, -3.44, 1.00]
radius = 0.07
material = "Metal"
segments = 8

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.70, -3.45, 1.00]

[[part]]
part = "cylinder_prop"
from = [0.70, -3.30, 1.00]
to = [0.70, -3.44, 1.00]
radius = 0.07
material = "Metal"
segments = 8

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.70, -3.45, 1.00]

[[part]]
part = "box_prop"             # gun travel lock on the front deck
center = [0.0, 2.05, 1.90]
size = [0.30, 0.10, 0.28]

[[part]]
part = "headlight"
position = [-1.20, 2.26, 1.62]
diameter = 0.18

[[part]]
part = "tool"
kind = "shovel"
position = [-1.40, 1.60, 1.78]

[[part]]
part = "tool"
kind = "crowbar"
position = [1.40, 1.30, 1.78]

[[part]]
part = "antenna"
position = [1.10, -2.60, 2.90]
