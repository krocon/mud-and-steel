# Panzer IV/70 (V) (Sd.Kfz. 162/1), 1944/45, prompt 063: no drawing in the
# reference folder; the Jagdpanzer IV of de_jgdpz4.toml (onwar.com drawing)
# with the 7.5 cm PaK 42 L/70 in the same Saukopf mantlet, no muzzle brake.
# The hull is the Jagdpanzer IV hull (5.92 m); the catalog hull length 5.51 m
# (onwar.com 8.50 m less 2.99 m overhang) is not used by the build, the gun
# is fitted to the catalog overall length 8.50 m.
unit = "de_pz4_70v"
assembly = "casemate"

[layout]
fender_overhang = 0.14

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.47
road_wheels = [1.66, 1.16, 0.71, 0.21, -0.21, -0.71, -1.16, -1.66]
sprocket = { y = 2.42, z = 0.74, diameter = 0.68, teeth = 20 }
idler = { y = -2.40, z = 0.56, diameter = 0.60 }
return_rollers = { y = [1.45, 0.48, -0.48, -1.45], z = 0.86, diameter = 0.25 }

[hull]
part = "plate_hull"
# lower hull with the nose plate rising to the casemate front
lower = [[-2.50, 0.42], [2.30, 0.42], [2.96, 0.92], [2.96, 1.05], [-2.62, 1.05], [-2.62, 0.62]]
upper = [[-2.62, 1.04], [2.96, 1.04], [2.96, 1.06], [-0.80, 1.06], [-0.95, 1.42], [-2.62, 1.40]]
upper_half_width = 1.25
fender_front = 2.96
fender_rear = -2.96
fender_slope_front = 0.15

[casemate]
part = "casemate"
z = 1.05
plan = [[-1.25, 2.62], [1.25, 2.62], [1.44, 2.30], [1.44, -0.95], [-1.44, -0.95], [-1.44, 2.30]]
top_plan = [[-0.85, 1.15], [0.85, 1.15], [1.00, 1.00], [1.00, -0.80], [-1.00, -0.80], [-1.00, 1.00]]

[gun]
part = "tank_gun"
trunnion = [1.50, 1.46]      # model space: y, z
mantlet = { kind = "saukopf", size = [0.60, 0.70, 0.56] }
segments = [["fit", 0.062, 0.052]]
muzzle_brake = "none"

[[mg]]  # MG 42 in the left port of the front plate
part = "mg"
mount = "ball"
position = [-0.75, 1.95, 1.45]
length = 0.9

[[part]]
part = "hull_hatch"           # commander's hatch (scissor periscope), right
center = [0.54, -0.16]
z = "casemate"
size = [0.55, 0.55]
hinge = "rear"
socket = true

[[part]]
part = "hull_hatch"           # loader's hatch, left
center = [-0.52, -0.22]
z = "casemate"
size = [0.50, 0.45]
hinge = "rear"

[[part]]
part = "skirts"
y = [-2.35, 2.05]
bottom_z = 0.48
top_z = 1.40
plates = 5
gap = 0.0

[[part]]
part = "deck_box"   # engine deck hatches
center = [0.0, -1.70]
size = [1.5, 1.1, 0.04]

[[part]]
part = "exhaust"
kind = "muffler"
position = [0.0, -2.79, 0.86]
length = 1.0
diameter = 0.3

[[part]]
part = "de.spare_wheel"       # spare road wheels on the rear deck
position = [-0.60, -2.40, 1.60]
diameter = 0.47
width = 0.10
axis = [0.0, -1.0, 0.0]
cover = false

[[part]]
part = "de.spare_wheel"
position = [0.60, -2.40, 1.60]
diameter = 0.47
width = 0.10
axis = [0.0, -1.0, 0.0]
cover = false

[[part]]
part = "spare_tracks"         # spare links on the nose
origin = [-0.84, 2.99, 0.80]
direction = [0.42, 0.0, 0.0]
count = 5
link_size = [0.40, 0.04, 0.12]

[[part]]
part = "de.notek"
position = [-1.15, 2.60, 1.10]

[[part]]
part = "tool"
kind = "shovel"
position = [-1.30, -1.6, 1.42]

[[part]]
part = "tool"
kind = "jack"
position = [0.9, -2.30, 1.45]
axis = "x"

[[part]]
part = "antenna"
position = [1.00, -0.70, 1.85]
length = 2.0

[[part]]
part = "tow_hook"
position = [0.0, -2.64, 0.60]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.92, 0.80]
pair = true
socket = false

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.6, 1.45]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.3, 1.9]

[[part]]
part = "marking"
name = "Hull_L"
parent = "Skirt_L"
position = [-1.595, -0.45, 1.00]
normal = [-1, 0, 0]
size = 0.50

[[part]]
part = "marking"
name = "Hull_R"
parent = "Skirt_R"
position = [1.595, -0.45, 1.00]
normal = [1, 0, 0]
size = 0.50

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -0.88, 1.60]
normal = [0.0, -1.0, 0.3]
size = 0.30

[validate]
exclude_height = ["Hatch_*", "Antenna_*"]   # catalog height is the casemate roof
