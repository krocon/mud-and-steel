# 15 cm Panzerwerfer 42 auf Sd.Kfz. 4/1 "Maultier" (prompt 062). Main
# dimensions from data/catalog/de.toml: length 6.00 m, width 2.20 m, height
# 2.50 m (top of the launcher). Armored Maultier: the Opel 3.6 t chassis
# (front axle of the Opel Blitz) with a tracked rear unit, under a closed
# angular armored body (6-14.5 mm): sloped engine nose, driver's front plate
# with two visors, box body with flat sides, roof with the ten-tube launcher
# (two rows of five 15 cm tubes) on a turntable at the rear (Wikipedia
# "Panzerwerfer"). Modeling estimates from photographs: body sections, the
# four road wheels of the track unit per side, tube length 1.3 m, turntable
# and the MG 42 on the roof. The launcher turns with the turntable (object
# `Turret`). Model space: hull center at y = 0, the assembly centers the
# ground contact.
unit = "de_pzwerfer42"
assembly = "halftrack"

[layout]
track_outer_x = 0.95

[running_gear]
part = "halftrack_rear"
track_width = 0.30
track_thickness = 0.03
link_pitch = 0.10
road_wheel_diameter = 0.50
road_wheels = [-0.55, -1.08, -1.61, -2.14]
sprocket = { y = -0.02, z = 0.46, diameter = 0.52, teeth = 16 }
idler = { y = -2.62, z = 0.44, diameter = 0.48, spoked = false }

[front_axle]
part = "wheel_axle"
y = 2.10
diameter = 0.86
width = 0.19
track = 1.60
spokes = 0

[hull]
part = "section_hull"
height = "keep"
# Front to rear: armored radiator nose, engine hood, sloped driver's plate,
# box body with near-vertical sides out to the catalog width, flat roof,
# slightly sloped rear plate.
sections = [
  { y =  3.00, bottom_z = 0.66, bottom_hw = 0.40, chine_z = 0.80, chine_hw = 0.44, top_z = 1.00, top_hw = 0.36 },
  { y =  2.85, bottom_z = 0.52, bottom_hw = 0.48, chine_z = 1.00, chine_hw = 0.56, top_z = 1.30, top_hw = 0.48 },
  { y =  1.50, bottom_z = 0.50, bottom_hw = 0.52, chine_z = 1.10, chine_hw = 0.66, top_z = 1.52, top_hw = 0.56 },
  { y =  1.30, bottom_z = 0.78, bottom_hw = 0.70, chine_z = 1.10, chine_hw = 1.06, top_z = 1.62, top_hw = 0.90 },
  { y =  0.90, bottom_z = 0.78, bottom_hw = 0.70, chine_z = 1.10, chine_hw = 1.10, top_z = 2.02, top_hw = 1.00 },
  { y = -2.80, bottom_z = 0.78, bottom_hw = 0.70, chine_z = 1.10, chine_hw = 1.10, top_z = 2.02, top_hw = 1.00 },
  { y = -3.00, bottom_z = 0.72, bottom_hw = 0.66, chine_z = 1.06, chine_hw = 1.06, top_z = 1.92, top_hw = 0.96 },
]

[[part]]
part = "box_prop"      # belly between the tracks
center = [0.0, -1.10, 0.62]
size = [1.30, 3.40, 0.30]

[[part]]
part = "fender"        # front mudguards over the steered wheels
profile = [[2.75, 0.80], [2.55, 0.96], [2.30, 1.02], [1.65, 1.02], [1.40, 0.98], [1.30, 1.02]]
x = [0.50, "full"]

[[part]]
part = "box_prop"      # radiator louvers on the nose
center = [0.0, 2.30, 1.38]
size = [0.60, 0.60, 0.04]
material = "Metal"

[[part]]
part = "cylinder_prop" # turntable of the launcher
parent = "Hull"
from = [0.0, -1.70, 2.00]
to = [0.0, -1.70, 2.08]
radius = 0.62
material = "Metal"
segments = 14

[[part]]
part = "rocket_rack"   # ten 15 cm tubes in two rows of five
parent = "Turret"
turret_pivot = [0.0, -1.70, 2.08]
pivot = [0.0, -2.35, 2.11]
rows = 2
cols = 5
pitch = [0.20, 0.19]
length = 1.30
diameter = 0.17
material = "Paint"

[[part]]
part = "box_prop"      # cradle under the tubes
parent = "Turret"
center = [0.0, -1.70, 2.095]
size = [1.10, 1.30, 0.03]
material = "Metal"

[[part]]
