# Leichter Panzerspähwagen (2 cm) Sd.Kfz. 222, late production (Ausf. B
# chassis from 1942, 2 cm KwK 38). Main dimensions from data/catalog/de.toml:
# length 4.80 m, width 1.95 m, height 2.00 m. The catalog height is taken as
# including the folding grenade screen (catalog note), so the turret wall
# height is fixed below and the screen top ends at the catalog height.
# The catalog length is taken over the front bumper and the rear mudguards;
# the armored body itself is shorter ([layout] hull_length).
# Modeling estimates from photographs and general-arrangement drawings
# (Wikipedia "Leichter Panzerspähwagen"; Panzerworld) and the pictures in
# docs/.vorlagen/Leichter-Panzerspähwagen-(2-cm)-Sd.Kfz.-222: 4x4 Horch
# chassis, wheelbase about 2.80 m, track about 1.60 m, 210-18 tires (~0.88 m).
# Faceted body: lower plates flaring out to a chine at mudguard height, upper
# plates leaning in; in plan the body is widest beside the turret and tapers
# to the wedge-shaped nose and to the engine compartment at the rear. Angular
# mudguards over all four wheels, stowage boxes between the wheels on the
# left, the covered spare wheel on the right. Open ten-sided turret with
# sloped walls, 2 cm KwK 38 and MG 34 (left of it) on a common pedestal
# mount firing through the turret front, wire-mesh grenade screen in two
# halves folding outward (the halves are Hatch_01/02).
unit = "de_sdkfz222"
assembly = "armored_car"

[layout]
turret_y = 0.02
turret_ring_diameter = 1.15
hull_length = 4.50            # armored body; bumper and rear mudguards reach the catalog length

[[axle]]
y = 1.40
diameter = 0.88
width = 0.22
track = 1.60

[[axle]]
y = -1.40
diameter = 0.88
width = 0.22
track = 1.60

[hull]
part = "section_hull"
height = "keep"               # the turret and the screen set the height
# nose (undercut lower plate), glacis, driver's front plate, fighting
# compartment (widest beside the turret), engine deck, sloped rear plate, tail
sections = [
    { y = 2.25, bottom_z = 0.78, bottom_hw = 0.40, chine_z = 0.88, chine_hw = 0.46, top_z = 0.98, top_hw = 0.40 },
    { y = 2.05, bottom_z = 0.56, bottom_hw = 0.36, chine_z = 0.89, chine_hw = 0.50, top_z = 1.018, top_hw = 0.43 },
    { y = 0.98, bottom_z = 0.50, bottom_hw = 0.42, chine_z = 0.98, chine_hw = 0.62, top_z = 1.22, top_hw = 0.56 },
    { y = 0.78, bottom_z = 0.50, bottom_hw = 0.46, chine_z = 1.02, chine_hw = 0.90, top_z = 1.50, top_hw = 0.66 },
    { y = 0.10, bottom_z = 0.50, bottom_hw = 0.50, chine_z = 1.02, chine_hw = 0.975, top_z = 1.50, top_hw = 0.72 },
    { y = -0.75, bottom_z = 0.50, bottom_hw = 0.50, chine_z = 1.02, chine_hw = 0.93, top_z = 1.50, top_hw = 0.68 },
    { y = -1.75, bottom_z = 0.52, bottom_hw = 0.44, chine_z = 1.00, chine_hw = 0.72, top_z = 1.30, top_hw = 0.52 },
    { y = -2.17, bottom_z = 0.56, bottom_hw = 0.40, chine_z = 0.90, chine_hw = 0.62, top_z = 0.98, top_hw = 0.50 },
    { y = -2.25, bottom_z = 0.66, bottom_hw = 0.38, chine_z = 0.84, chine_hw = 0.56, top_z = 0.90, top_hw = 0.46 },
]

[turret]
part = "plate_turret"
open_top = true
height = 0.34                 # fixed: rim at 1.84 m, screen top at the catalog height
# ten-sided turret
plan = [[0.0, 0.74], [0.43, 0.60], [0.70, 0.23], [0.70, -0.23], [0.43, -0.60], [0.0, -0.74],
        [-0.43, -0.60], [-0.70, -0.23], [-0.70, 0.23], [-0.43, 0.60]]
side_slope_deg = 26

[gun]
part = "tank_gun"
trunnion = [0.40, 0.28]
mantlet = { kind = "box", size = [0.30, 0.10, 0.18] }   # cradle behind the turret front
sleeve = [0.26, 0.04]
segments = [[0.22, 0.032, 0.030], [0.62, 0.020, 0.018]]  # 2 cm KwK 38: fixed, stays inside the hull length
muzzle_brake = "thread_protector"

[[mg]]  # MG 34 left of the 2 cm gun in the common pedestal mount
part = "pintle_mg"
position = [-0.17, 0.25, 1.74]
length = 1.0
post = 0.0
parent = "Turret"

