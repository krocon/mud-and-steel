name = "Hull_Rear"
kind = "number"
position = [0.0, -2.89, 2.10]
normal = [0.0, -1.0, 0.05]
size = 0.30

[gun]
part = "tank_gun"
trunnion = [-0.60, 2.20]      # model space: y, z
mantlet = { kind = "box", size = [1.10, 0.20, 0.55] }   # small curved shield
sleeve = [1.30, 0.12]         # cradle with the recuperator
segments = [["fit", 0.075, 0.062]]
muzzle_brake = "double_baffle"

[[mg]]  # MG 34 for local defense, on the right compartment wall
part = "pintle_mg"
position = [1.10, -2.10, 2.65]
length = 1.22
post = 0.12

[validate]
exclude_height = ["MG_*", "Antenna_*", "Gun"]   # catalog height is the compartment wall top
