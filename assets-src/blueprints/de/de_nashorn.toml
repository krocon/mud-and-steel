# Nashorn (Sd.Kfz. 164), 1943-45, prompt 063: no drawing in the reference
# folder (and none for the Hummel either); built from the published layout of
# the Geschützwagen III/IV: Panzer IV running gear (de_pz4_h.toml) with the
# Pz III sprocket, driver's box at the left front, engine in the middle under
# a raised deck, tall open fighting compartment of thin plates over the rear
# half overhanging the hull end slightly, 8.8 cm PaK 43/1 L/71 with a small
# shield and double-baffle brake, gun fitted to the catalog length (8.44 m,
# hull 5.80 m). Catalog height 2.65 m is the compartment wall top.
unit = "de_nashorn"
assembly = "casemate"

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.47
road_wheels = [1.66, 1.16, 0.71, 0.21, -0.21, -0.71, -1.16, -1.66]
sprocket = { y = 2.40, z = 0.74, diameter = 0.64, teeth = 21 }   # Pz III final drive
idler = { y = -2.40, z = 0.56, diameter = 0.60 }
return_rollers = { y = [1.45, 0.48, -0.48, -1.45], z = 0.86, diameter = 0.25 }

[hull]
part = "plate_hull"
lower = [[-2.70, 0.42], [2.25, 0.42], [2.84, 0.78], [2.90, 1.03], [-2.90, 1.03], [-2.90, 0.62]]
# low glacis to the driver's box, raised engine deck in the middle
upper = [[-2.90, 1.02], [2.90, 1.02], [2.90, 1.08], [2.30, 1.30], [-2.90, 1.30]]
upper_half_width = 1.25
fender_front = 2.90
fender_rear = -2.90
fender_slope_front = 0.18

[casemate]
part = "casemate"
open = true
wall = 0.02
z = 1.30
# open fighting compartment from +0.40 m to the rear end
plan = [[-1.36, 0.40], [1.36, 0.40], [1.36, -2.88], [-1.36, -2.88]]
side_slope_deg = 10
front_slope_deg = 22
rear_slope_deg = 3

[[part]]
part = "box_prop"             # driver's armored box, left front
center = [-0.62, 1.55, 1.55]
size = [0.75, 0.80, 0.50]

[[part]]
part = "de.driver_visor"
position = [-0.62, 1.95, 1.60]

[[part]]
part = "hull_hatch"
center = [-0.62, 1.50]
z = 1.80
size = [0.50, 0.45]
hinge = "rear"
socket = true

[[part]]
part = "deck_box"             # engine deck in the middle
center = [0.45, 1.05]
size = [1.10, 1.10, 0.06]

[[part]]
part = "exhaust"
kind = "muffler"
position = [0.0, -2.78, 0.80]
length = 0.9
diameter = 0.22

[[part]]
part = "tow_hook"
position = [0.0, -2.88, 0.60]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.82, 0.86]
pair = true
socket = false

[[part]]
part = "spare_tracks"
origin = [-0.84, 2.93, 0.90]
direction = [0.42, 0.0, 0.0]
count = 5
link_size = [0.40, 0.04, 0.12]

[[part]]
part = "de.notek"
position = [-1.15, 2.70, 1.04]

[[part]]
part = "headlight"
position = [-1.05, 2.58, 1.18]
diameter = 0.17

[[part]]
part = "tool"
kind = "shovel"
position = [-1.30, 1.2, 1.06]

[[part]]
part = "tool"
kind = "crowbar"
position = [1.30, 1.4, 1.06]

[[part]]
part = "antenna"
position = [-1.10, -2.40, 2.65]
length = 1.6

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.60, -1.40, 1.40]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.60, -1.40, 1.40]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.60, -2.30, 1.40]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.60, -2.30, 1.40]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.45, 1.05, 1.40]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.6, 1.45]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.27, -1.30, 2.05]
normal = [-0.98, 0.0, 0.17]
size = 0.45

[[part]]
part = "marking"
name = "Hull_R"
position = [1.27, -1.30, 2.05]
normal = [0.98, 0.0, 0.17]
