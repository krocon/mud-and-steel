# Panzerkampfwagen III Ausf. F (Sd.Kfz. 141), September 1939 - July 1940 (prompt
# 063, tier 3). Main dimensions from data/catalog/de.toml (onwar.com): length and
# hull 5.38 m, width 2.91 m, height 2.44 m.
# As de_pz3_g (same hull and turret; onwar.com drawing ge034pz3f.jpg, not in the
# repo) with the 3.7 cm KwK 36 L/46.5 behind the internal mantlet and the
# coaxial MG 34 beside it (the second coaxial MG is not modeled; the catalog
# counts two MG 34: coaxial and hull).
unit = "de_pz3_f"
assembly = "tank"

[layout]
hull_length = 5.38
turret_y = 0.35
turret_ring_diameter = 1.52
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
track_width = 0.36
link_pitch = 0.12
road_wheel_diameter = 0.52
road_wheels = [1.39, 0.81, 0.22, -0.36, -0.94, -1.52]
sprocket = { y = 2.23, z = 0.73, diameter = 0.66, teeth = 21 }
idler = { y = -2.20, z = 0.78, diameter = 0.60 }
return_rollers = { y = [1.30, -0.03, -1.11], z = 1.00, diameter = 0.22 }
arm = 0.28

[hull]
part = "plate_hull"
upper_half_width = 1.04
fender_z = 1.28
# lower hull: lower nose plate, flat belly at 0.40 m, rear plate under the deck overhang
lower = [[-2.50, 0.40], [2.20, 0.40], [2.78, 0.97], [2.78, 1.16], [-2.62, 1.16], [-2.62, 0.82]]
# upper nose plate, short front deck, vertical driver's plate, roof, step down
# to the engine deck, engine deck sloping to the rear
upper = [[-2.78, 1.15], [2.78, 1.15], [2.78, 1.18], [2.30, 1.36], [1.75, 1.36], [1.72, 1.57],
         [-0.77, 1.57], [-0.82, 1.50], [-2.40, 1.50], [-2.78, 1.24]]
fender_front = 2.69
fender_slope_front = 0.20

[turret]
part = "plate_turret"
height = "fit"
plan = [[-0.55, 0.95], [0.55, 0.95], [0.86, 0.55], [0.86, -0.62], [0.60, -0.90], [-0.60, -0.90],
        [-0.86, -0.62], [-0.86, 0.55]]
side_slope_deg = 25
front_slope_deg = 12

[cupola]                                # early drum cupola with six slits, taller
x = 0.0
y = -0.62
diameter = 0.66
height = 0.34
vision_blocks = 6
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [0.88, 0.34]
mantlet = { kind = "box", size = [0.56, 0.10, 0.36] }   # internal mantlet
sleeve = [0.20, 0.045]
segments = [["fit", 0.028, 0.025]]     # 3.7 cm KwK 36 L/46.5

[[mg]]  # coaxial MG 34 right of the gun
part = "mg"
mount = "coax"
position = [0.18, 0.0, 0.0]
length = 0.9

[[mg]]  # hull MG 34 in the radio operator's ball mount (right)
part = "mg"
mount = "ball"
position = [0.55, 1.73, 1.46]
length = 1.0

[[part]]
part = "de.turret_vision_ports"
x = 0.62
y = 0.90
z = 0.34

[[part]]
part = "de.driver_visor"
position = [-0.45, 1.73, 1.47]

[[part]]
part = "hull_hatch"                     # escape hatches in the hull sides are not modeled; roof hatches
