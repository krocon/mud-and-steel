center = [-1.05, -3.30, 1.45]
size = [0.55, 0.22, 0.35]

[[part]]
part = "box_prop"
center = [1.05, -3.30, 1.45]
size = [0.55, 0.22, 0.35]

[[part]]
part = "tool"
