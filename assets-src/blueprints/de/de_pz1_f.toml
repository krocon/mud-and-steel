# Panzerkampfwagen I Ausf. F (VK 1801), 1942 (prompt 063, tier 3).
# Main dimensions from data/catalog/de.toml (onwar.com): length 4.38 m, width
# 2.64 m, height 2.05 m. The two MG 34 stay inside the hull length:
# hull_length below is the catalog length minus the front fender and the rear
# tow shackles.
# Heavily armored infantry support tank (80 mm front). Shapes measured in the
# onwar.com drawing ge030pz1f.jpg (about 155 px/m; never committed): five large
# interleaved road wheels of about 0.60 m on torsion bars, large front
# sprocket, rear idler, no return rollers, very wide tracks (0.39 m, onwar.com
# data has none: estimate from the drawing) under wide fenders; narrow box
# superstructure (about 1.3 m) with a vertical front plate, engine deck
# sloping down to the rear, round escape hatch in the hull sides; small
# centered turret with a strongly sloped front and the two MG 34 in a common
# rounded mantlet. The mantlet is the `Gun` (no cannon).
unit = "de_pz1_f"
assembly = "tank"

[layout]
hull_length = 4.30
turret_y = 0.07
turret_ring_diameter = 1.00
fender_overhang = 0.12                  # wide fenders outside the tracks

[running_gear]
part = "interleaved"
rows = 2
track_width = 0.39
link_pitch = 0.11
road_wheel_diameter = 0.60
road_wheels = [0.94, 0.50, 0.07, -0.37, -0.81]
sprocket = { y = 1.73, z = 0.58, diameter = 0.62, teeth = 18 }
idler = { y = -1.61, z = 0.52, diameter = 0.52 }
arm = 0.26

[hull]
part = "plate_hull"
upper_half_width = 0.66
lower = [[-1.95, 0.40], [1.75, 0.40], [2.12, 0.85], [2.15, 1.10], [-2.15, 1.10], [-2.15, 0.70]]
# low front deck, vertical superstructure front plate, flat roof, engine deck
# sloping down to the rear
upper = [[-2.15, 1.09], [2.15, 1.09], [2.10, 1.17], [1.18, 1.18], [1.15, 1.55], [-0.58, 1.55], [-2.10, 1.18],
         [-2.15, 1.12]]
fender_front = 2.16
fender_slope_front = 0.12

[turret]
part = "plate_turret"
height = "fit"
plan = [[-0.42, 0.46], [0.42, 0.46], [0.58, 0.20], [0.58, -0.58], [-0.58, -0.58], [-0.58, 0.20]]
side_slope_deg = 10
front_slope_deg = 25

[gun]
part = "tank_gun"
trunnion = [0.50, 0.22]
mantlet = { kind = "round", size = [0.40, 0.18, 0.28] }
segments = [[0.04, 0.03, 0.03]]         # no cannon: the twin MG mantlet is the Gun

[[mg]]  # MG 34, left
part = "mg"
mount = "coax"
position = [-0.09, 0.0, 0.0]
length = 0.9

[[mg]]  # MG 34, right
part = "mg"
mount = "coax"
position = [0.09, 0.0, 0.0]
length = 0.9

[[part]]
