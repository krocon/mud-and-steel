# Sturmpanzer IV (Sd.Kfz. 166), Series IV (1944), prompt 062: `casemate`
# assembly on the Panzer IV chassis of de_pz4_h.toml (same running gear,
# lower hull and engine deck). Main dimensions from data/catalog/de.toml:
# length 5.93 m (the short 15 cm StuH 43 L/12 hardly overhangs the hull),
# hull 5.92 m, width 2.88 m with Schuerzen, height 2.52 m (casemate roof).
# Modeling estimates from photographs: the box casemate over the front two
# thirds of the hull with a 100 mm front plate sloped about 40 deg, slightly
# sloped sides, the ball mount (Kugelblende) of the howitzer, the MG 34 ball
# mount at the right of the front plate (Series IV), driver's periscope
# hood, commander's cupola left rear on the roof. Cupola, hatches and
# antenna stand above the roof and are left out of the height.
unit = "de_sturmpanzer4"
assembly = "casemate"

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.47
road_wheels = [1.66, 1.16, 0.71, 0.21, -0.21, -0.71, -1.16, -1.66]
sprocket = { y = 2.42, z = 0.74, diameter = 0.68, teeth = 20 }
idler = { y = -2.40, z = 0.56, diameter = 0.60 }
return_rollers = { y = [1.45, 0.48, -0.48, -1.45], z = 0.86, diameter = 0.25 }

[hull]
part = "plate_hull"
# lower hull of the Panzer IV; the upper hull is only the engine deck behind
# the casemate and the low glacis in front of it
# (rear plate at -2.62 m as on de_pz4_h; fenders and muffler reach the hull length)
lower = [[-2.50, 0.42], [2.30, 0.42], [2.90, 0.78], [2.96, 1.03], [-2.62, 1.03], [-2.62, 0.62]]
upper = [[-2.62, 1.02], [2.96, 1.02], [2.96, 1.08], [2.50, 1.30], [-1.95, 1.40], [-2.62, 1.32]]
upper_half_width = 1.25
fender_front = 2.96
fender_rear = -2.96
fender_slope_front = 0.18

[casemate]
part = "casemate"
z = 1.30
# onwar.com drawing: front plate from about +1.95 m (hull top) to the roof
# front at +1.0 m, rear wall from -1.10 m
plan = [[-1.18, 1.95], [1.18, 1.95], [1.30, 1.70], [1.30, -1.10], [-1.30, -1.10], [-1.30, 1.70]]
side_slope_deg = 12
front_slope_deg = 40
rear_slope_deg = 12

[cupola]
x = -0.50
y = -0.45
diameter = 0.60
height = 0.20
vision_blocks = 6
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [1.50, 1.95]      # model space: y, z
mantlet = { kind = "round", size = [0.62, 0.40, 0.62] }
# no fit: the muzzle ends about 0.55 m behind the nose (drawing); the
# heavy sleeve of the Kugelblende, then the short barrel
sleeve = [0.50, 0.17]
segments = [[0.40, 0.15, 0.10]]
muzzle_brake = "none"

[[mg]]  # MG 34 in the ball mount at the right of the front plate (Series IV)
part = "mg"
mount = "ball"
position = [0.78, 1.42, 1.95]
length = 0.9

[[part]]
part = "hull_hatch"           # loader's hatch on the casemate roof
center = [0.45, -0.40]
z = "casemate"
size = [0.55, 0.50]
hinge = "rear"
socket = true

[[part]]
part = "box_prop"             # driver's periscope hood on the front plate
center = [-0.60, 1.30, 2.05]
size = [0.40, 0.25, 0.14]

[[part]]
part = "skirts"
y = [-2.35, 2.05]
bottom_z = 0.48
top_z = 1.50
plates = 5
gap = 0.10

[[part]]
part = "deck_box"   # engine deck hatches
center = [0.0, -1.50]
size = [1.5, 0.9, 0.04]

[[part]]
part = "exhaust"
kind = "muffler"
position = [0.0, -2.79, 0.80]
length = 1.0
diameter = 0.24

[[part]]
part = "de.notek"
position = [-1.15, 2.75, 1.04]

[[part]]
part = "headlight"
position = [-1.05, 2.62, 1.18]
diameter = 0.17

[[part]]
part = "tool"
kind = "shovel"
position = [-1.30, -1.6, 1.06]

[[part]]
part = "tool"
kind = "jack"
position = [0.9, -2.45, 1.40]
axis = "x"

[[part]]
part = "antenna"
position = [1.10, -0.85, 2.30]
length = 2.0

[[part]]
part = "tow_hook"
position = [0.0, -2.64, 0.60]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.88, 0.86]
pair = true
socket = false

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.6, 1.45]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.6, 2.4]

[[part]]
part = "marking"
name = "Hull_L"
parent = "Skirt_L"
position = [-1.565, -0.45, 1.05]
normal = [-1, 0, 0]
size = 0.55

[[part]]
part = "marking"
name = "Hull_R"
parent = "Skirt_R"
position = [1.565, -0.45, 1.05]
normal = [1, 0, 0]
size = 0.55

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -0.95, 2.10]
normal = [0.0, -1.0, 0.1]
size = 0.35

[validate]
exclude_height = ["Cupola", "MG_*", "Hatch_*", "Antenna_*"]   # catalog height is the casemate roof
# Catalog width (2.88 m) as the Panzer IV: without the 5 mm hull skirts.
exclude_width = ["Skirt_*"]
