from = [-0.35, -2.70, 0.95]
to = [-0.35, -2.70, 1.58]
radius = 0.07
material = "Metal"

[[part]]
part = "cylinder_prop"
from = [0.35, -2.70, 0.95]
to = [0.35, -2.70, 1.58]
radius = 0.07
material = "Metal"

[[part]]
