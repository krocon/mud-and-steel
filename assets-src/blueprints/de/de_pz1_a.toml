# Panzerkampfwagen I Ausf. A (Sd.Kfz. 101), 1934-36 (prompt 063, tier 3).
# Main dimensions from data/catalog/de.toml (onwar.com): length 4.02 m, width
# 2.06 m, height 1.72 m (the drawing gives about 1.66 m to the turret roof;
# the catalog value wins). The MGs stay inside the hull length: hull_length
# below is the drawing length minus the front fender.
# Shapes measured in the onwar.com drawing ge027pz1a.jpg (about 157 px/m; never
# committed). Against the Ausf. B (de_pz1_b): shorter hull, four road wheels
# (front one on a coil spring, a leaf-sprung pair, the rear one with the
# idler on the outer girder), the large rear idler on the ground, three
# return rollers, shorter engine deck with the air-cooled Krupp engine, the
# turret a little further back. Same turret offset to the right and the twin
# MG mantlet as the `Gun` (no cannon).
unit = "de_pz1_a"
assembly = "tank"

[layout]
hull_length = 3.98
turret_y = -0.05
turret_ring_diameter = 0.95
fender_overhang = 0.05                  # the outer girder stands outside the track

[running_gear]
part = "small_wheel_bogie"
bogies = [[0], [1, 2], [3]]
spring = "leaf"
girder = true
track_width = 0.28
link_pitch = 0.09
road_wheel_diameter = 0.52
road_wheels = [1.02, 0.44, -0.16, -0.77]
sprocket = { y = 1.62, z = 0.47, diameter = 0.46, teeth = 16 }
idler = { y = -1.37, z = 0.30, diameter = 0.54 }
return_rollers = { y = [0.73, 0.06, -0.54], z = 0.64, diameter = 0.16 }

[hull]
part = "plate_hull"
upper_half_width = 0.90
# lower hull: belly at the ground clearance, sloped nose under the front deck
lower = [[-1.70, 0.30], [1.45, 0.30], [1.90, 0.60], [1.95, 0.90], [-1.98, 0.90], [-1.98, 0.55]]
# low front deck, superstructure with the turret, engine deck stepped down
upper = [[-1.98, 0.89], [1.95, 0.89], [1.90, 0.97], [0.62, 1.00], [0.57, 1.34], [-0.62, 1.34], [-0.72, 1.15],
         [-1.80, 1.08], [-1.98, 0.98]]
fender_front = 1.96
fender_slope_front = 0.15

[turret]
part = "plate_turret"
height = "fit"
x = 0.18
plan = [[-0.36, 0.55], [0.36, 0.55], [0.48, 0.30], [0.48, -0.40], [0.34, -0.58], [-0.34, -0.58], [-0.48, -0.40],
        [-0.48, 0.30]]
side_slope_deg = 12
front_slope_deg = 10

[gun]
part = "tank_gun"
trunnion = [0.50, 0.13]
x = 0.18
mantlet = { kind = "box", size = [0.42, 0.10, 0.20] }
segments = [[0.04, 0.03, 0.03]]       # no cannon: the twin MG mantlet is the Gun

[[mg]]  # MG 34, left
part = "mg"
mount = "coax"
position = [-0.09, 0.0, 0.0]
length = 0.55

[[mg]]  # MG 34, right
part = "mg"
mount = "coax"
position = [0.09, 0.0, 0.0]
length = 0.55

[[part]]
part = "turret_hatch"                 # split roof hatch
x = 0.18
y = -0.15
size = [0.45, 0.45]
socket = true

[[part]]
part = "box_prop"                     # vision ports in the superstructure sides
center = [-0.91, 0.30, 1.20]
size = [0.03, 0.30, 0.08]

[[part]]
part = "box_prop"
center = [0.91, 0.30, 1.20]
size = [0.03, 0.30, 0.08]

[[part]]
part = "hull_hatch"                   # driver's hatch, left of the turret
center = [-0.45, 0.30]
z = 1.34
size = [0.40, 0.40]
hinge = "rear"

[[part]]
part = "deck_box"                     # engine deck hatches
center = [0.0, -1.35, 1.10]
size = [1.20, 0.60, 0.04]

[[part]]
part = "deck_box"                     # air intake on the step
center = [0.45, -0.85, 1.13]
size = [0.55, 0.40, 0.05]

[[part]]
part = "exhaust"                      # muffler on the left rear fender
kind = "pipe"
position = [-0.92, -1.05, 1.00]
length = 0.60
diameter = 0.16

[[part]]
part = "tow_hook"
position = [0.0, -1.90, 0.55]
