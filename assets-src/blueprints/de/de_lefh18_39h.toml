# 10.5 cm leFH 18 (Sf.) auf Geschützwagen 39H(f), 1942 (prompt 063, group
# ger-heavy): captured Hotchkiss H39 with an open compartment; chassis of
# de_pak40_39h.
# Main dimensions from data/catalog/de.toml: hull 4.22 m and width 1.95 m
# (H39), length 5.49 m with the gun and height 2.20 m taken from the
# onwar.com drawing by this session (the source page has no dimensions).
# Measured on the drawing (docs/.vorlagen, not in the repo; about 151 px/m,
# scaled to the 4.22 m hull): six 0.36 m road wheels in three scissor
# bogies, two return rollers, FRONT sprocket, rear idler; track width and
# ground clearance not in data.json (H39: about 0.27 m and 0.37 m); cast hull
# between the tracks with the deck at about 1.25 m; open compartment from
# +0.80 m (base) with a front plate sloped 26 deg to +0.34 m at 2.17 m, wall
# tops falling to 2.04 m at -1.52 m (flat in the model), rear plate sloped
# down to -1.78 m; leFH 18 with its own narrow shield, recuperator under the
# barrel and double-baffle muzzle brake.
unit = "de_lefh18_39h"
assembly = "casemate"

[layout]
fender_overhang = 0.10   # compartment as wide as the catalog width, tracks 1.75 m

[running_gear]
part = "small_wheel_bogie"              # H39: three scissor bogies of two wheels
per_bogie = 2
spring = "coil"
track_width = 0.27
link_pitch = 0.08
road_wheel_diameter = 0.36
road_wheels = [1.33, 0.83, 0.34, -0.16, -0.69, -1.19]
sprocket = { y = 1.86, z = 0.55, diameter = 0.48, teeth = 13 }
idler = { y = -1.78, z = 0.55, diameter = 0.48 }
return_rollers = { y = [0.64, -0.56], z = 0.78, diameter = 0.18 }

[hull]
part = "plate_hull"
lower = [[-1.95, 0.37], [1.85, 0.37], [2.11, 0.70], [2.11, 0.92], [-2.11, 0.92], [-2.11, 0.60]]
# cast hull: sloped nose up to the deck at 1.26 m
upper = [[-2.11, 0.91], [2.11, 0.91], [1.20, 1.26], [-2.11, 1.26]]
upper_half_width = 0.80
upper_side_slope_deg = 12
cast = true
fender_front = 2.11
fender_rear = -2.05

[casemate]
part = "casemate"
open = true
wall = 0.02
height = "fit"
z = 1.25
plan = [[-0.90, 0.80], [0.90, 0.80], [0.90, -1.78], [-0.90, -1.78]]
top_plan = [[-0.975, 0.34], [0.975, 0.34], [0.975, -1.52], [-0.975, -1.52]]

[gun]
part = "tank_gun"
trunnion = [0.30, 1.94]                 # model space
mantlet = { kind = "box", size = [0.62, 0.08, 0.50] }   # the howitzer's own narrow shield
sleeve = [0.90, 0.09]
segments = [["fit", 0.068, 0.062]]
muzzle_brake = "double_baffle"

[[mg]]  # MG 34 (loose) on the right compartment wall
part = "pintle_mg"
position = [0.65, -1.10, 1.85]
length = 1.22
post = 0.05

[[part]]
part = "cylinder_prop"                  # recuperator under the barrel
from = [0.0, 0.50, 1.80]
to = [0.0, 1.95, 1.80]
radius = 0.07
material = "Metal"
segments = 8

[[part]]
part = "cylinder_prop"                  # recuperator over the barrel
from = [0.0, 0.90, 2.08]
to = [0.0, 1.95, 2.08]
radius = 0.065
material = "Metal"
segments = 8

[[part]]
part = "box_prop"                       # driver's hood in front of the compartment
center = [-0.35, 1.25, 1.32]
size = [0.55, 0.35, 0.14]

[[part]]
part = "box_prop"                       # stowage rack on the rear
center = [0.0, -2.00, 1.15]
size = [1.20, 0.12, 0.20]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.55, -1.85, 0.85]
length = 0.30
diameter = 0.10

[[part]]
part = "tow_hook"
position = [0.0, -2.00, 0.55]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.02, 0.60]
pair = true
socket = false

[[part]]
part = "headlight"
position = [-0.50, 1.70, 1.15]
diameter = 0.14

[[part]]
part = "de.notek"
position = [0.50, 1.70, 1.10]

[[part]]
part = "antenna"
position = [-0.85, -1.40, 2.00]
length = 1.6

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.45, -0.40, 1.26]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.45, -0.40, 1.26]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.40, -1.20, 1.26]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.40, -1.20, 1.26]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.00, 1.32]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -0.80, 1.40]

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.95, -0.70, 1.70]
normal = [-1, 0, 0]
size = 0.40

[[part]]
part = "marking"
name = "Hull_R"
position = [0.95, -0.70, 1.70]
normal = [1, 0, 0]
size = 0.40

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -1.70, 1.60]
normal = [0, -0.97, 0.26]
size = 0.35

[validate]
exclude_height = ["Antenna_*"]          # catalog height is the compartment front wall top
