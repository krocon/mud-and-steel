# Panzerkampfwagen III Ausf. M (Sd.Kfz. 141/1), October 1942 - February 1943
# (prompt 063, tier 3). Main dimensions from data/catalog/de.toml (onwar.com):
# hull 5.52 m, overall 6.41 m, width 2.95 m (without Schürzen), height 2.50 m.
# No drawing in the reference folder: built as de_pz3_l (drawing ge038pz3l.jpg,
# same hull, turret and 5 cm KwK 39 L/60) with the Ausf. M features (Wikipedia
# "Panzer III"; Doyle/Jentz): deep-wading muffler high on the rear plate, three
# smoke dischargers per side on the turret front, Schürzen on hull and turret
# (fitted from spring 1943; most Ausf. M carried them).
unit = "de_pz3_m"
assembly = "tank"

[layout]
turret_y = 0.35
turret_ring_diameter = 1.52
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.52
road_wheels = [1.39, 0.81, 0.22, -0.36, -0.94, -1.52]
sprocket = { y = 2.23, z = 0.73, diameter = 0.66, teeth = 21 }
idler = { y = -2.20, z = 0.78, diameter = 0.60 }
return_rollers = { y = [1.30, -0.03, -1.11], z = 1.00, diameter = 0.22 }
arm = 0.28

[hull]
part = "plate_hull"
upper_half_width = 1.04
fender_z = 1.28
# lower hull: lower nose plate, flat belly at 0.40 m, rear plate under the deck overhang
lower = [[-2.50, 0.40], [2.20, 0.40], [2.78, 0.97], [2.78, 1.16], [-2.62, 1.16], [-2.62, 0.82]]
# upper nose plate, short front deck, vertical driver's plate, roof, step down
# to the engine deck, engine deck sloping to the rear
upper = [[-2.78, 1.15], [2.78, 1.15], [2.78, 1.18], [2.30, 1.36], [1.75, 1.36], [1.72, 1.57],
         [-0.77, 1.57], [-0.82, 1.50], [-2.40, 1.50], [-2.78, 1.24]]
fender_front = 2.76
fender_slope_front = 0.20

[turret]
part = "plate_turret"
height = "fit"
plan = [[-0.55, 0.95], [0.55, 0.95], [0.86, 0.55], [0.86, -0.62], [0.60, -0.90], [-0.60, -0.90],
        [-0.86, -0.62], [-0.86, 0.55]]
side_slope_deg = 25
front_slope_deg = 12

[cupola]
x = 0.0
y = -0.62
diameter = 0.70
height = 0.28
vision_blocks = 5
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [0.88, 0.34]
mantlet = { kind = "box", size = [0.70, 0.24, 0.42] }   # with the spaced armor plate
sleeve = [0.40, 0.065]
segments = [["fit", 0.042, 0.036]]     # 5 cm KwK 39 L/60, no muzzle brake

[[mg]]  # coaxial MG 34 right of the gun
part = "mg"
mount = "coax"
position = [0.20, 0.10, 0.0]
length = 0.9

[[mg]]  # hull MG 34 in the radio operator's ball mount (right)
part = "mg"
mount = "ball"
position = [0.55, 1.73, 1.46]
length = 1.0

[[part]]
part = "box_prop"                       # spaced armor plate in front of the superstructure front
center = [0.0, 1.88, 1.47]
size = [1.70, 0.03, 0.22]

[[part]]
part = "turret_bustle_box"              # stowage bin on the turret rear
y = -0.90
size = [1.10, 0.62, 0.40]
z = 0.18

[[part]]
part = "de.smoke_dischargers"           # three NbK 39 per side on the turret front corners
x = 0.90
y = 0.40
z = 0.40
count = 3

[[part]]
part = "skirts"                         # Schürzen (from spring 1943)
y = [-2.10, 1.90]
bottom_z = 0.55
top_z = 1.55
plates = 5
gap = 0.08

[[part]]
part = "turret_skirt"
offset = 0.14
bottom_z = 0.02
top_z = 0.55
front_y = 0.40

[[part]]
