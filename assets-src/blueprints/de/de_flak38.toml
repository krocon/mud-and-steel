# 2 cm Flak 38 light anti-aircraft gun. Main dimensions from
# data/catalog/de.toml: length 4.08 m, width 1.81 m, height 1.60 m. The
# catalog note says these are most likely the gun on its Sd.Ah. 51 trailer;
# the gun alone (about 2.25 m) cannot reach 4.08 m. So the model shows the
# gun fired from the trailer (possible in an emergency): triangular base
# (Dreibeinlafette) with its three leveling jacks lowered to the ground, the
# trailer axle still underneath and the drawbar to the rear. The barrel is
# fitted so that towing eye to muzzle = catalog length.
# Modeling estimates from photographs: trailer wheel diameter about 0.70 m,
# platform top about 0.62 m, gunner's seat behind the gun, 20-round box
# magazine on the left of the receiver, shield (Splitterschutz) about 1.2 m
# wide whose top is the catalog height, conical flash hider ("slotted").
unit = "de_flak38"
assembly = "aa_gun"

[carriage]
part = "de.trailer_platform"
platform = { part = "cruciform_platform", center = [0.80, 0.14], z = 0.62, arms = [[180, 1.05], [60, 1.02], [300, 1.02]], beam = [0.14, 0.12], jack = [0.28, 0.10] }
drawbar_from = [0.35, -0.55, 0.50]
drawbar_to = [-2.05, 0.45]

[[axle]]
y = -0.10
diameter = 0.70
width = 0.14
track = 1.48

[mount]
part = "aa_mount"
pedestal = [0.42, 0.14]
body = [0.55, 0.62, 0.16]
cheeks = [0.28, 0.55, 0.30]
seats = [[0.0, -0.72, 0.92]]
handwheels = [[-0.36, -0.30, 1.02], [0.36, -0.30, 1.02]]
shield = { width = 1.20, height = 0.82, bottom_z = 0.78, y = 0.42, slope_deg = 14 }

[gun]
part = "field_gun"
trunnion = [0.0, 1.12]
cradle = [1.00, 0.20, 0.24]
breech = [0.40, 0.20]
segments = [[0.30, 0.045, 0.040], ["fit", 0.026, 0.024]]
muzzle_brake = "slotted"

[[part]]
part = "box_prop"            # 20-round box magazine on the left of the receiver
center = [-0.18, -0.05, 1.10]
size = [0.10, 0.30, 0.12]
material = "Metal"
parent = "Gun"

[[part]]
part = "box_prop"            # Flakvisier 38 computing sight on the left, behind the shield
center = [-0.24, -0.12, 1.30]
size = [0.10, 0.20, 0.16]
material = "Metal"
parent = "Mount"

[[part]]
part = "crew_sockets"
radius = 1.9

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 0.9]
parent = "Carriage"

[[part]]
part = "marking"
name = "Shield"
kind = "number"
parent = "Shield"
position = [-0.35, 0.40, 1.15]
normal = [0, 0.97, 0.24]
size = 0.2
