# 15 cm sIG 33/2 (Sf) auf Jagdpanzer 38(t) "Hetzer", 1944-45 (prompt 063,
# tier 3). Main dimensions from data/catalog/de.toml (onwar.com): length
# 4.87 m (the muzzle stays behind the nose), width 2.63 m, height 2.20 m.
# The catalog has no length_hull_mm: hull_length is that of de_jgdpz38t.
# Jagdpanzer 38(t) chassis: running gear and lower hull are those of
# de_jgdpz38t (same values). Shapes measured in the onwar.com drawing
# ge058sig33hetzer.jpg (front to the left, about 151 px/m; never committed):
# the closed casemate is replaced by an open-topped box of the same sloped
# plates, its opening about 1.8 m wide from 1.0 m in front of the center to
# 1.06 m behind it (top view), the 15 cm sIG 33/2 in an armored box in the
# front plate with the recuperator under the barrel, MG 34 inside. The side
# view shows the wall tops flat only between +0.56 and -0.17 m and falling to
# the rear; the casemate part builds one roof height (open: flat wall tops).
unit = "de_sig33_jgdpz38t"
assembly = "casemate"

[layout]
hull_length = 4.77
fender_overhang = 0.045                 # the upper hull plates overhang the tracks

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.35
link_pitch = 0.10
road_wheel_diameter = 0.82
road_wheels = [1.32, 0.47, -0.47, -1.32]
sprocket = { y = 2.05, z = 0.76, diameter = 0.60, teeth = 19 }
idler = { y = -2.03, z = 0.70, diameter = 0.54 }
return_rollers = { y = [0.0], z = 0.92, diameter = 0.22 }

[hull]
part = "plate_hull"
# lower hull between the tracks: 40 deg lower nose plate, belly, undercut rear plate
lower = [[-1.80, 0.40], [1.83, 0.40], [2.385, 1.10], [-2.15, 1.10], [-1.95, 0.55]]
# thin deck at track-top level (front and rear mudguards); everything above is the casemate
upper = [[-2.385, 1.10], [2.385, 1.10], [2.385, 1.14], [-2.385, 1.14]]

[casemate]
part = "casemate"
open = true
wall = 0.02
height = "fit"
plan = [[-1.30, 2.20], [1.30, 2.20], [1.30, -1.80], [-1.30, -1.80]]
top_plan = [[-0.90, 1.00], [0.90, 1.00], [0.90, -1.06], [-0.90, -1.06]]

[gun]
part = "tank_gun"
trunnion = [1.15, 1.89]                 # model space: in the armored box of the front plate
mantlet = { kind = "box", size = [0.60, 0.40, 0.55] }
sleeve = [0.50, 0.10]                   # cradle with the recuperator below the barrel
segments = [["fit", 0.130, 0.115]]      # short 15 cm sIG 33/2 barrel
muzzle_brake = "none"

[[mg]]  # MG 34 on a post in the compartment
part = "pintle_mg"
position = [-0.60, -0.70, 2.05]
length = 1.22
post = 0.10

[[part]]
part = "exhaust"                        # muffler across the top of the rear plate
kind = "muffler"
position = [0.25, -2.20, 1.26]
length = 0.90
diameter = 0.22

[[part]]
part = "tow_hook"
position = [0.0, -2.02, 0.70]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.14, 0.80]
pair = true
socket = false

[[part]]
part = "spare_tracks"                   # spare links on the rear plate
origin = [-0.85, -2.01, 1.235]
direction = [0.11, 0.0, 0.0]
count = 5
link_size = [0.10, 0.04, 0.16]

[[part]]
part = "antenna"
position = [0.80, -1.20, 1.70]
length = 1.8

[[part]]
part = "de.notek"
position = [-1.00, 2.28, 1.20]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.45, -0.30, 1.14]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.45, -0.30, 1.14]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.0, -0.90, 1.14]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.5, 1.40]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.5, 1.30]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.10, -0.3, 1.55]
normal = [-0.89, 0.0, 0.45]
size = 0.45

[[part]]
part = "marking"
name = "Hull_R"
position = [1.10, -0.3, 1.55]
normal = [0.89, 0.0, 0.45]
size = 0.45

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -1.60, 1.55]
normal = [0.0, -0.7, 0.7]
size = 0.24

[validate]
exclude_height = ["Antenna_*", "MG_*"]  # catalog height is the compartment wall top
