# Panzerkampfwagen I Ausf. B (Sd.Kfz. 101), 1935-37 (prompt 063, tier 3).
# Main dimensions from data/catalog/de.toml (onwar.com): length 4.42 m, width
# 2.06 m, height 1.72 m. Both MG 13 stay inside the hull length, so the catalog
# has no length_hull_mm: hull_length below is the length of the drawing minus
# the front fender curl and the rear muffler.
# Shapes measured in the onwar.com drawing ge028pz1b.jpg (side, top and front
# view, about 159 px/m; never committed): front sprocket, five road wheels of
# about 0.52 m, the front one on its own coil spring, the other four in two
# leaf-sprung pairs held by an outer girder, raised rear idler (the Ausf. B
# lengthened the hull by one road wheel), four return rollers, 0.28 m track.
# Low front deck, the superstructure with the vision ports in the middle, the
# small turret offset to the right (about 0.2 m in the top view), the engine
# deck stepped down behind it, the muffler on the left rear fender.
# The two MG 13 sit side by side in a common mantlet: the mantlet is the `Gun`
# (the model has no cannon), the MGs are its coaxial children.
unit = "de_pz1_b"
assembly = "tank"

[layout]
hull_length = 4.36
turret_y = 0.10
turret_ring_diameter = 0.95
fender_overhang = 0.05                  # the outer girder stands outside the track

[running_gear]
part = "small_wheel_bogie"
bogies = [[0], [1, 2], [3, 4]]
spring = "leaf"
girder = true
track_width = 0.28
link_pitch = 0.09
road_wheel_diameter = 0.52
road_wheels = [1.15, 0.56, -0.04, -0.64, -1.21]
sprocket = { y = 1.75, z = 0.51, diameter = 0.48, teeth = 16 }
idler = { y = -1.77, z = 0.40, diameter = 0.50 }
return_rollers = { y = [0.92, 0.34, -0.26, -0.89], z = 0.66, diameter = 0.16 }

[hull]
part = "plate_hull"
upper_half_width = 0.90
# lower hull: belly at the ground clearance, sloped nose under the front deck
lower = [[-2.05, 0.30], [1.55, 0.30], [2.05, 0.62], [2.12, 0.90], [-2.15, 0.90], [-2.15, 0.50]]
# low front deck, superstructure with the turret, engine deck stepped down
upper = [[-2.15, 0.89], [2.12, 0.89], [2.05, 0.97], [0.92, 1.03], [0.76, 1.30], [-0.50, 1.30], [-0.60, 1.17],
         [-1.05, 1.17], [-2.00, 1.03], [-2.15, 0.96]]
fender_front = 2.18
fender_slope_front = 0.15

[turret]
part = "plate_turret"
height = "fit"
x = 0.18
plan = [[-0.36, 0.55], [0.36, 0.55], [0.48, 0.30], [0.48, -0.40], [0.34, -0.58], [-0.34, -0.58], [-0.48, -0.40],
        [-0.48, 0.30]]
side_slope_deg = 12
front_slope_deg = 10

[gun]
part = "tank_gun"
trunnion = [0.50, 0.13]
x = 0.18
mantlet = { kind = "box", size = [0.42, 0.10, 0.20] }
segments = [[0.04, 0.03, 0.03]]       # no cannon: the twin MG mantlet is the Gun

[[mg]]  # MG 13, left
part = "mg"
mount = "coax"
position = [-0.09, 0.0, 0.0]
length = 0.55

[[mg]]  # MG 13, right
part = "mg"
mount = "coax"
position = [0.09, 0.0, 0.0]
length = 0.55

[[part]]
part = "turret_hatch"                 # split roof hatch
x = 0.18
y = -0.15
size = [0.45, 0.45]
socket = true

[[part]]
part = "box_prop"                     # vision ports in the superstructure sides
center = [-0.91, 0.30, 1.20]
size = [0.03, 0.30, 0.08]

[[part]]
part = "box_prop"
center = [0.91, 0.30, 1.20]
size = [0.03, 0.30, 0.08]

[[part]]
part = "hull_hatch"                   # driver's hatch, left of the turret
center = [-0.45, 0.45]
z = 1.30
size = [0.40, 0.40]
hinge = "rear"

[[part]]
part = "deck_box"                     # engine deck hatches
center = [0.0, -1.55, 1.08]
size = [1.20, 0.60, 0.04]

[[part]]
part = "deck_box"                     # air intake on the step
center = [0.45, -0.80, 1.16]
size = [0.55, 0.40, 0.05]

[[part]]
part = "exhaust"                      # muffler on the left rear fender
kind = "pipe"
position = [-0.92, -1.20, 1.00]
length = 0.60
diameter = 0.16

[[part]]
