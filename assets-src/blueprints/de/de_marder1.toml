# Marder I: 7.5 cm PaK 40/1 auf Geschützwagen Lorraine Schlepper (f)
# (Sd.Kfz. 135), 1942 (prompt 063, group ger-heavy); base of the Lorraine
# conversions (de_sfh13_lorraine).
# Main dimensions from data/catalog/de.toml (onwar.com): length 5.18 m with
# gun, width 1.88 m (over the compartment), height 2.13 m. The catalog has
# no hull length: [layout] hull_length 4.44 m, the drawing's track front to
# track rear; the compartment overhangs the tracks to 4.85 m.
# Measured on the onwar.com drawing (docs/.vorlagen, not in the repo; about
# 153 px/m along, 152 px/m in height): Lorraine 37L chassis with six 0.42 m
# road wheels in three sprung pairs, three return rollers, FRONT sprocket,
# rear idler, 0.24 m track (data.json), ground clearance 0.18 m
# (data.json); the tracks are 1.58 m wide over all (front view: 1.72 m
# against 2.05 m for the compartment, scaled to the catalog width). Low hull
# with the sloped nose and the driver's position in front, engine in the
# middle; open fighting compartment from +0.31 m to the rear end, wider at
# the top than at the base, front plate sloped 16 deg, wall tops falling
# from about 2.24 m at the front to 2.04 m at the rear (flat in the model).
# Model space: the hull profiles end at the track ends (4.44 m, centered on
# the origin with the ground contact); the open compartment overhangs them
# by 0.43 m at the rear (in the drawing the hull rear plate is hidden behind
# the compartment).
unit = "de_marder1"
assembly = "casemate"

[layout]
hull_length = 4.44
fender_overhang = 0.15   # compartment 1.88 m wide over tracks of 1.58 m

[running_gear]
part = "small_wheel_bogie"              # Lorraine: pairs of small wheels on sprung bogies
per_bogie = 2
spring = "coil"
track_width = 0.24
link_pitch = 0.09
road_wheel_diameter = 0.42
road_wheels = [1.51, 0.92, 0.39, -0.19, -0.72, -1.3]
sprocket = { y = 2.0, z = 0.56, diameter = 0.48, teeth = 15 }
idler = { y = -1.79, z = 0.59, diameter = 0.46 }
return_rollers = { y = [1.7, 0.62, -0.42], z = 0.72, diameter = 0.18 }

[hull]
part = "plate_hull"
upper_half_width = 0.79
lower = [[-1.80, 0.18], [1.84, 0.18], [2.22, 0.62], [2.22, 0.96], [-2.22, 0.96], [-2.10, 0.50]]
# low superstructure: sloped nose plate up to the deck at 1.28 m
upper = [[-2.22, 0.95], [2.22, 0.95], [2.22, 0.99], [1.51, 1.28], [-2.22, 1.28]]
fender_front = 2.19
fender_rear = -2.06
fender_slope_front = 0.10

[casemate]
part = "casemate"
open = true
wall = 0.02
height = "fit"
z = 1.27
plan = [[-0.80, 0.1], [0.80, 0.1], [0.80, -2.64], [-0.80, -2.64]]
top_plan = [[-0.94, -0.16], [0.94, -0.16], [0.94, -2.41], [-0.94, -2.41]]

[gun]
part = "tank_gun"
trunnion = [-0.26, 1.91]                # model space
mantlet = { kind = "box", size = [0.50, 0.25, 0.36] }
sleeve = [0.75, 0.075]
segments = [["fit", 0.052, 0.046]]
muzzle_brake = "double_baffle_flat"

[[mg]]  # MG 34 for local defense, on the right compartment wall
part = "pintle_mg"
position = [0.70, -1.51, 1.85]
length = 1.22
post = 0.05

[[part]]
part = "box_prop"                       # driver's hood with the vision block
center = [0.0, 1.24, 1.34]
size = [0.70, 0.40, 0.14]

[[part]]
