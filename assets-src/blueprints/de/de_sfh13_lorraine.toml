# 15 cm sFH 13/1 (Sf.) auf Geschützwagen Lorraine Schlepper (f) (Sd.Kfz.
# 135/1), 1942 (prompt 063, group ger-heavy): chassis of de_marder1.toml.
# Main dimensions from data/catalog/de.toml (onwar.com): length 5.31 m,
# hull 4.79 m, width 1.83 m, height 2.23 m. Checked against the onwar.com
# drawing (same artist and scale as the Marder I, about 152 px/m): the
# howitzer muzzle ends about 0.65 m BEHIND the track front, so the gun is
# built with fixed barrel lengths; the onwar.com "barrel overhang" 0.52 m
# equals what the recoil spade projects behind the compartment
# (4.79 + 0.52 = 5.31 m), so the spade is built raised (travel position)
# 0.52 m behind the hull. The drawing shows the spade lowered (to about
# 5.5 m) and the wall tops at about 2.14 m (catalog 2.23 m kept).
# Open compartment from -0.32 m (base) to the rear end, front plate leaning
# FORWARD to -0.12 m at the top, about as wide as the catalog width.
# Model space: running gear and fittings sit 0.115 m behind the Marder I
# values (the drawing's hull, track front to compartment rear, is centered
# on the origin; the ground contact lies 0.19 m ahead of it).
unit = "de_sfh13_lorraine"
assembly = "casemate"

[layout]
fender_overhang = 0.125  # compartment 1.83 m wide over tracks of 1.58 m (Marder I chassis)

[running_gear]
part = "small_wheel_bogie"              # Lorraine: pairs of small wheels on sprung bogies
per_bogie = 2
spring = "coil"
track_width = 0.24
link_pitch = 0.09
road_wheel_diameter = 0.42
road_wheels = [1.585, 1.005, 0.475, -0.095, -0.615, -1.195]   # Marder I stations scaled to the 4.79 m hull
sprocket = { y = 2.055, z = 0.56, diameter = 0.48, teeth = 15 }
idler = { y = -1.675, z = 0.59, diameter = 0.46 }
return_rollers = { y = [1.775, 0.705, -0.325], z = 0.72, diameter = 0.18 }

[hull]
part = "plate_hull"
upper_half_width = 0.79
lower = [[-2.115, 0.18], [1.935, 0.18], [2.315, 0.62], [2.315, 0.96], [-2.545, 0.96], [-2.415, 0.50]]
# low superstructure: sloped nose plate up to the deck at 1.28 m
upper = [[-2.545, 0.95], [2.315, 0.95], [2.315, 0.99], [1.605, 1.28], [-2.545, 1.28]]
fender_front = 2.285
fender_rear = -1.965
fender_slope_front = 0.10

[casemate]
part = "casemate"
open = true
wall = 0.02
height = "fit"
z = 1.27
plan = [[-0.80, -0.435], [0.80, -0.435], [0.80, -2.43], [-0.80, -2.43]]
top_plan = [[-0.915, -0.235], [0.915, -0.235], [0.915, -2.40], [-0.915, -2.40]]

[gun]
part = "tank_gun"
trunnion = [-0.915, 1.88]                # model space
mantlet = { kind = "box", size = [0.50, 0.22, 0.44] }
segments = [[1.05, 0.125, 0.12], [1.33, 0.11, 0.105]]   # sFH 13 L/17, muzzle at +1.78 m as drawn
muzzle_brake = "none"

[[part]]
part = "cylinder_prop"                  # recuperator under the barrel
from = [0.0, -0.665, 1.70]
to = [0.0, 0.785, 1.70]
radius = 0.07
segments = 8

[[part]]
