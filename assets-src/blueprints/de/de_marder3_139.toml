[[part]]
part = "de.notek"
position = [0.70, 2.05, 1.22]

[[part]]
part = "tool"
kind = "shovel"
position = [-0.92, -0.6, 1.10]

[[part]]
part = "antenna"
position = [0.75, -1.30, 1.84]
length = 1.6

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.40, -0.30, 1.50]

[[part]]
