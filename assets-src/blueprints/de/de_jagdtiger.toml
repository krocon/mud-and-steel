socket = false

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -2.65, 1.95]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.70, -1.40, 1.45]
normal = [-0.9, 0, 0.42]
size = 0.50

[[part]]
part = "marking"
name = "Hull_R"
position = [1.70, -1.40, 1.45]
normal = [0.9, 0, 0.42]
size = 0.50

[[part]]
part = "marking"
name = "Hull_Rear"
position = [0.0, -3.85, 1.45]
normal = [0, -1, 0]
size = 0.40

[validate]
exclude_height = ["Antenna_*"]          # catalog height is the casemate roof
