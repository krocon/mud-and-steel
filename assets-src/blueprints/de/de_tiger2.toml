# Panzerkampfwagen Tiger Ausf. B "Tiger II" (Sd.Kfz. 182), production turret
# (Henschel), 1944-45 (prompt 063, group ger-heavy); base of de_jagdtiger.
# Main dimensions from data/catalog/de.toml (onwar.com): length 10.30 m with
# gun, hull 7.30 m, width 3.76 m over the combat tracks, height 3.08 m.
# Profiles, wheel stations and turret measured on the onwar.com drawing
# (docs/.vorlagen, not in the repo; about 150 px/m along the hull, 154 px/m
# in height): nine torsion-bar stations with 0.80 m steel-tired road wheels
# overlapping in two layers (no return rollers), front sprocket, rear idler,
# 0.80 m track (data.json), ground clearance 0.49 m (data.json). Upper and
# lower glacis 50 deg, superstructure sides 25 deg, turret sides 21 deg
# (data.json armor angles). The drawing shortens the gun: barrel fitted to
# the catalog.
unit = "de_tiger2"
assembly = "tank"

[layout]
turret_y = -0.20
turret_ring_diameter = 1.85
fender_overhang = 0.03   # the outer wheel layer stands a little outside the track

[running_gear]
part = "interleaved"
rows = 2
tire = "Paint"
track_width = 0.80
link_pitch = 0.15
road_wheel_diameter = 0.80
road_wheels = [2.35, 1.815, 1.28, 0.745, 0.21, -0.325, -0.86, -1.395, -1.93]
sprocket = { y = 3.05, z = 0.84, diameter = 0.86, teeth = 18 }
idler = { y = -2.68, z = 0.55, diameter = 0.66 }
arm = 0.40

[hull]
part = "plate_hull"
# lower hull: lower glacis 50 deg up to the nose edge, rear plate
lower = [[-3.30, 0.49], [3.25, 0.49], [3.65, 0.95], [3.62, 1.00], [-3.50, 1.00], [-3.40, 0.62]]
# superstructure: upper glacis 50 deg, flat roof and engine deck, rear plate
# leaning back slightly at the top
upper = [[-3.48, 0.99], [3.65, 0.99], [2.55, 1.88], [-3.65, 1.88]]
upper_side_slope_deg = 25
fender_front = 3.55
fender_rear = -3.45

[turret]
part = "plate_turret"
height = "fit"
# narrow sloped front plate, sides widening to the middle, rear plate
plan = [[-0.68, 1.65], [0.68, 1.65], [1.25, 0.55], [1.25, -1.30], [1.05, -2.05], [-1.05, -2.05],
        [-1.25, -1.30], [-1.25, 0.55]]
side_slope_deg = 21
front_slope_deg = 0

[cupola]
x = -0.60
y = -0.70
diameter = 0.72
height = 0.30
vision_blocks = 7
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [1.50, 0.44]
mantlet = { kind = "saukopf", size = [0.82, 0.60, 0.74] }
sleeve = [0.55, 0.13]
segments = [["fit", 0.09, 0.075]]
muzzle_brake = "double_baffle"

[[mg]]  # coaxial MG 34, right of the gun
part = "mg"
mount = "coax"
position = [0.28, 0.30, 0.05]

[[mg]]  # bow MG 34 in the radio operator's ball mount, right of the glacis
part = "mg"
mount = "ball"
position = [0.75, 3.12, 1.42]
length = 0.9

[[part]]
part = "turret_hatch"                   # loader's hatch
x = 0.55
y = -0.60
diameter = 0.55
socket = true

[[part]]
part = "turret_hatch"                   # escape hatch in the turret rear plate (seen from above as a bulge)
x = 0.0
y = -1.85
diameter = 0.45

[[part]]
