# Kleiner Panzerbefehlswagen I (Sd.Kfz. 265), 1935-37 (prompt 063, tier 3).
# Main dimensions from data/catalog/de.toml (onwar.com): length 4.42 m, width
# 2.06 m, height 1.99 m. Command vehicle on the Pz.Kpfw. I Ausf. B chassis:
# the running gear and lower hull are those of de_pz1_b (same blueprint values),
# the turret is replaced by a fixed box superstructure with a low roof hatch
# housing and one MG 34 in a ball mount in the front plate, right of center.
# Shapes measured in the onwar.com drawing ge013kleinerpanzer.jpg (about
# 152 px/m; never committed): sloped front deck, superstructure front plate
# about 20 deg and rear plate about 23 deg from vertical, sides nearly
# vertical, superstructure about 1.5 m wide, roof at about 1.86 m.
# No turret: the casemate assembly builds the superstructure; the MG ball
# housing is the `Gun` (no cannon), the MG 34 its own `MG_01`.
unit = "de_pzbef1_b"
assembly = "casemate"

[layout]
hull_length = 4.36
fender_overhang = 0.05                  # the outer girder stands outside the track

[running_gear]
part = "small_wheel_bogie"
bogies = [[0], [1, 2], [3, 4]]
spring = "leaf"
girder = true
track_width = 0.28
link_pitch = 0.09
road_wheel_diameter = 0.52
road_wheels = [1.15, 0.56, -0.04, -0.64, -1.21]
sprocket = { y = 1.75, z = 0.51, diameter = 0.48, teeth = 16 }
idler = { y = -1.77, z = 0.40, diameter = 0.50 }
return_rollers = { y = [0.92, 0.34, -0.26, -0.89], z = 0.66, diameter = 0.16 }

[hull]
part = "plate_hull"
upper_half_width = 0.90
lower = [[-2.05, 0.30], [1.55, 0.30], [2.05, 0.62], [2.12, 0.90], [-2.15, 0.90], [-2.15, 0.50]]
# sloped front deck up to the superstructure, engine deck behind it
upper = [[-2.15, 0.89], [2.12, 0.89], [2.05, 0.98], [0.82, 1.24], [-0.70, 1.24], [-0.76, 1.17], [-2.00, 1.05],
         [-2.15, 0.96]]
fender_front = 2.18
fender_slope_front = 0.15

[casemate]
part = "casemate"
height = "fit"
plan = [[-0.76, 0.80], [0.76, 0.80], [0.76, -0.68], [-0.76, -0.68]]
side_slope_deg = 6
front_slope_deg = 20
rear_slope_deg = 23

[cupola]                                # low roof hatch housing
x = 0.0
y = 0.05
diameter = 0.80
height = 0.13
vision_blocks = 0
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [0.68, 1.50]                 # model space: ball housing in the front plate
x = 0.25
mantlet = { kind = "ball", size = [0.24, 0.20, 0.24] }
segments = [[0.04, 0.02, 0.02]]         # no cannon: the ball housing is the Gun

[[mg]]  # MG 34 in the ball mount
part = "mg"
mount = "ball"
position = [0.25, 0.70, 1.50]
ball_diameter = 0.20
length = 0.9

[[part]]
part = "box_prop"                       # vision ports in the superstructure sides
center = [-0.73, 0.10, 1.45]
size = [0.03, 0.30, 0.08]

[[part]]
part = "box_prop"
center = [0.73, 0.10, 1.45]
size = [0.03, 0.30, 0.08]

[[part]]
part = "plate"                          # side door on the right
corners = [[0.755, -0.35, 1.30], [0.755, 0.30, 1.30], [0.73, 0.30, 1.80], [0.73, -0.35, 1.80]]
thickness = 0.015

[[part]]
part = "deck_box"                       # engine deck hatches
center = [0.0, -1.55, 1.10]
size = [1.20, 0.60, 0.04]

[[part]]
part = "deck_box"                       # air intake behind the superstructure
center = [0.45, -0.95, 1.14]
size = [0.55, 0.30, 0.05]

[[part]]
part = "exhaust"                        # muffler on the left rear fender
kind = "pipe"
position = [-0.92, -1.20, 1.00]
length = 0.60
diameter = 0.16

[[part]]
part = "tow_hook"
position = [0.0, -2.12, 0.55]
pair = true

[[part]]
part = "tow_hook"
position = [0.0, 2.10, 0.65]
pair = true
socket = false

[[part]]
part = "headlight"
position = [-0.70, 1.95, 1.02]
diameter = 0.14

[[part]]
part = "headlight"
position = [0.70, 1.95, 1.02]
diameter = 0.14

[[part]]
part = "tool"
kind = "shovel"
position = [0.86, -0.4, 0.92]

[[part]]
part = "antenna"                        # long rod antenna of the command set
position = [0.45, -0.30, 1.88]
length = 2.0

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.4, 1.20]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 1.70]

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.74, -0.2, 1.55]
normal = [-1, 0, 0.1]
size = 0.35

[[part]]
part = "marking"
name = "Hull_R"
position = [0.74, -0.45, 1.55]
normal = [1, 0, 0.1]
size = 0.30

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -0.60, 1.55]
normal = [0, -0.92, 0.39]
size = 0.30

[validate]
exclude_height = ["Antenna_*"]          # catalog height is the roof hatch housing
