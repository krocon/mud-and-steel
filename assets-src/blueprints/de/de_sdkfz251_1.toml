# Sd.Kfz. 251/1 Ausf. D (mittlerer Schützenpanzerwagen). Main dimensions
# (length 5.80 m, width 2.10 m, height 1.75 m without MG shield) come from
# data/catalog/de.toml. Everything below is a modeling estimate in meters from
# published general arrangement drawings and photographs of the Ausf. D:
# front tires 190-18 (about 0.84 m), front track about 1.6 m, track 280 mm
# wide, six interleaved road wheel stations per side (Schachtellaufwerk),
# drive sprocket at the front of the track unit. Ausf. D features: simplified
# welded body with flat upper side plates, single sloped rear plate with two
# doors, stowage lockers integrated in the lower side plates, no vision
# ports in the compartment sides.
#
# Model space before the assembly centers the footprint: hull center at y = 0.
unit = "de_sdkfz251_1"
assembly = "halftrack"

[layout]
track_outer_x = 0.90

[running_gear]
part = "halftrack_rear"
interleaved = true
track_width = 0.28
track_thickness = 0.03
link_pitch = 0.10
road_wheel_diameter = 0.56
road_wheels = [0.12, -0.34, -0.80, -1.26, -1.72, -2.18]
sprocket = { y = 0.62, z = 0.50, diameter = 0.56, teeth = 18 }
idler = { y = -2.58, z = 0.48, diameter = 0.50, spoked = false }

[front_axle]
part = "wheel_axle"
y = 1.95
diameter = 0.84
width = 0.19
track = 1.60
spokes = 0

[hull]
part = "section_hull"
# Front to rear: radiator nose, engine hood, driver's cab with sloped front
# plate, open crew and troop compartment, sloped rear plate. Upper side plates
# lean in (about 16 deg), lower plates flare out over the tracks (stowage).
sections = [
  { y =  2.90, bottom_z = 0.66, bottom_hw = 0.36, chine_z = 0.82, chine_hw = 0.40, top_z = 0.95, top_hw = 0.30 },
  { y =  2.72, bottom_z = 0.52, bottom_hw = 0.44, chine_z = 0.95, chine_hw = 0.50, top_z = 1.22, top_hw = 0.40 },
  { y =  1.30, bottom_z = 0.48, bottom_hw = 0.50, chine_z = 1.02, chine_hw = 0.60, top_z = 1.45, top_hw = 0.50 },
  { y =  1.10, bottom_z = 0.82, bottom_hw = 0.60, chine_z = 1.05, chine_hw = 0.95, top_z = 1.50, top_hw = 0.72 },
  { y =  0.90, bottom_z = 0.82, bottom_hw = 0.60, chine_z = 1.05, chine_hw = 1.04, top_z = 1.75, top_hw = 0.84 },
  { y = -2.50, bottom_z = 0.82, bottom_hw = 0.60, chine_z = 1.05, chine_hw = 1.04, top_z = 1.75, top_hw = 0.84 },
  { y = -2.58, bottom_z = 0.82, bottom_hw = 0.60, chine_z = 1.03, chine_hw = 1.02, top_z = 1.72, top_hw = 0.82 },
  { y = -2.90, bottom_z = 0.55, bottom_hw = 0.55, chine_z = 0.80, chine_hw = 0.95, top_z = 0.86, top_hw = 0.88 },
]
open = [0.90, -2.50]
floor_z = 0.86
wall = 0.02

