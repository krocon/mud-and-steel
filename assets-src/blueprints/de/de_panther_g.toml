# Panzerkampfwagen V "Panther" Ausf. G (Sd.Kfz. 171), 1944-45: base of the
# Panther family (prompt 063, group ger-heavy).
# Main dimensions from data/catalog/de.toml (onwar.com): length 8.66 m with
# gun, hull 6.87 m, width 3.42 m over the skirts (3.27 m over the tracks),
# height 2.85 m.
# Profiles, wheel stations, turret plan and fittings measured on the onwar.com
# drawing (docs/.vorlagen, not in the repo): about 150 px/m along the hull and
# 168 px/m in height (the drawing is not to one scale). Road wheels 0.86 m
# (Jentz/Doyle, Panther Variants), 0.66 m track (data.json), ground clearance
# 0.56 m (data.json). The drawing shortens the gun: barrel fitted to the catalog.
# Ausf. G features: superstructure sides sloped 29 deg (D/A: 40 deg), no
# driver's visor in the glacis (periscope), ball-mounted bow MG, cast cupola,
# curved gun mantlet with the chin.
unit = "de_panther_g"
assembly = "tank"

[layout]
turret_y = -0.20
turret_ring_diameter = 1.65
fender_overhang = 0.075   # catalog width 3.42 m is over the skirts, tracks 3.27 m

[running_gear]
part = "interleaved"
rows = 2
track_width = 0.66
link_pitch = 0.153
road_wheel_diameter = 0.86
road_wheels = [2.18, 1.60, 1.01, 0.43, -0.15, -0.74, -1.32, -1.91]
sprocket = { y = 2.95, z = 0.72, diameter = 0.80, teeth = 17 }
idler = { y = -2.64, z = 0.73, diameter = 0.64 }
arm = 0.40

[hull]
part = "plate_hull"
# lower hull: lower nose plate 55 deg from vertical up to the nose edge,
# rear plate leaning back
lower = [[-2.85, 0.56], [2.72, 0.56], [3.43, 1.21], [3.40, 1.24], [-3.14, 1.24], [-3.06, 1.09]]
# superstructure over the tracks: upper glacis 55 deg up to the roof, flat
# roof and engine deck, rear plate leaning back at the top
upper = [[-3.14, 1.23], [3.40, 1.23], [2.15, 1.78], [-3.44, 1.78]]
upper_side_slope_deg = 29
fender_front = 3.20
fender_rear = -3.10

[turret]
part = "plate_turret"
height = "fit"
# narrow front plate with the mantlet, sides widening backwards, rounded rear
plan = [[-0.80, 1.12], [0.80, 1.12], [1.22, -0.55], [1.12, -1.05], [0.65, -1.34], [-0.65, -1.34],
        [-1.12, -1.05], [-1.22, -0.55]]
side_slope_deg = 25
front_slope_deg = 0

[cupola]
x = -0.47
y = -0.44
diameter = 0.70
height = 0.25
vision_blocks = 7
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [1.02, 0.40]
mantlet = { kind = "cast_box", size = [1.10, 0.32, 0.72] }
sleeve = [0.45, 0.12]
segments = [["fit", 0.075, 0.062]]
muzzle_brake = "double_baffle_flat"

[[mg]]  # coaxial MG 34, right of the gun in the mantlet
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.04]

[[mg]]  # bow MG 34 in the radio operator's ball mount, right of the glacis
part = "mg"
mount = "ball"
position = [0.75, 2.62, 1.58]
length = 0.9

[[part]]
part = "turret_hatch"                   # loader's escape hatch in the turret rear
x = 0.0
y = -1.10
diameter = 0.50
socket = true

[[part]]
part = "skirts"                         # Schürzen over the upper track run
y = [-3.00, 2.55]
bottom_z = 0.86
top_z = 1.22
plates = 6
gap = 0.0

[[part]]
part = "hull_hatch"                     # driver (left), opens sideways on the real tank
center = [-0.80, 1.39]
