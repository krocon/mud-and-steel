# Sturmgeschütz III Ausf. F (Sd.Kfz. 142/1), March - September 1942 (prompt 063,
# tier 3). Main dimensions from data/catalog/de.toml (onwar.com): overall 6.31 m,
# hull 5.40 m (as the other StuG III), width 2.92 m, height 2.15 m.
# Built as de_stug3_g (same chassis, raised casemate with the roof fan and the
# commander's cupola) with the Ausf. F features from the onwar.com drawing
# ge063stug3f.jpg (not in the repo): 7.5 cm StuK 40 L/43 with a single-baffle
# ball muzzle brake behind a box mantlet, no Schürzen.
unit = "de_stug3_f"
assembly = "casemate"

[layout]
hull_length = 5.40
fender_overhang = 0.03

[running_gear]
part = "torsion_bar"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.52
road_wheels = [1.45, 0.88, 0.31, -0.26, -0.84, -1.41]
sprocket = { y = 2.28, z = 0.74, diameter = 0.62, teeth = 21 }
idler = { y = -2.10, z = 0.64, diameter = 0.56 }
return_rollers = { y = [1.33, 0.05, -1.02], z = 0.90, diameter = 0.22 }
arm = 0.28

[hull]
part = "plate_hull"
lower = [[-2.62, 0.40], [2.05, 0.40], [2.70, 0.88], [2.70, 1.12], [-2.70, 1.12], [-2.70, 0.70]]
upper = [[-2.70, 1.11], [2.70, 1.11], [2.70, 1.18], [2.15, 1.45], [-2.45, 1.45], [-2.70, 1.30]]
upper_half_width = 1.38
fender_front = 2.70
fender_slope_front = 0.15

[casemate]
part = "casemate"
plan = [[-1.22, 1.40], [1.22, 1.40], [1.32, 0.90], [1.32, -0.85], [-1.32, -0.85], [-1.32, 0.90]]
side_slope_deg = 11
front_slope_deg = 30
rear_slope_deg = 5

[cupola]
x = -0.48
y = -0.35
diameter = 0.56
height = 0.22
vision_blocks = 7
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [1.12, 1.82]      # model space: y, z
x = 0.06                     # gun mounted slightly right of the center line
mantlet = { kind = "box", size = [0.50, 0.30, 0.42] }
segments = [["fit", 0.058, 0.05]]     # 7.5 cm StuK 40 L/43
muzzle_brake = "single_baffle"

[[mg]]  # MG 34 behind a folding shield at the loader's hatch
part = "pintle_mg"
position = [0.45, -0.25, 2.33]
length = 1.22
post = 0.15
shield = { width = 0.55, height = 0.38, y = 0.18, slope_deg = 10 }

[[part]]
part = "hull_hatch"           # loader's hatch on the casemate roof
center = [0.45, -0.30]
z = "casemate"
size = [0.55, 0.50]
hinge = "rear"
socket = true

[[part]]
part = "exhaust"
kind = "muffler"
position = [0.0, -2.80, 0.95]
length = 1.0
diameter = 0.24

[[part]]
part = "tow_hook"
position = [0.0, -2.75, 0.62]
pair = true

[[part]]
part = "deck_box"             # engine deck hatches
center = [0.0, -1.70]
size = [1.6, 1.1, 0.04]

[[part]]
part = "spare_tracks"         # spare links on the glacis
origin = [-0.9, 2.30, 1.30]
direction = [0.3, 0.0, 0.0]
count = 7
link_size = [0.28, 0.14, 0.04]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.6, 1.5]

[[part]]
part = "antenna"                # Fu 15/16 whip at the left rear of the casemate
position = [-1.20, -0.75, 1.62]
length = 2.0

[[part]]
part = "de.driver_visor"
position = [-0.72, 1.32, 1.90]

[[part]]
part = "de.notek"
position = [-1.15, 2.45, 1.13]

[[part]]
part = "headlight"
position = [1.10, 2.40, 1.25]
diameter = 0.17

[[part]]
part = "tool"
kind = "shovel"
position = [-1.40, -1.55, 1.15]

[[part]]
part = "tool"
kind = "crowbar"
position = [1.40, -1.40, 1.15]

[[part]]
part = "tool"
kind = "jack"
position = [0.55, -2.55, 1.30]
axis = "x"

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.27, 0.20, 1.72]
normal = [-1, 0, 0]
size = 0.40

[[part]]
part = "marking"
name = "Hull_R"
position = [1.27, 0.20, 1.72]
normal = [1, 0, 0]
size = 0.40

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -0.83, 1.80]
normal = [0.0, -1.0, 0.1]
size = 0.35

[validate]
exclude_height = ["Cupola", "MG_*", "Hatch_*", "Antenna_*"]   # catalog height is the casemate roof
