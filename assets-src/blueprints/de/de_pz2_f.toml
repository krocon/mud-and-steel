center = [0.40, -1.70, 1.23]
size = [0.60, 0.50, 0.04]

[[part]]
part = "exhaust"                        # muffler on the rear plate
kind = "muffler"
position = [-0.20, -2.34, 0.90]
length = 0.70
diameter = 0.18

[[part]]
part = "tow_hook"
