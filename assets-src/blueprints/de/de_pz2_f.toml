# Panzerkampfwagen II Ausf. F (Sd.Kfz. 121), 1941-42 (prompt 063, tier 3).
# Main dimensions from data/catalog/de.toml (onwar.com): length 4.81 m, width
# 2.28 m, height 2.15 m (with the commander's cupola). The 2 cm gun stays
# inside the hull length: hull_length as de_pz2_c.
# No drawing in the reference folder: built from the drawing of the Ausf. c
# (de_pz2_c, same running gear, hull length and turret; ge031pz2c.jpg) and the
# documented differences of the Ausf. F (Wikipedia "Panzer II"; Doyle/Jentz):
# a single flat nose plate instead of the rounded nose, a full-width vertical
# superstructure front plate with the driver's visor on the left and a dummy
# visor on the right, the commander's cupola with eight periscopes on the
# turret roof, and the 2 cm KwK 38. Values that need the drawing are open
# (docs/VEHICLE_REFS.md).
unit = "de_pz2_f"
assembly = "tank"

[layout]
hull_length = 4.64
turret_y = 0.57
turret_ring_diameter = 1.10
fender_overhang = 0.0

[running_gear]
part = "small_wheel_bogie"              # large single wheels, each on its own leaf spring
per_bogie = 1
spring = "leaf"
track_width = 0.30
link_pitch = 0.10
road_wheel_diameter = 0.56
road_wheels = [1.36, 0.73, 0.10, -0.52, -1.15]
sprocket = { y = 2.03, z = 0.56, diameter = 0.60, teeth = 18 }
idler = { y = -1.99, z = 0.56, diameter = 0.58 }
return_rollers = { y = [1.31, 0.41, -0.80, -1.45], z = 0.84, diameter = 0.20 }

[hull]
part = "plate_hull"
upper_half_width = "full"                 # full-width superstructure front plate
# lower hull: single flat nose plate, flat belly, sloped rear
lower = [[-2.20, 0.35], [1.90, 0.35], [2.30, 0.86], [2.30, 1.08], [-2.35, 1.08], [-2.35, 0.66]]
# short front deck, vertical superstructure front plate, flat roof, engine
# deck sloping down to the rear
upper = [[-2.35, 1.07], [2.30, 1.07], [2.25, 1.12], [1.60, 1.14], [1.57, 1.46], [-0.14, 1.46], [-1.90, 1.18],
         [-2.35, 1.10]]
fender_front = 2.36
fender_slope_front = 0.15

[cupola]                                # commander's cupola at the turret rear, left
x = -0.28
y = -0.30
diameter = 0.56
height = 0.20
vision_blocks = 8
hatch = "split"

[turret]
part = "plate_turret"
height = "fit"
x = -0.08
plan = [[-0.48, 0.70], [0.48, 0.70], [0.62, 0.42], [0.62, -0.70], [-0.62, -0.70], [-0.62, 0.42]]
side_slope_deg = 14
front_slope_deg = 22

[gun]
part = "tank_gun"
trunnion = [0.66, 0.20]
x = 0.0
mantlet = { kind = "box", size = [0.50, 0.12, 0.28] }
sleeve = [0.20, 0.05]
segments = [[0.72, 0.022, 0.020]]       # 2 cm KwK 38 (inside the hull length)
muzzle_brake = "thread_protector"

[[mg]]  # coaxial MG 34, left of the gun
part = "mg"
mount = "coax"
position = [-0.18, 0.0, 0.0]
length = 0.9

[[part]]
part = "box_prop"                       # dummy visor right of the driver
center = [0.40, 1.585, 1.32]
size = [0.26, 0.04, 0.10]

[[part]]
part = "box_prop"                       # vision ports in the superstructure sides
center = [-1.06, 1.10, 1.32]
size = [0.03, 0.30, 0.08]

[[part]]
part = "box_prop"
center = [1.06, 1.10, 1.32]
size = [0.03, 0.30, 0.08]

[[part]]
