# 12 cm Granatwerfer 42 heavy mortar in firing position. Main dimensions from
# data/catalog/de.toml (emplaced, estimates): length 1.90 m, width 1.30 m,
# height 1.60 m. Tube 1.865 m, caliber 120 mm (Wikipedia "Granatwerfer 42").
# A copy of the Soviet 120-PM-38: round baseplate with radial ribs, bipod with
# spreader and elevating screw, sight on the left of the collar. The elevation
# is fitted to the catalog height, the bipod feet to the catalog length and
# width. The two-wheeled transport carriage (Sd.Ah. 50-type limber) is removed
# in firing position and therefore not modeled.
# Modeling estimates from photographs: baseplate diameter about 0.80 m.
unit = "de_grw42"
assembly = "mortar"

[baseplate]
part = "baseplate"
shape = "round"
diameter = 0.80
thickness = 0.06
y = 0.0

[tube]
part = "mortar_tube"
length = 1.865
caliber = 0.120

[bipod]
part = "mortar_bipod"
foot = 0.14
leg_radius = 0.028

[[part]]
part = "de.mortar_buffers"   # twin recoil buffers above the collar, size from photographs

[[part]]
part = "crew_sockets"
radius = 1.6

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 0.4]
parent = "Carriage"

[[part]]
part = "marking"
name = "Base"
kind = "number"
parent = "Carriage"
position = [0.0, -0.28, 0.065]
normal = [0.0, 0.0, 1.0]
size = 0.15
