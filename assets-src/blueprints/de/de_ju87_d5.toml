# Junkers Ju 87 D-5 "Stuka": two-seat dive/ground-attack aircraft, inverted
# gull wing, fixed spatted gear, Jumo 211J inline engine with chin radiator,
# 2 MG 151/20 in the wings, twin MG 81Z in the rear cockpit, SC 500 on the
# centerline swing arm (crutch) that throws the bomb clear of the propeller.
# Main dimensions from data/catalog/de.toml (length 11.5 m, span 15.0 m,
# height 3.9 m). Modeling estimates from Ju 87 D three-views: wing area
# ~33.7 m2 -> root/tip chord 2.9/1.4 m, gull kink at the gear legs (track
# ~3.1 m, inner panel -14 degrees, outer +8 degrees), main wheels 840x300 mm,
# three-blade VS 11 propeller 3.4 m, SC 500 2.0 x 0.40 m, braced tailplane.
# Attitude: like de_fw190_a8 the fuselage is nearly level (the kit builds the
# wing level), so the fin top reaches the catalog height; the propeller is
# excluded from the height.
unit = "de_ju87_d5"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
# [y, width, height, z_center, exponent], tail -> nose, level flight attitude around z = 2.15 (prompt 215)
sections = [[-7.95, 0.04, 0.20, 2.15, 2.0], [-7.05, 0.34, 0.64, 2.15, 2.5], [-4.80, 0.72, 1.12, 2.14, 2.8],
            [-2.40, 0.95, 1.50, 2.12, 2.8], [-0.45, 1.00, 1.58, 2.12, 2.8], [1.20, 1.00, 1.44, 2.14, 2.6],
            [2.40, 0.90, 1.22, 2.15, 2.4], [2.85, 0.62, 0.70, 2.15, 2.0]]
segments = 16

[wing]
part = "wing"
y = 0.0
z = 1.62
root_chord = 2.90
tip_chord = 1.35
planform = "rounded"
sweep_deg = 4.0
dihedral_deg = 8.0
thickness = 0.16
aileron = [0.55, 0.92]
kink = { at = 0.21, inner_dihedral_deg = -14 }

[tail]
part = "tail"
y = -6.50
z = 2.22
span = 5.00
root_chord = 1.50
tip_chord = 0.92
planform = "rounded"
# Characteristic tall angular Ju 87 fin and broad balanced rudder
fin_outline = [[-6.25, 2.25], [-6.90, 3.68], [-7.18, 4.30], [-7.48, 4.32], [-7.52, 2.15]]
rudder_outline = [[-7.52, 1.98], [-7.52, 4.30], [-7.84, 4.28], [-8.02, 3.85], [-8.04, 2.45], [-7.84, 2.00]]

[canopy]
part = "canopy"
y = [-3.20, -0.30]
z = 2.82
width = 0.82
height = 0.56
profile = [[0.0, 0.55], [0.18, 0.88], [0.45, 0.96], [0.76, 1.0], [0.92, 0.86], [1.0, 0.45]]
frames = 5

[landing_gear]
part = "landing_gear"
fixed = true
spats = true
main_y = 0.40
main_track = 3.10
main_wheel_diameter = 0.84
strut_top_z = 1.24
ground_z = 0.00
tail_y = -7.25
tail_wheel_diameter = 0.40
tail_strut_top_z = 1.85
tail_ground_z = 0.46

[[propeller]]
part = "propeller"
position = [0.0, 2.92, 2.15]
diameter = 3.40
blades = 3
phase_deg = 90
spinner = [0.64, 0.58]
blade_width = 0.20

[[part]]
part = "box_prop"              # chin radiator under the engine
center = [0.0, 1.70, 1.48]
size = [0.75, 1.10, 0.40]

[[part]]
part = "wing_struts"           # tailplane bracing struts
struts = [[[0.20, -6.85, 1.92], [1.30, -7.05, 2.20]]]
chord = 0.08

[[part]]
part = "fixed_guns"            # MG 151/20 outboard of the gull kink
muzzles = [[2.40, 0.25, 1.34]]
length = 0.55
radius = 0.02

[[part]]
part = "flex_mg"               # MG 81Z in the rear cockpit
position = [0.0, -2.90, 2.98]
direction = [0.0, -1.0, 0.18]
length = 0.85
twin = true

[[part]]
part = "bomb_load"             # SC 500 on the swing arm
bombs = [[0.0, 0.20, 1.12]]
mirror = false
length = 2.0
diameter = 0.40
swing_arm = true

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.52, 2.10, 2.38]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.52, 2.10, 2.38]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.5, 2.68]

[[part]]
part = "marking"
name = "Wing_L"
position = [-5.4, -1.0, 2.08]
normal = [0.0, 0.0, 1.0]
size = 1.2

[[part]]
part = "marking"
name = "Wing_R"
position = [5.4, -1.0, 2.08]
normal = [0.0, 0.0, 1.0]
size = 1.2

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.40, -4.6, 2.14]
normal = [-1.0, 0.0, 0.0]
size = 0.9

[[part]]
part = "marking"
name = "Hull_R"
position = [0.40, -4.6, 2.14]
normal = [1.0, 0.0, 0.0]
size = 0.9

[[part]]
part = "shadow_proxy"

[validate]
exclude_height = ["Propeller"]
