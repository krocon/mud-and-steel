# Brückenleger IV b (prompt 055): turretless Panzer IV Ausf. C/D chassis with
# the bridge on a launching frame on top. Main dimensions from
# data/catalog/de.toml (length 11.0 m with the bridge, hull 5.92 m, width
# 3.0 m = the bridge, height 3.54 m). Running gear and hull profiles as the
# Panzer IV H blueprint (same chassis family). Modeling estimates from
# photographs: the 11 m bridge lies about 1.2 m ahead of the hull center
# (it was pushed forward over the gap), two treadways on deep side girders,
# a hand rail along each side.
unit = "de_brueckenleger4"
assembly = "bridgelayer"

[layout]
fender_overhang = 0.06

[running_gear]
part = "leaf_spring_bogie"
track_width = 0.40
link_pitch = 0.12
road_wheel_diameter = 0.47
road_wheels = [1.66, 1.16, 0.71, 0.21, -0.21, -0.71, -1.16, -1.66]
sprocket = { y = 2.42, z = 0.74, diameter = 0.68, teeth = 20 }
idler = { y = -2.52, z = 0.56, diameter = 0.60 }
return_rollers = { y = [1.45, 0.48, -0.48, -1.45], z = 0.86, diameter = 0.25 }

[hull]
part = "plate_hull"
lower = [[-2.82, 0.42], [2.30, 0.42], [2.90, 0.78], [2.96, 1.03], [-2.96, 1.03], [-2.96, 0.62]]
upper = [[-2.96, 1.02], [2.96, 1.02], [2.96, 1.08], [2.38, 1.27], [2.31, 1.70], [-1.95, 1.70],
         [-2.96, 1.56]]
fender_front = 2.96
fender_slope_front = 0.18

# Launching frame on the roof.
[[part]]
part = "box_prop"
center = [0.0, 0.40, 1.86]
size = [1.80, 3.60, 0.32]

[[part]]
part = "box_prop"
center = [0.0, 2.10, 2.20]
size = [1.60, 0.40, 0.40]

