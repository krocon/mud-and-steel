# Tiger I Ausf. E (Sd.Kfz. 181), late production 1943-44 (HL 230, steel road
# wheels not yet; rubber-tired interleaved wheels, cupola with periscopes).
# Main dimensions from data/catalog/de.toml: length 8.45 m with gun, hull
# 6.316 m, width 3.705 m over the combat tracks, height 3.00 m.
# Running gear (Jentz/Doyle, Germany's Tiger Tanks; Wikipedia "Tiger I"):
# eight torsion-bar stations per side with 800 mm road wheels interleaved in
# three layers, 725 mm combat track, front sprocket, rear idler, no return
# rollers. Hull: box hull with near-vertical 100 mm front plate (9 deg) and
# the superstructure overhanging the tracks. Turret: horseshoe plan from one
# bent 80 mm plate, flat front plate with the 100-200 mm mantlet, KwK 36 L/56
# with double-baffle muzzle brake.
# Modeling estimates from photographs and drawings: wheel stations, sprocket and
# idler positions, profiles, turret plan, cupola and hatch positions, the
# 'Feifel' air cleaners on the rear plate, tool and track-link stowage.
unit = "de_tiger1_e"
assembly = "tank"

[layout]
turret_y = 0.15
turret_ring_diameter = 1.85
fender_overhang = 0.06   # the outer wheel layer of `interleaved` (rows 3) stands 0.04 m outside the track

[running_gear]
part = "interleaved"
rows = 3
track_width = 0.725
link_pitch = 0.13
road_wheel_diameter = 0.80
road_wheels = [2.05, 1.49, 0.93, 0.37, -0.19, -0.75, -1.31, -1.87]
sprocket = { y = 2.82, z = 0.86, diameter = 0.84, teeth = 18 }
idler = { y = -2.80, z = 0.82, diameter = 0.60 }
arm = 0.40

[hull]
part = "plate_hull"
# lower hull: sloped nose plate (about 66 deg from vertical), short lower glacis
lower = [[-3.00, 0.47], [2.62, 0.47], [3.16, 1.05], [3.16, 1.24], [-3.16, 1.24], [-3.16, 0.80]]
# superstructure: short glacis, near-vertical front plate (9 deg), flat roof,
# flat engine deck, vertical rear plate
upper = [[-3.16, 1.23], [3.16, 1.23], [3.16, 1.30], [2.92, 1.40], [2.86, 1.86], [-3.16, 1.86]]
fender_front = 3.16
fender_slope_front = 0.0

[turret]
part = "plate_turret"
height = "fit"
# horseshoe: flat front plate, rounded sides and rear (one bent plate)
plan = [[-0.92, 1.02], [0.92, 1.02], [1.10, 0.60], [1.18, 0.00], [1.10, -0.62], [0.88, -1.05],
        [0.50, -1.28], [0.00, -1.36], [-0.50, -1.28], [-0.88, -1.05], [-1.10, -0.62], [-1.18, 0.00],
        [-1.10, 0.60]]
side_slope_deg = 0
front_slope_deg = 0

[cupola]
x = -0.62
y = -0.55
diameter = 0.72
height = 0.25
vision_blocks = 7
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [1.02, 0.42]
mantlet = { kind = "box", size = [1.20, 0.22, 0.66] }
sleeve = [0.55, 0.13]
segments = [["fit", 0.085, 0.075]]
muzzle_brake = "double_baffle"

[[mg]]  # coaxial MG 34, right of the 8.8 cm gun in the mantlet
part = "mg"
mount = "coax"
position = [0.28, 0.25, 0.08]

[[mg]]  # hull MG 34 in the radio operator's ball mount, right front plate
part = "mg"
mount = "ball"
position = [0.80, 2.89, 1.66]
length = 1.0

[[part]]
part = "turret_hatch"                   # loader's escape hatch (round)
x = 0.55
y = -0.35
diameter = 0.55
socket = true

[[part]]
part = "turret_bustle_box"              # stowage bin on the turret rear
y = -1.65
size = [1.10, 0.36, 0.40]
z = 0.22

[[part]]
