# Trench pieces on a 5 m grid. Sunken: z = 0 is the terrain surface; sizes are
# measured below it (parapets above the surface are left out, as in the catalog).
unit = "fort_trench_section"
assembly = "env"
sunken = true

[[variant]]
name = "Straight"
part = "trench"
role = "straight"
piece = "straight"

[[variant]]
name = "Corner"
part = "trench"
role = "corner"
piece = "corner"
fit = false                     # keeps the 5 m grid cell centered on the origin
dims_m = [3.1, 3.1, 1.7]

[[variant]]
name = "Tee"
part = "trench"
role = "t"
piece = "t"
fit = false                     # keeps the 5 m grid cell centered on the origin
dims_m = [5.0, 3.1, 1.7]

[[variant]]
name = "End"
part = "trench"
role = "end"
piece = "end"
fit = false                     # keeps the 5 m grid cell centered on the origin
dims_m = [2.5, 1.2, 1.7]
