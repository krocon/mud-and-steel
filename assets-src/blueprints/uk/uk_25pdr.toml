# QF 25-pounder Mk II on Carriage Mk I, prompt 117, built on the split-trail
# carriage with the trails closed: from above it reads as the single box trail
# of the real gun (simplification). Main dimensions from data/catalog/uk.toml
# (4.6 x 2.13 m, height at the trunnions 1.16 m). Modeling estimates from
# photographs: large 1.1 m wheels, short barrel with the double-baffle muzzle
# brake (Mk II from 1942), shield; the round firing platform is not modeled.
unit = "uk_25pdr"
assembly = "towed_gun"

[gun]
part = "field_gun"
trunnion = [0.05, 0.98]
cradle = [1.40, 0.30, 0.30]
recoil = [1.10, 0.07]
breech = [0.50, 0.28]
segments = [[1.00, 0.070, 0.062], [1.20, 0.058, 0.052]]
muzzle_brake = "double_baffle"

[carriage]
part = "split_trail_carriage"
wheel_diameter = 1.10
wheel_width = 0.25
wheel_track = 1.76
trail_spread_deg = 0
trail_width = 0.30
trail_height = 0.25
spade = [0.40, 0.30]
mount_z = 0.76
spokes = 0

[shield]
part = "gun_shield"
y = 0.40
bottom_z = 0.36
slope_deg = 10
cutout = [0.24, 0.26]
wing_width = 0.16
wing_deg = 20
spaced = true
thickness = 0.008   # 6.35 mm plates (catalog armor_turret_front_mm)

[[part]]
part = "box_prop"    # telescope sight on the left of the cradle
center = [-0.20, 0.05, 0.95]
size = [0.08, 0.28, 0.11]
parent = "Gun"

[[part]]
part = "cylinder_prop"  # elevation handwheel
from = [-0.26, -0.30, 0.70]
to = [-0.30, -0.30, 0.70]
radius = 0.09
material = "Metal"
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.50, -0.45, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.50, -0.45, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.70, -1.20, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.70, -1.20, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [-0.90, -2.00, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.90, -2.00, 0.0]
parent = "Carriage"

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 0.8]
parent = "Carriage"

[[part]]
part = "marking"
name = "Shield"
kind = "number"
parent = "Shield"
position = [-0.55, 0.37, 0.70]
normal = [0, 0.98, 0.17]
size = 0.25
