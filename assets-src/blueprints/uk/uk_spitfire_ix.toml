# Supermarine Spitfire LF Mk IXe (prompt 117; drawn anew in prompt 202 after a
# three-view of the LF IXe, before that a scaled P-51 blueprint).
# Main dimensions from data/catalog/uk.toml: length 9.47 m, wingspan 11.23 m
# (fitted), height 3.86 m.
#
# The blueprint is drawn level, in flight attitude, around the thrust line at
# z = 2.0; `ground_angle = "fit"` then sets the finished model down on its main
# wheels and tail wheel (about 12 deg nose up). The catalog height is that
# tail-down figure with one propeller blade upright.
#
# Modeling estimates, read from the three-view (judgement values, about +-5 %):
# spinner tip 2.45 m ahead of the wing root's leading edge, spinner 0.70 m
# across; cowling top nearly straight from the spinner to the windscreen, the
# belly deepest at the wing; windscreen 1.1 m behind the leading edge, hood and
# rear glazing to 3.0 m, behind them the high spine (not the cut-down rear
# fuselage of the last series) running straight down to the fin; elliptical
# wing (chord 2.54 m at the center line, 6 deg dihedral) and elliptical tailplane (span 3.20 m); fin
# with the broad pointed rudder of the late Mk IX, the rudder reaching down to
# the fuselage bottom; Rotol four-blade propeller 10 ft 9 in (3.27 m); narrow
# main gear, track 5 ft 8.5 in (1.74 m), wheels about 0.62 m; one radiator box
# under each wing, carburettor intake under the nose.
#
# Weapons from the catalog ("e" wing): one 20 mm Hispano (long barrel) and one
# .50 in (short stub inboard of it) per wing, a 500 lb bomb on the centre rack
# (store size about 1.40 x 0.33 m, estimate).
unit = "uk_spitfire_ix"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
# [y, width, height, z_center, exponent], tail to nose
sections = [[-6.55, 0.03, 0.34, 2.190, 2.0], [-5.60, 0.34, 0.55, 2.175, 2.2], [-4.40, 0.54, 0.87, 2.135, 2.3], [-3.05, 0.74, 1.24, 2.080, 2.3], [-2.40, 0.86, 1.20, 1.900, 2.6], [-1.10, 0.90, 1.24, 1.860, 2.6], [0.00, 0.88, 1.12, 1.900, 2.6], [0.90, 0.80, 0.98, 1.940, 2.5], [1.60, 0.74, 0.88, 1.970, 2.4], [1.95, 0.70, 0.74, 2.000, 2.2]]

[wing]
part = "wing"
y = 0.0
z = 1.42
root_chord = 2.54
tip_chord = 0.25
planform = "elliptical"
le_share = 0.3
dihedral_deg = 6.0
thickness = 0.13
aileron = [0.56, 0.93]

[tail]
part = "tail"
y = -5.45
z = 2.42
span = 3.20
root_chord = 1.25
tip_chord = 0.20
planform = "elliptical"
# side-view outlines [y, z]: fixed fin, and the broad pointed rudder whose
# trailing edge is the catalog length behind the spinner tip
fin_outline = [[-5.300, 2.46], [-5.750, 3.05], [-6.050, 3.42], [-6.320, 3.56], [-6.500, 3.56], [-6.500, 2.30]]
rudder_outline = [[-6.500, 2.00], [-6.500, 3.56], [-6.620, 3.70], [-6.780, 3.68], [-6.920, 3.42], [-6.986, 3.00], [-6.950, 2.55], [-6.800, 2.14], [-6.620, 2.00]]

[canopy]
part = "canopy"
# windscreen, sliding hood and the fixed rear glazing, which runs out into the
# high spine behind the cockpit
y = [-3.00, -1.05]
z = 2.42
width = 0.62
height = 0.50
profile = [[0.0, 0.62], [0.28, 0.92], [0.55, 1.0], [0.80, 0.92], [0.93, 0.70], [1.0, 0.45]]

[landing_gear]
part = "landing_gear"
main_y = 0.15
main_track = 1.74
main_wheel_diameter = 0.62
strut_top_z = 1.40
ground_z = 0.16
tail_y = -5.75
tail_wheel_diameter = 0.30
tail_strut_top_z = 1.85
tail_ground_z = 1.45

[[propeller]]
part = "propeller"
position = [0.0, 2.05, 2.00]
diameter = 3.27
blades = 4
spinner = [0.62, 0.70]
blade_width = 0.20

[[part]]
part = "box_prop"             # radiator under the left wing
center = [-1.15, -1.55, 1.24]
size = [0.56, 1.0, 0.24]
bevel = 0.03

[[part]]
part = "box_prop"             # radiator under the right wing
center = [1.15, -1.55, 1.24]
size = [0.56, 1.0, 0.24]
bevel = 0.03

[[part]]
part = "cylinder_prop"        # carburettor intake under the nose
from = [0.0, -0.30, 1.32]
to = [0.0, 0.95, 1.48]
radius = 0.10
segments = 8

[[part]]
part = "box_prop"             # exhaust stubs, left
center = [-0.37, 1.15, 2.05]
size = [0.06, 0.85, 0.07]
material = "Metal"

[[part]]
part = "box_prop"             # exhaust stubs, right
center = [0.37, 1.15, 2.05]
size = [0.06, 0.85, 0.07]
material = "Metal"

[[part]]
part = "fixed_guns"           # 20 mm Hispano, long barrel ahead of the leading edge
muzzles = [[1.88, 0.70, 1.62]]
length = 0.80
radius = 0.025

[[part]]
part = "fixed_guns"           # .50 in stub inboard of the cannon
muzzles = [[1.66, 0.10, 1.60]]
length = 0.20
radius = 0.02

[[part]]
part = "bomb_load"            # 500 lb bomb on the centre rack
bombs = [[0.0, -1.00, 1.02]]
length = 1.40
diameter = 0.33

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.38, 1.20, 2.10]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.38, 1.20, 2.10]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.00, 2.30]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-1.2, -1.00, 1.55]

[[part]]
part = "marking"
name = "Wing_L"               # roundel on the upper left wing
kind = "roundel"
position = [-3.4, -1.15, 1.89]
normal = [0.0, 0.0, 1.0]
size = 1.0

[[part]]
part = "marking"
name = "Wing_R"               # roundel under the right wing
kind = "roundel"
position = [3.4, -1.15, 1.64]
normal = [0.0, 0.0, -1.0]
size = 1.0

[[part]]
part = "marking"
name = "Hull_L"
kind = "roundel"
position = [-0.33, -3.60, 2.10]
normal = [-1.0, 0.0, 0.0]
size = 0.7

[[part]]
part = "marking"
name = "Hull_R"
kind = "roundel"
position = [0.33, -3.60, 2.10]
normal = [1.0, 0.0, 0.0]
size = 0.7

[[part]]
part = "shadow_proxy"
