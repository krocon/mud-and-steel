# Prompt 117: started from the blueprint of us_bofors_m1 (same family or a close relative);
# the parts are fitted to the main dimensions of data/catalog/uk.toml. Notes below
# about catalog values refer to the original entry.
#
# 40 mm Automatic Gun M1 (Bofors) on Carriage M2A1: example of the `aa_gun`
# assembly (prompt 008 kit preparation; the us session reviews and details it).
# Main dimensions from data/catalog/us.toml (travel order): length 5.69 m,
# width 1.83 m, height 2.01 m. Modeled on its wheels with the barrel
# horizontal; the outriggers are shown folded within the catalog width (the
# deployed outriggers would be wider than the catalog width).
# Modeling estimates from photographs (TM 9-252 has the details): four-wheel
# carriage, 6.00-16 tires, two layer seats, clip loader above the breech.
unit = "uk_bofors_40mm"
assembly = "aa_gun"

[carriage]
part = "cruciform_platform"
center = [1.0, 0.30]
z = 0.62
arms = [[0, 2.15], [180, 2.15], [90, 0.75], [270, 0.75]]
beam = [0.20, 0.16]

[[axle]]
y = 1.45
diameter = 0.72
width = 0.18
track = 1.54

[[axle]]
y = -1.45
diameter = 0.72
width = 0.18
