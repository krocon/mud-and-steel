# Universal Carrier Mk II, prompt 117, built like the tankettes (casemate
# assembly, the Bren in the ball mount as the "gun"). Main dimensions from
# data/catalog/uk.toml (3.66 x 2.06 x 1.57 m). Modeling estimates from
# photographs: three road wheels (about 0.52 m) per side, a Horstmann bogie of
# two in front and a single wheel behind it, rear drive sprocket, front idler;
# low open-topped armoured body with the driver and the Bren gunner in front
# and the open troop compartments at the sides of the engine. Prompt 202: the
# rear body is open (floor, side and rear walls, the engine cover with its
# guard between the two compartments) instead of a closed box.
unit = "uk_universal_carrier"
assembly = "casemate"

[layout]
hull_length = 3.60
fender_overhang = 0.04

[running_gear]
part = "small_wheel_bogie"
bogies = [[0, 1], [2]]
spring = "coil"
track_width = 0.26
track_thickness = 0.03
link_pitch = 0.08
road_wheel_diameter = 0.52
road_wheels = [0.95, 0.30, -0.65]
sprocket = { y = -1.45, z = 0.42, diameter = 0.50, teeth = 12 }
idler = { y = 1.48, z = 0.38, diameter = 0.46 }

[hull]
part = "plate_hull"
lower = [[-1.70, 0.30], [1.55, 0.30], [1.80, 0.60], [1.80, 0.85], [-1.80, 0.85], [-1.80, 0.50]]
upper = [[-1.80, 0.85], [1.80, 0.85], [1.80, 0.92], [-1.80, 0.92]]   # floor of the open body
upper_half_width = 1.02
bevel = 0.01

[casemate]                    # armoured front cab of driver and gunner
part = "casemate"
plan = [[-0.95, 1.55], [0.95, 1.55], [0.95, 0.65], [-0.95, 0.65]]
side_slope_deg = 0
front_slope_deg = 25
rear_slope_deg = 0
open = true

[gun]
part = "tank_gun"
trunnion = [1.55, 1.38]      # model space: y, z (Bren in the gunner's ball mount, right)
x = 0.35
mantlet = { kind = "ball", size = [0.20, 0.10, 0.20] }
segments = [[0.03, 0.03, 0.03]]       # no cannon: the ball mount is the Gun

[[mg]]  # Bren in the ball mount
part = "mg"
mount = "ball"
position = [0.35, 1.52, 1.38]
length = 0.35

[[part]]
part = "box_prop"             # sloped nose plate in front of the cab
center = [0.0, 1.66, 1.02]
size = [2.00, 0.26, 0.22]
bevel = 0.03

[[part]]
part = "box_prop"             # left wall of the rear body
center = [-1.00, -0.57, 1.06]
size = [0.03, 2.44, 0.30]

[[part]]
part = "box_prop"             # right wall
center = [1.00, -0.57, 1.06]
size = [0.03, 2.44, 0.30]

[[part]]
part = "box_prop"             # rear wall
center = [0.0, -1.78, 1.06]
size = [2.03, 0.03, 0.30]

[[part]]
part = "deck_box"             # engine cover between the side compartments
center = [0.0, -0.45]
size = [0.66, 1.90, 0.42]
top_inset = [0.08, 0.06]

[[part]]
part = "box_prop"             # air outlet grille on the engine cover
center = [0.0, -0.45, 1.35]
size = [0.36, 1.30, 0.02]
material = "Metal"

[[part]]
part = "box_prop"             # bench in the left compartment
center = [-0.66, -0.60, 1.10]
size = [0.50, 1.50, 0.05]
material = "Wood"

[[part]]
part = "box_prop"             # bench in the right compartment
center = [0.66, -0.60, 1.10]
size = [0.50, 1.50, 0.05]
material = "Wood"

[[part]]
part = "socket"               # driver and Bren gunner in the open front compartment
name = "Socket_Crew_"
position = [-0.40, 1.10, 1.10]

[[part]]
part = "socket"
name = "Socket_Crew_"
position = [0.40, 1.10, 1.10]

[[part]]
part = "socket"               # passengers in the rear side compartments
name = "Socket_Passenger_"
position = [-0.66, -0.90, 1.15]

[[part]]
part = "socket"
name = "Socket_Passenger_"
position = [0.66, -0.90, 1.15]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.70, -1.82, 0.80]
length = 0.06
diameter = 0.08

[[part]]
part = "headlight"
position = [-0.70, 1.81, 1.00]
diameter = 0.14

[[part]]
part = "tow_hook"             # towing hitch (Mk II)
position = [0.0, -1.66, 0.50]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -0.4, 1.36]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.02, -0.6, 1.04]
normal = [-1.0, 0.0, 0.0]
size = 0.35

[[part]]
part = "marking"
name = "Hull_R"
position = [1.02, -0.6, 1.04]
normal = [1.0, 0.0, 0.0]
size = 0.35

[[part]]
part = "marking"
name = "Rear"
kind = "number"
position = [0.0, -1.80, 1.04]
normal = [0.0, -1.0, 0.0]
size = 0.25
