# Hawker Typhoon Mk Ib (prompt 117; drawn anew in prompt 202, before that a
# scaled P-47 blueprint).
# Main dimensions from data/catalog/uk.toml: length 9.74 m, wingspan 12.67 m
# (fitted), height 4.67 m.
#
# The blueprint is drawn level, in flight attitude, around the thrust line at
# z = 2.4; `ground_angle = "fit"` then sets the finished model down on its main
# wheels and tail wheel (about 13 deg nose up). The catalog height is that
# tail-down figure with one propeller blade upright.
#
# Modeling estimates (Typhoon three-views and commonly quoted figures, all
# judgement values): three-blade de Havilland propeller 14 ft (4.27 m); deep
# nose with the chin radiator of the Sabre right behind the spinner; thick wing
# (about 17 %), chord about 2.75 m at the root, a slight inverted gull (inner
# panels 1 deg down, outer 5.5 deg up); wide main gear, track about 4.1 m,
# wheels about 0.80 m; tailplane span 13 ft (3.96 m); bubble canopy of the
# late series; fuselage about 1.0 m wide.
#
# Weapons from the catalog: four 20 mm Hispano, two per wing with long
# fairings ahead of the leading edge, and two 1,000 lb bombs on the wing racks
# (store size about 1.75 x 0.48 m, estimate).
unit = "uk_typhoon_ib"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
# [y, width, height, z_center, exponent], tail to nose; the chin radiator makes
# the nose sections deep and blunt
sections = [[-6.20, 0.03, 0.50, 2.600, 2.0], [-5.30, 0.34, 0.78, 2.540, 2.3], [-4.20, 0.60, 1.02, 2.480, 2.4], [-3.20, 0.86, 1.24, 2.420, 2.5], [-2.00, 1.00, 1.40, 2.360, 2.6], [-0.60, 1.04, 1.50, 2.300, 2.6], [0.60, 1.04, 1.62, 2.200, 2.7], [1.60, 1.02, 1.72, 2.120, 2.8], [2.30, 0.98, 1.66, 2.100, 2.8], [2.48, 0.86, 0.90, 2.400, 2.2]]

[wing]
part = "wing"
y = 0.0
z = 1.78
root_chord = 2.75
tip_chord = 1.40
sweep_deg = 3.0
dihedral_deg = 5.5
kink = { at = 0.30, inner_dihedral_deg = -1.0 }
thickness = 0.17
aileron = [0.60, 0.95]

[tail]
part = "tail"
y = -5.20
z = 2.76
span = 3.96
root_chord = 1.45
tip_chord = 0.45
planform = "elliptical"
# side-view outlines [y, z]: tall fin with a rounded top, rudder down to the
# fuselage bottom; its trailing edge is the catalog length behind the spinner tip
fin_outline = [[-4.850, 2.90], [-5.400, 3.65], [-5.700, 4.02], [-6.000, 4.14], [-6.170, 4.14], [-6.170, 2.80]]
rudder_outline = [[-6.170, 2.34], [-6.170, 4.14], [-6.310, 4.26], [-6.470, 4.20], [-6.600, 3.85], [-6.651, 3.40], [-6.610, 2.90], [-6.450, 2.48], [-6.290, 2.34]]

[canopy]
part = "canopy"
y = [-2.55, -0.85]
z = 3.02
width = 0.72
height = 0.52
bubble = true

[landing_gear]
part = "landing_gear"
main_y = 0.30
main_track = 4.08
main_wheel_diameter = 0.80
strut_top_z = 1.76
ground_z = 0.33
tail_y = -5.60
tail_wheel_diameter = 0.35
tail_strut_top_z = 2.15
tail_ground_z = 1.70

[[propeller]]
part = "propeller"
position = [0.0, 2.60, 2.40]
diameter = 4.27
blades = 3
phase_deg = 90            # one blade upright: the catalog height
spinner = [0.70, 0.86]
blade_width = 0.24

[[part]]
part = "box_prop"             # exhaust stubs, left
center = [-0.52, 1.55, 2.38]
size = [0.06, 1.0, 0.08]
material = "Metal"

[[part]]
part = "box_prop"             # exhaust stubs, right
center = [0.52, 1.55, 2.38]
size = [0.06, 1.0, 0.08]
material = "Metal"

[[part]]
part = "fixed_guns"           # four 20 mm Hispano, long fairings ahead of the leading edge
muzzles = [[1.95, 0.75, 1.75], [2.35, 0.73, 1.79]]
length = 0.90
radius = 0.035

[[part]]
part = "bomb_load"            # two 1,000 lb bombs on the wing racks
bombs = [[2.90, -1.10, 1.34]]
length = 1.75
diameter = 0.48

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.53, 1.60, 2.40]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.53, 1.60, 2.40]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.40, 2.60]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-1.4, -1.00, 1.90]

[[part]]
part = "marking"
name = "Wing_L"               # roundel on the upper left wing
kind = "roundel"
position = [-4.3, -1.20, 2.12]
normal = [0.0, 0.0, 1.0]
size = 1.1

[[part]]
part = "marking"
name = "Wing_R"               # roundel under the right wing
kind = "roundel"
position = [4.3, -1.20, 1.85]
normal = [0.0, 0.0, -1.0]
size = 1.1

[[part]]
part = "marking"
name = "Hull_L"
kind = "roundel"
position = [-0.44, -3.40, 2.42]
normal = [-1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "marking"
name = "Hull_R"
kind = "roundel"
position = [0.44, -3.40, 2.42]
normal = [1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "shadow_proxy"
