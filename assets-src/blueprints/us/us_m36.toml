# M36 (90 mm Gun Motor Carriage M36, production Apr 1944 - Jul 1945): the M10A1
# hull (Sherman chassis, sloped upper hull) with a new, deeper open-topped
# turret for the 90 mm M3. Main dimensions from data/catalog/us.toml
# (onwar.com): length 7.46 m with the gun, hull 5.97 m, width 3.05 m (upper
# hull), height 3.28 m.
# No drawing in the reference folder (docs/VEHICLE_REFS.md): hull, running gear
# and fittings as us_m10 (checked against the M10 drawing us021m10.jpg);
# turret from photographs: rounded five-sided walls 0.78 m high with sloped
# sides, cast mantlet, bustle with the counterweight, 90 mm M3 with the
# double-baffle muzzle brake of the later vehicles. The catalog lists no MG,
# so the .50 is not modeled; the 3.28 m height is taken as the top of its
# empty pintle post on the turret rear (the turret walls end at 2.72 m).
unit = "us_m36"
assembly = "tank"

[layout]
turret_y = -0.05
turret_ring_diameter = 1.75
# tracks 2.53 m wide; the catalog width 3.05 m is the upper hull (as us_m10)
fender_overhang = 0.26

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.55, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.58, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Sherman lower hull with the rounded transmission cover at the nose.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Upper hull: 55 deg glacis to the roof, flat roof and engine deck, rear
# plate sloping down.
upper = [[-2.94, 1.00], [2.20, 1.00], [2.80, 1.06], [1.56, 1.94], [-2.30, 1.94], [-2.94, 1.50]]
upper_half_width = 1.525
upper_side_slope_deg = 38
bevel = 0.02

[turret]
part = "plate_turret"
open_top = true
height = 0.78                 # walls end at 2.72 m; the pintle post reaches the catalog height
wall = 0.03
# rounded open turret relative to the ring center: mantlet face, curved
# cheeks, straight sides, rear bustle with the counterweight
plan = [[-0.55, 1.05], [0.55, 1.05], [0.95, 0.70], [1.05, 0.10], [1.00, -0.60], [0.80, -0.95], [0.75, -1.45],
        [-0.75, -1.45], [-0.80, -0.95], [-1.00, -0.60], [-1.05, 0.10], [-0.95, 0.70]]
side_slope_deg = 12
front_slope_deg = 10

[gun]
part = "tank_gun"
trunnion = [0.95, 0.36]
# cast mantlet of the 90 mm M3
mantlet = { kind = "round", size = [0.80, 0.22, 0.55] }
sleeve = [0.40, 0.11]
segments = [["fit", 0.075, 0.066]]
muzzle_brake = "double_baffle_flat"

[[part]]
part = "box_prop"             # bustle counterweight
parent = "Turret"
center = [0.0, -1.55, 2.30]
size = [1.30, 0.30, 0.40]

[[part]]
part = "cylinder_prop"        # empty .50 pintle post on the turret rear (catalog height)
parent = "Turret"
from = [0.55, -1.15, 2.60]
to = [0.55, -1.15, 3.28]
radius = 0.04

[[part]]
part = "hull_hatch"           # driver (left) and assistant driver (right)
center = [-0.55, 1.30]
size = [0.55, 0.55]
hinge = "right"
socket = true

[[part]]
part = "hull_hatch"
center = [0.55, 1.30]
size = [0.55, 0.55]
hinge = "left"
socket = true

[[part]]
part = "socket"               # gunner, loader, commander in the open turret
name = "Socket_Crew_"
parent = "Turret"
position = [-0.45, 0.10, 1.95]

[[part]]
part = "socket"
name = "Socket_Crew_"
parent = "Turret"
position = [0.45, 0.10, 1.95]

[[part]]
part = "socket"
name = "Socket_Crew_"
parent = "Turret"
position = [0.0, -0.55, 1.95]

[[part]]
part = "deck_box"             # engine deck doors
center = [0.0, -1.65]
size = [1.40, 1.10, 0.04]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.0, -2.86, 0.80]
length = 0.08
diameter = 0.22
outlet = [0.0, -2.94, 0.75]

[[part]]
part = "headlight"
position = [-1.02, 2.74, 1.18]
diameter = 0.2

[[part]]
part = "headlight"
position = [1.02, 2.74, 1.18]
diameter = 0.2

[[part]]
part = "tool"
kind = "shovel"
position = [0.6, -2.20, 1.96]
axis = "x"

[[part]]
part = "antenna"
position = [-0.95, -2.10, 1.94]
length = 2.2

[[part]]
part = "tow_hook"
position = [0.0, 2.84, 0.62]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -2.88, 0.62]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.6, 2.0]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 2.2]
parent = "Turret"

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.15, -1.2, 1.48]
normal = [-0.79, 0, 0.62]
size = 0.6

[[part]]
part = "marking"
name = "Hull_R"
position = [1.15, -1.2, 1.48]
normal = [0.79, 0, 0.62]
size = 0.6

[[part]]
part = "marking"
name = "Glacis"
position = [0.0, 2.25, 1.47]
normal = [0, 0.82, 0.57]
size = 0.6

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-0.99, -0.40, 2.25]
normal = [-0.95, 0, 0.31]
size = 0.4

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [0.99, -0.40, 2.25]
normal = [0.95, 0, 0.31]
size = 0.4

[validate]
# Height 3.28 m is over the pintle post (see the header): only the antenna is left out.
exclude_height = ["Antenna_*"]
