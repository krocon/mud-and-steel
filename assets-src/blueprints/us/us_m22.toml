[gun]
part = "tank_gun"
trunnion = [0.60, 0.27]
mantlet = { kind = "box", size = [0.50, 0.12, 0.30] }
sleeve = [0.26, 0.055]
segments = [["fit", 0.030, 0.026]]
muzzle_brake = "thread_protector"

[[mg]]  # coaxial M1919A4, right of the gun
part = "mg"
mount = "coax"
position = [0.16, 0.08, 0.0]

[validate]
exclude_height = ["Antenna_*"]
