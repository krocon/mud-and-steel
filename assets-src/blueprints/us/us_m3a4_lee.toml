# M3A4 Lee (Medium Tank M3A4, production Jun - Aug 1942): riveted hull
# lengthened by 0.51 m for the Chrysler A57 multibank engine, bogies spaced
# further apart, no side doors, 75 mm M3 and 37 mm M6. Main dimensions from
# data/catalog/us.toml (onwar.com): length 6.63 m, hull 6.15 m, width 2.64 m,
# height 3.12 m over the cupola.
# Part dimensions from the onwar.com drawing us009m3a4med.jpg (side view about
# 152 px/m along the hull, ground line y = 555; its heights come out about 3 %
# too tall, so the superstructure heights of us_m3_lee are kept). Turret,
# sponson and fittings as us_m3_lee.
unit = "us_m3a4_lee"
assembly = "tank"

[layout]
turret_y = -0.15
turret_ring_diameter = 1.40
fender_overhang = 0.025

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.15
road_wheel_diameter = 0.52
road_wheels = [2.21, 1.36, 0.54, -0.32, -1.11, -1.96]
sprocket = { y = 2.71, z = 0.80, diameter = 0.62, teeth = 13 }
idler = { y = -2.72, z = 0.72, diameter = 0.60 }
roller_offset = 0.0
return_roller_diameter = 0.22

[hull]
part = "plate_hull"
# Lower hull between the tracks: belly at 0.41 m clearance (data.json),
# rounded transmission cover at the nose.
lower = [[-2.95, 0.41], [2.55, 0.41], [2.87, 0.65], [3.05, 0.90], [3.075, 1.14], [-3.075, 1.14], [-3.075, 0.70]]
# Superstructure over the tracks: transmission cover, front plate sloping up to
# the flat roof at 2.17 m, step down to the long engine deck sloping to the rear.
upper = [[-3.075, 1.12], [3.075, 1.12], [3.075, 1.20], [2.48, 1.28], [1.52, 2.17], [-0.98, 2.17], [-1.08, 1.88],
         [-2.90, 1.70], [-3.075, 1.55]]
upper_half_width = 1.30
upper_side_slope_deg = 2
bevel = 0.015

[turret]
part = "cast_turret"
x = -0.25
length = 1.60
width = 1.52
exponent = 2.3
height = 0.71                 # roof at 2.88 m (drawing); the cupola brings it to the catalog 3.12 m
# strongly tapered cast turret (side view: top 1.3 m long against 1.6 m at the base)
profile = [[0.0, 1.0], [0.3, 0.95], [0.8, 0.76], [1.0, 0.68]]

[[part]]
part = "sponson_gun"          # 75 mm in the cast sponson, right front; listed before the exhaust
x = 0.78
y = 2.00
z = 1.79
sponson = [0.72, 0.85, 0.72]
cast = true
mantlet = { kind = "round", size = [0.42, 0.20, 0.42] }
segments = [["fit", 0.055, 0.046]]   # long 75 mm M3 (catalog length 6.12 m)
muzzle_brake = "thread_protector"

[[part]]
part = "sub_turret"           # MG cupola on the 37 mm turret, rear left
parent = "Turret"
position = [-0.35, -0.60]
z = 2.83
diameter = 0.62
height = 0.26
mgs = 1

[[part]]
part = "hull_hatch"           # roof hatch over the 75 mm gunner
center = [0.80, -0.08]
size = [0.45, 0.40]
socket = true

[[part]]
part = "deck_box"             # engine deck plates
center = [0.0, -2.10]
size = [1.60, 1.60, 0.04]

[[part]]
part = "exhaust"
kind = "muffler"
position = [-0.50, -2.93, 0.98]
length = 0.55
diameter = 0.18

[[part]]
part = "exhaust"
kind = "muffler"
position = [0.50, -2.93, 0.98]
length = 0.55
diameter = 0.18

[[part]]
part = "headlight"
position = [-1.08, 2.87, 1.28]
diameter = 0.18

[[part]]
part = "headlight"
position = [1.08, 2.87, 1.28]
diameter = 0.18

[[part]]
part = "antenna"
position = [-0.95, -0.95, 2.17]
length = 2.2

[[part]]
part = "tow_hook"
position = [0.0, 2.97, 0.62]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -2.97, 0.70]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -2.1, 1.80]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-0.25, -0.18, 2.6]
parent = "Turret"

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.31, 0.90, 1.65]
normal = [-1, 0, 0]
size = 0.55

[[part]]
part = "marking"
name = "Hull_R"
position = [1.31, -0.80, 1.65]
normal = [1, 0, 0]
size = 0.55

[[part]]
part = "marking"
name = "Glacis"
position = [-0.30, 2.12, 1.65]
normal = [0, 0.7, 0.71]
size = 0.40

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-0.95, -0.18, 2.45]
normal = [-0.95, 0, 0.3]
size = 0.35

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [0.45, -0.18, 2.45]
normal = [0.95, 0, 0.3]
size = 0.35

[gun]
part = "tank_gun"
x = -0.25
trunnion = [0.62, 0.40]
mantlet = { kind = "round", size = [0.34, 0.15, 0.30] }
sleeve = [0.32, 0.06]
segments = [[0.78, 0.030, 0.026]]   # 37 mm M5, muzzle at about y = 1.59 (drawing)
muzzle_brake = "thread_protector"

[[mg]]  # coaxial M1919A4, left of the 37 mm
part = "mg"
mount = "coax"
position = [-0.16, 0.1, 0.0]

[[mg]]  # bow M1919A4 in the driver's front plate (left)
part = "mg"
mount = "ball"
position = [-0.55, 1.81, 1.90]
length = 0.5

[validate]
# Height 3.12 m is over the MG cupola; the antenna is left out.
exclude_height = ["Antenna_*"]
