# M26 Pershing (T26E3) as used in Europe Feb-May 1945. Main dimensions from
# data/catalog/us.toml: length 8.65 m with gun, hull 6.33 m, width 3.51 m over
# the tracks, height 2.78 m. The catalog does not say over what the height is
# measured; it is taken as the top of the commander's cupola (the .50 AA MG and
# the antenna are left out, see [validate]) - this is uncertain.
# Part dimensions are modeling estimates from photographs and general
# arrangement drawings (Hunnicutt, Pershing): six dual 26 in (0.66 m) road
# wheels per side on torsion bars, five return rollers, 24 in (0.61 m) track,
# REAR drive sprocket and front idler (unlike the Sherman), 46 deg glacis
# (catalog), large cast turret with a long rear bustle, wide gun mantlet,
# 90 mm M3 with single-baffle muzzle brake, cupola on the right.
unit = "us_m26"
assembly = "tank"

[layout]
turret_y = 0.45
turret_ring_diameter = 1.75
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
track_width = 0.61
link_pitch = 0.15
road_wheel_diameter = 0.66
road_wheels = [2.05, 1.25, 0.45, -0.35, -1.15, -1.95]
sprocket = { y = -2.88, z = 0.80, diameter = 0.68, teeth = 13 }
idler = { y = 2.90, z = 0.66, diameter = 0.64 }
return_rollers = { y = [1.65, 0.85, 0.05, -0.75, -1.55], z = 1.02, diameter = 0.24 }
arm = 0.34

[hull]
part = "plate_hull"
# Lower hull between the tracks: lower nose plate and belly (17 in clearance).
lower = [[-3.05, 0.44], [2.60, 0.44], [3.12, 0.86], [3.165, 1.10], [-3.165, 1.10], [-3.165, 0.62]]
# Superstructure over the tracks: 46 deg glacis (catalog) to the hull roof,
# flat roof and engine deck, rear plate sloping down to the sprockets.
upper = [[-3.165, 1.08], [3.165, 1.08], [3.165, 1.13], [2.44, 1.83], [-2.55, 1.83], [-3.165, 1.50]]
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.75
width = 2.22
exponent = 2.8
front_scale = 0.84
y_shift = -0.30
segments = 22
# steep cast sides, flat roof with rounded edge
profile = [[0.0, 1.0], [0.62, 0.98], [0.88, 0.93], [1.0, 0.86]]

[cupola]
x = 0.48
y = -0.30
diameter = 0.70
height = 0.20
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [1.05, 0.40]
# wide, deep cast mantlet (4.5 in) with the coax and sight openings
mantlet = { kind = "rotor", size = [1.10, 0.28, 0.66] }
sleeve = [0.36, 0.13]
segments = [["fit", 0.075, 0.066]]
muzzle_brake = "single_baffle"

[[mg]]  # coaxial M1919A4, right of the gun
part = "mg"
mount = "coax"
position = [0.28, 0.25, 0.0]

[[mg]]  # bow M1919A4 in the glacis ball mount (assistant driver, right)
part = "mg"
mount = "ball"
position = [0.62, 2.80, 1.38]
length = 0.6

[[mg]]  # M2HB on the turret roof rear pintle
part = "mg"
mount = "pintle"
position = [-0.30, -0.95, 0.20]   # post stays below the cupola top (post belongs to Turret)
length = 1.65

[[part]]
part = "hull_hatch"           # driver (left) and assistant driver (right)
center = [-0.62, 2.10]
size = [0.55, 0.55]
hinge = "right"
socket = true

[[part]]
part = "hull_hatch"
center = [0.62, 2.10]
size = [0.55, 0.55]
hinge = "left"
socket = true

[[part]]
part = "turret_hatch"         # loader's hatch (left)
x = -0.45
y = -0.30
size = [0.45, 0.55]
socket = true

[[part]]
part = "deck_box"             # engine deck grilles
center = [0.0, -1.55]
size = [1.90, 1.60, 0.04]

[[part]]
part = "exhaust"
kind = "pipe"
position = [-0.70, -3.20, 1.20]
length = 0.10
diameter = 0.22
outlet = [-0.70, -3.25, 1.15]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.70, -3.20, 1.20]
length = 0.10
diameter = 0.22
outlet = [0.70, -3.25, 1.15]

[[part]]
part = "box_prop"             # rear stowage box
center = [0.0, -3.22, 1.40]
size = [1.00, 0.14, 0.30]

[[part]]
part = "headlight"
position = [-1.30, 3.05, 1.22]
diameter = 0.20

[[part]]
part = "headlight"
position = [1.30, 3.05, 1.22]
diameter = 0.20

[[part]]
part = "spare_tracks"         # spare links on the glacis (common in photographs)
origin = [-1.10, 2.85, 1.35]
direction = [0.30, 0.0, 0.0]
count = 3
link_size = [0.26, 0.16, 0.04]

[[part]]
part = "tool"
kind = "shovel"
position = [1.10, -2.40, 1.85]
axis = "x"

[[part]]
part = "tool"
kind = "sledgehammer"
position = [-1.10, -2.40, 1.85]
axis = "x"

[[part]]
part = "antenna"
position = [-0.80, -0.85, 1.83]
length = 2.4

[[part]]
part = "tow_hook"
position = [0.0, 3.16, 0.65]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -3.16, 0.65]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.5, 1.90]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.2, 2.6]
parent = "Turret"

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.755, -1.0, 1.45]
normal = [-1, 0, 0]
size = 0.7

[[part]]
part = "marking"
name = "Hull_R"
position = [1.755, -1.0, 1.45]
normal = [1, 0, 0]
size = 0.7

[[part]]
part = "marking"
name = "Glacis"
position = [0.0, 2.75, 1.48]
normal = [0, 0.72, 0.69]
size = 0.6

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-1.08, -0.50, 2.30]
normal = [-1, 0, 0]
size = 0.5

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [1.08, -0.50, 2.30]
normal = [1, 0, 0]
size = 0.5

[validate]
# Height taken as the top of the cupola (see header): AA MG and antenna left out.
exclude_height = ["MG_03", "Antenna_*"]
