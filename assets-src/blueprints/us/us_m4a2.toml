# M4A2 Sherman: welded hull, twin GM 6-71 diesel, VVSS, M34A1 mount, split
# commander's hatch. Prompt 063, derived from us_m4a3.toml. The drawing
# us013m4a2.jpg shows the late 47 deg large-hatch hull with appliqué plates on
# the sponsons (catalog armor_hull_front_deg 47): modeled that way. Main
# dimensions from data/catalog/us.toml (onwar.com): length 5.92 m = hull, the
# muzzle ends at the nose (data.json overhang 0), width 2.62 m, height 2.74 m.
unit = "us_m4a2"
assembly = "tank"

[layout]
hull_length = 5.92
turret_y = 0.22
turret_ring_diameter = 1.75
# Tracks: tread 83 in (2.11 m) + 16.56 in track = 2.53 m over the tracks
# (afvdatabase); the catalog width 2.62 m is over the sandshields.
fender_overhang = 0.045

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.55, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Lower hull between the tracks. The front is the one-piece cast differential and
# final drive housing ("sharp nose" of the M4A3(75)W): rounded from the floor
# (17 in / 0.43 m ground clearance) up to the glacis seam at about 1.08 m.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Superstructure over the tracks: 47 deg glacis (from vertical, catalog; drawing us013m4a2.jpg) from
# the nose seam to the roof, flat roof and engine deck, rear plate leaning 10 deg
# (afvdatabase: rear 10-22 deg) with a small chamfer at the deck edge.
upper = [[-2.94, 1.00], [2.20, 1.00], [2.80, 1.06], [1.94, 1.90], [-2.70, 1.90], [-2.79, 1.85],
         [-2.94, 1.04]]
# Sponsons flush with the outer track edge (2.54 m); only the sandshields reach
# the catalog width.
upper_half_width = 1.27
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.10
width = 1.86
exponent = 2.4
front_scale = 0.86
y_shift = -0.12
segments = 22
# near-vertical cast sides with a strongly rounded roof edge
profile = [[0.0, 1.0], [0.68, 1.0], [0.9, 0.94], [1.0, 0.84]]

[cupola]
x = 0.36
y = -0.30
diameter = 0.68
height = 0.10   # split commander's hatch ring, no vision cupola: turret roof 2.64 m (drawing)
vision_blocks = 0
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [0.80, 0.38]
# M34A1 mount: wide rotor shield (most of the turret face) and the narrower
# gun shield in front of it (modeled as the sleeve)
mantlet = { kind = "rotor", size = [1.06, 0.20, 0.56] }
sleeve = [0.26, 0.13]
# fixed barrel: the muzzle ends at the nose (drawing, data.json overhang 0)
segments = [[1.52, 0.055, 0.048]]
muzzle_brake = "none"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.56, 1.30]
length = 0.6   # only the barrel end protrudes from the ball

[[part]]
part = "us.transmission_cover"   # here only the rounded lip at the nose/glacis seam
y = 2.84
z = 1.05
radius = 0.05
segments = 8

[[part]]
part = "us.hatch_hoods"   # large driver's hatches
x = 0.48
y = 1.62
size = [0.55, 0.62]

[[part]]
part = "box_prop"         # appliqué plate over the right ammunition rack (drawing)
center = [1.285, 0.94, 1.52]
size = [0.03, 0.70, 0.46]

[[part]]
part = "box_prop"         # appliqué plate, left side
center = [-1.285, 0.94, 1.52]
size = [0.03, 0.70, 0.46]

[[part]]
part = "box_prop"         # diesel exhaust deflector across the rear plate
center = [0.0, -2.86, 1.62]
size = [1.7, 0.10, 0.16]

[[part]]
