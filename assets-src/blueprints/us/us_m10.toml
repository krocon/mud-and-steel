# M10 3-inch Gun Motor Carriage (M4A2 chassis, late production with turret
# counterweights). Main dimensions from data/catalog/us.toml: length 6.83 m with
# gun, hull 5.97 m, width 3.05 m (over the wide sloped upper hull), height
# 2.90 m over the AA MG.
# Part dimensions are modeling estimates from photographs and general
# arrangement drawings (Zaloga, New Vanguard 57): Sherman lower hull and VVSS
# (three bogies, 20 in road wheels, 16.56 in track, tread 83 in -> 2.53 m over
# the tracks), upper hull with 38 deg sloped side plates (bolt bosses for
# appliqué armor not modeled) and the 55 deg glacis from the catalog note,
# open-topped five-sided turret with the large rectangular gun shield and the
# two wedge-shaped counterweights on the turret rear, .50 M2HB on the turret
# rear.
unit = "us_m10"
assembly = "tank"

[layout]
turret_y = -0.05
turret_ring_diameter = 1.75
# tracks 2.53 m wide; the catalog width 3.05 m is the upper hull
fender_overhang = 0.26

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.55, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.58, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Sherman lower hull with the rounded transmission cover at the nose.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Upper hull: 55 deg glacis to the roof, flat roof and engine deck, rear
# plate sloping down.
upper = [[-2.94, 1.00], [2.20, 1.00], [2.80, 1.06], [1.56, 1.94], [-2.30, 1.94], [-2.94, 1.50]]
upper_half_width = 1.525
upper_side_slope_deg = 38
bevel = 0.02

[turret]
part = "plate_turret"
open_top = true
height = "fit"
wall = 0.03
# five-sided plan relative to the ring center: gun shield face, two long
# angled cheeks, straight short sides and the flat rear
plan = [[-0.50, 1.05], [0.50, 1.05], [1.02, 0.15], [1.00, -0.95], [-1.00, -0.95], [-1.02, 0.15]]
side_slope_deg = 18
front_slope_deg = 6

[gun]
part = "tank_gun"
trunnion = [0.95, 0.32]
# M5 mount: large rectangular gun shield (2.25 in)
mantlet = { kind = "box", size = [0.95, 0.16, 0.58] }
sleeve = [0.35, 0.10]
segments = [["fit", 0.062, 0.054]]
muzzle_brake = "thread_protector"

[[mg]]  # M2HB on the turret rear
part = "mg"
mount = "pintle"
position = [0.0, -0.80, 0.30]
length = 1.65

[[part]]
part = "box_prop"             # turret counterweights (late production)
parent = "Turret"
center = [-0.55, -1.12, 2.30]
size = [0.75, 0.34, 0.42]

[[part]]
part = "box_prop"
parent = "Turret"
center = [0.55, -1.12, 2.30]
size = [0.75, 0.34, 0.42]

[[part]]
part = "hull_hatch"           # driver (left) and assistant driver (right)
center = [-0.55, 1.30]
size = [0.55, 0.55]
hinge = "right"
socket = true

[[part]]
part = "hull_hatch"
center = [0.55, 1.30]
size = [0.55, 0.55]
hinge = "left"
socket = true

[[part]]
part = "socket"               # gunner, loader, commander in the open turret
name = "Socket_Crew_"
parent = "Turret"
position = [-0.45, 0.10, 1.95]

[[part]]
part = "socket"
name = "Socket_Crew_"
parent = "Turret"
position = [0.45, 0.10, 1.95]

[[part]]
part = "socket"
name = "Socket_Crew_"
parent = "Turret"
position = [0.0, -0.55, 1.95]

[[part]]
part = "deck_box"             # engine deck doors
center = [0.0, -1.65]
size = [1.40, 1.10, 0.04]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.0, -2.86, 0.80]
length = 0.08
diameter = 0.22
outlet = [0.0, -2.94, 0.75]

[[part]]
part = "headlight"
position = [-1.02, 2.74, 1.18]
