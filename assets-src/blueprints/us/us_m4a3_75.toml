# M4A3 (75)W Sherman, large-hatch 47 deg hull, VVSS. Main dimensions from
# data/catalog/us.toml: length 6.27 m (the 75 mm barrel hardly overhangs),
# width 2.67 m, height 2.94 m over the cupola. The catalog has no hull length;
# [layout] hull_length 5.89 m is the commonly quoted M4A3 length without gun.
# Part dimensions are modeling estimates: road wheels 20 in (508 mm), track
# 16.56 in (420 mm), 3 bogies per side, ring 69 in (1.75 m).
unit = "us_m4a3_75"
assembly = "tank"

[layout]
hull_length = 5.89
turret_y = 0.22
turret_ring_diameter = 1.75

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.55, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
lower = [[-2.80, 0.46], [2.30, 0.46], [2.48, 0.56], [2.48, 1.02], [-2.94, 1.02], [-2.94, 0.70]]
# 47 deg upper glacis, flat roof, sloped rear deck
upper = [[-2.94, 1.00], [2.78, 1.00], [2.78, 1.06], [1.90, 1.90], [-2.25, 1.90], [-2.94, 1.58]]
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.10
width = 1.86
exponent = 2.4
front_scale = 0.86
y_shift = -0.12
segments = 22
profile = [[0.0, 1.0], [0.6, 1.0], [0.88, 0.93], [1.0, 0.82]]

[cupola]
x = 0.36
y = -0.30
diameter = 0.72
height = 0.30
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.80, 0.38]
mantlet = { kind = "rotor", size = [0.92, 0.20, 0.52] }
segments = [["fit", 0.055, 0.048]]
muzzle_brake = "none"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.50, 1.30]
length = 1.0

[[mg]]  # M2HB on the turret roof pintle
part = "mg"
mount = "pintle"
position = [-0.25, -0.75, 0.42]
length = 1.65
jacket = true

