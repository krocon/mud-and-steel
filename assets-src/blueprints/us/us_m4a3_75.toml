# M4A3 (75)W Sherman, large-hatch 47 deg hull, VVSS. Main dimensions from
# data/catalog/us.toml: length 6.27 m (the 75 mm barrel hardly overhangs),
# width 2.67 m, height 2.94 m over the cupola. The catalog has no hull length;
# [layout] hull_length 5.89 m is the commonly quoted M4A3 length without gun.
# Part dimensions are modeling estimates: road wheels 20 in (508 mm), track
# 16.56 in (420 mm), 3 bogies per side, ring 69 in (1.75 m).
unit = "us_m4a3_75"
assembly = "tank"

[layout]
hull_length = 5.89
turret_y = 0.22
turret_ring_diameter = 1.75
# Tracks: tread 83 in (2.11 m) + 16.56 in track = 2.53 m over the tracks
# (afvdatabase); the catalog width 2.67 m is over the sandshields.
fender_overhang = 0.07

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.55, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Lower hull between the tracks. The front is the one-piece cast differential and
# final drive housing ("sharp nose" of the M4A3(75)W): rounded from the floor
# (17 in / 0.43 m ground clearance) up to the glacis seam at about 1.08 m.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Superstructure over the tracks: 47 deg glacis (from vertical, afvdatabase) from
# the nose seam to the roof, flat roof and engine deck, rear plate leaning 10 deg
# (afvdatabase: rear 10-22 deg) with a small chamfer at the deck edge.
upper = [[-2.94, 1.00], [2.20, 1.00], [2.80, 1.06], [1.94, 1.90], [-2.70, 1.90], [-2.79, 1.85],
         [-2.94, 1.04]]
# Sponsons flush with the outer track edge (2.54 m); only the sandshields reach
# the catalog width.
upper_half_width = 1.27
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.10
width = 1.86
exponent = 2.4
front_scale = 0.86
y_shift = -0.12
segments = 22
# near-vertical cast sides with a strongly rounded roof edge
profile = [[0.0, 1.0], [0.68, 1.0], [0.9, 0.94], [1.0, 0.84]]

[cupola]
x = 0.36
y = -0.30
diameter = 0.68
height = 0.24   # low vision cupola: turret roof ~2.7 m, cupola 2.94 m
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.80, 0.38]
# M34A1 mount: wide rotor shield (most of the turret face) and the narrower
# gun shield in front of it (modeled as the sleeve)
mantlet = { kind = "rotor", size = [1.06, 0.20, 0.56] }
sleeve = [0.26, 0.13]
segments = [["fit", 0.055, 0.048]]
muzzle_brake = "none"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.56, 1.30]
length = 1.0

[[mg]]  # M2HB on the turret roof pintle
part = "mg"
mount = "pintle"
position = [-0.25, -0.75, 0.42]
length = 1.65
jacket = true

[[part]]
part = "us.transmission_cover"   # here only the rounded lip at the nose/glacis seam
y = 2.84
z = 1.05
radius = 0.05
segments = 8

[[part]]
part = "us.hatch_hoods"
x = 0.48
y = 1.70
size = [0.55, 0.62]

[[part]]
part = "turret_hatch"   # loader's oval hatch
x = -0.42
y = -0.10
size = [0.42, 0.56]
socket = true

[[part]]
part = "skirts"          # sandshields along the sponsons
y = [-2.60, 2.30]
bottom_z = 0.82
top_z = 1.02
plates = 4
gap = -0.012
thickness = 0.008

[[part]]
