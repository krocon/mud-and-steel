# M4A1(76)W Sherman: late cast hull with the straight 47 deg glacis and large
# hatches, Continental R975 radial, VVSS, T23 turret with the 76 mm Gun M1A1
# (no muzzle brake, as drawn) and vision cupola. Prompt 063, derived from
# us_m4a1.toml. Main dimensions from data/catalog/us.toml (onwar.com): length
# 7.47 m with the gun, hull 5.84 m, width 2.67 m, height 2.97 m over the
# cupola (drawing us017m4a176w.jpg).
unit = "us_m4a1_76w"
assembly = "tank"

[layout]
turret_y = 0.15
turret_ring_diameter = 1.75
# Tracks: tread 83 in (2.11 m) + 16.56 in track = 2.53 m over the tracks
# (afvdatabase); the catalog width 2.67 m is over the sandshields.
fender_overhang = 0.07

[running_gear]
part = "vvss_bogie"
track_width = 0.42
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.55, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Lower hull between the tracks. The front is the one-piece cast differential and
# final drive housing ("sharp nose" of the M4A3(75)W): rounded from the floor
# (17 in / 0.43 m ground clearance) up to the glacis seam at about 1.08 m.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Late cast upper hull: straight 47 deg glacis (welded-in plate, large hatches),
# rounded cast sides and deck edge, rear plate leaning about 20 deg
# (drawing us017m4a176w.jpg).
upper = [[-2.94, 1.00], [2.20, 1.00], [2.80, 1.06], [1.98, 1.88], [1.80, 1.92], [-2.62, 1.92],
         [-2.80, 1.80], [-2.94, 1.10]]
# Sponsons flush with the outer track edge (2.54 m); only the sandshields reach
# the catalog width.
upper_half_width = 1.27
bevel = 0.02
cast = true

[turret]
part = "cast_turret"
height = "fit"
# T23 turret (drawings us017/us018/us020, top view 2.47 x 2.2 m, 150-159 px/m):
# round front over the 69 in ring and a long bustle reaching 1.37 m behind the
# hull center
length = 2.47
width = 2.15
exponent = 2.3
front_scale = 1.0
y_shift = -0.28
segments = 24
profile = [[0.0, 1.0], [0.6, 1.0], [0.88, 0.95], [1.0, 0.86]]

[cupola]   # all-round vision cupola, commander right rear
x = 0.45
y = -0.25
diameter = 0.68
height = 0.20
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.92, 0.40]
# M62 combination mount: broad shield, gun fitted to the catalog length
mantlet = { kind = "rotor", size = [0.95, 0.22, 0.52] }
sleeve = [0.30, 0.13]
segments = [["fit", 0.058, 0.050]]
muzzle_brake = "none"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.56, 1.30]
length = 0.6   # only the barrel end protrudes from the ball

[[part]]
part = "us.transmission_cover"   # here only the rounded lip at the nose/glacis seam
y = 2.84
z = 1.05
radius = 0.05
segments = 8

[[part]]
part = "us.hatch_hoods"   # large driver's hatches
x = 0.48
y = 1.62
size = [0.55, 0.62]

[[part]]
part = "turret_hatch"   # loader's oval hatch
x = -0.45
y = -0.15
size = [0.42, 0.56]
socket = true

[[part]]
part = "skirts"          # sandshields along the sponsons
y = [-2.60, 2.30]
bottom_z = 0.82
top_z = 1.02
plates = 4
gap = -0.012
thickness = 0.008

[[part]]
part = "deck_box"        # engine deck doors
center = [0.0, -1.25]
