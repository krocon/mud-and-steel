# M4A3(76)W HVSS Sherman ("Easy Eight"): welded 47 deg large-hatch hull of
# us_m4a3_75.toml (Ford GAA, sandshield extensions), horizontal volute spring
# suspension with 23 in tracks, T23 turret with the 76 mm gun and double-baffle
# muzzle brake (drawing us020m4a376w.jpg; the catalog names the M1A1). Prompt
# 063. Main dimensions from data/catalog/us.toml (onwar.com): length 7.54 m
# with the gun, hull 6.27 m over the sandshields, width 3.00 m over the
# tracks, height 2.97 m over the cupola.
unit = "us_m4a3_76w_hvss"
assembly = "tank"

[layout]
turret_y = 0.15
turret_ring_diameter = 1.75
# HVSS: 23 in (0.584 m) track; the catalog width 3.00 m is over the tracks.
fender_overhang = 0.0

[running_gear]
part = "hvss_bogie"
track_width = 0.584
link_pitch = 0.152
road_wheel_diameter = 0.52
# twin-wheel stations as drawn (us020m4a376w.jpg, 150 px/m): three bogies,
# ground contact 3.84 m (data.json)
road_wheels = [2.06, 1.20, 0.56, -0.30, -0.94, -1.80]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.52, z = 0.60, diameter = 0.56 }
roller_offset = 0.0
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Lower hull between the tracks. The front is the one-piece cast differential and
# final drive housing ("sharp nose" of the M4A3(75)W): rounded from the floor
# (17 in / 0.43 m ground clearance) up to the glacis seam at about 1.08 m.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Superstructure over the tracks: 47 deg glacis (from vertical, afvdatabase) from
# the nose seam to the roof, flat roof and engine deck, rear plate leaning 10 deg
# (afvdatabase: rear 10-22 deg) with a small chamfer at the deck edge.
# The catalog hull length 6.27 m is over the sandshield extensions (drawing
# us020m4a376w.jpg), so they are part of the profile here: thin plates at
# fender height reaching past the nose and the rear plate.
upper = [[-3.14, 0.99], [3.12, 0.92], [3.12, 0.95], [2.80, 1.06], [1.94, 1.90], [-2.70, 1.90],
         [-2.79, 1.85], [-2.94, 1.04], [-3.14, 1.03]]
# Sponsons flush with the outer track edge (2.54 m); only the sandshields reach
# the catalog width.
upper_half_width = 1.27
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
# T23 turret (drawings us017/us018/us020, top view 2.47 x 2.2 m, 150-159 px/m):
# round front over the 69 in ring and a long bustle reaching 1.37 m behind the
# hull center
length = 2.47
width = 2.15
exponent = 2.3
front_scale = 1.0
y_shift = -0.28
segments = 24
profile = [[0.0, 1.0], [0.6, 1.0], [0.88, 0.95], [1.0, 0.86]]

[cupola]   # all-round vision cupola, commander right rear
x = 0.45
y = -0.25
diameter = 0.68
height = 0.20
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.92, 0.40]
# M62 combination mount: broad shield, gun fitted to the catalog length
mantlet = { kind = "rotor", size = [0.95, 0.22, 0.52] }
sleeve = [0.30, 0.13]
segments = [["fit", 0.058, 0.050]]
muzzle_brake = "double_baffle"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.56, 1.30]
length = 1.0

[[part]]
part = "us.transmission_cover"   # here only the rounded lip at the nose/glacis seam
y = 2.84
z = 1.05
radius = 0.05
segments = 8

[[part]]
part = "us.hatch_hoods"
x = 0.48
y = 1.70
size = [0.55, 0.62]

[[part]]
