# M4A3E2 Sherman "Jumbo" assault tank: welded 47 deg large-hatch hull of
# us_m4a3_75.toml with 4 in appliqué on the glacis and 1.5 in on the sides,
# heavy cast turret with vertical sides, 75 mm Gun M3 in the T110 mount, VVSS
# with extended end connectors. Prompt 063. Main dimensions from
# data/catalog/us.toml (onwar.com): length 6.27 m over the sandshields (the
# muzzle ends behind them, data.json overhang 0), width 2.94 m, height 2.95 m
# over the cupola.
unit = "us_m4a3e2"
assembly = "tank"

[layout]
hull_length = 5.89
turret_y = 0.12
turret_ring_diameter = 1.75
# Tracks with extended end connectors (0.511 m, data.json). The catalog width
# 2.94 m is taken over the tracks; the kit cannot offset the connectors to the
# outside only, so the tread comes out wider than the real 2.11 m.
fender_overhang = 0.0

[running_gear]
part = "vvss_bogie"
track_width = 0.51
link_pitch = 0.152
road_wheel_diameter = 0.508
road_wheels = [1.72, 1.20, 0.26, -0.26, -1.20, -1.72]
sprocket = { y = 2.52, z = 0.72, diameter = 0.66, teeth = 13 }
idler = { y = -2.55, z = 0.47, diameter = 0.56 }
roller_offset = -0.20
return_roller_diameter = 0.24

[hull]
part = "plate_hull"
# Lower hull between the tracks. The front is the one-piece cast differential and
# final drive housing ("sharp nose" of the M4A3(75)W): rounded from the floor
# (17 in / 0.43 m ground clearance) up to the glacis seam at about 1.08 m.
lower = [[-2.82, 0.44], [2.40, 0.44], [2.62, 0.48], [2.78, 0.57], [2.89, 0.70], [2.94, 0.84],
         [2.93, 0.97], [2.86, 1.08], [-2.94, 1.08], [-2.94, 0.72]]
# Superstructure over the tracks: 47 deg glacis (from vertical, afvdatabase) from
# the nose seam to the roof, flat roof and engine deck, rear plate leaning 10 deg
# (afvdatabase: rear 10-22 deg) with a small chamfer at the deck edge.
upper = [[-2.94, 1.00], [2.20, 1.00], [2.86, 1.06], [2.02, 1.92], [-2.70, 1.90], [-2.79, 1.85],
         [-2.94, 1.04]]
# Sponsons flush with the outer track edge (2.54 m); only the sandshields reach
# the catalog width.
upper_half_width = 1.31   # 1.5 in appliqué on the sponson sides
bevel = 0.02
# Front and rear sandshield extensions over the tracks: they set the overall
# length (drawing us019m4a375w.jpg: the 75 mm muzzle ends at the nose, the
# fenders reach about 0.2 m past the nose and the rear plate).
fender_front = 3.12
fender_slope_front = 0.10
fender_rear = -3.14

[turret]
part = "cast_turret"
height = "fit"
# heavy cast turret with near-vertical 6 in sides (drawing us015m4a3e2.jpg,
# 156 px/m: 2.62 m long, centered over the hull)
length = 2.55
width = 2.10
exponent = 3.0
front_scale = 0.94
y_shift = -0.14
segments = 24
profile = [[0.0, 1.0], [0.82, 1.0], [0.94, 0.97], [1.0, 0.92]]

[cupola]
x = 0.45
y = -0.25
diameter = 0.68
height = 0.18
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [1.06, 0.36]
# heavy 7 in gun shield of the T110 mount: deep box in front of the turret
mantlet = { kind = "rotor", size = [0.80, 0.36, 0.56] }
sleeve = [0.28, 0.15]
# fixed barrel: the muzzle ends behind the sandshield tips (drawing)
segments = [[1.30, 0.055, 0.048]]
muzzle_brake = "none"

[[mg]]  # coaxial M1919A4
part = "mg"
mount = "coax"
position = [0.24, 0.30, 0.0]

[[mg]]  # bow M1919A4 in a ball mount on the glacis
part = "mg"
mount = "ball"
position = [0.48, 2.62, 1.30]
length = 0.8

[[part]]
part = "us.transmission_cover"   # here only the rounded lip at the nose/glacis seam
y = 2.84
z = 1.05
radius = 0.05
segments = 8

[[part]]
part = "us.hatch_hoods"
x = 0.48
y = 1.74
size = [0.55, 0.62]

[[part]]
