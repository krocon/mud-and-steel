# 57 mm Gun M1 on Carriage M2 (US licence 6-pounder, 1944). Main dimensions from
# data/catalog/us.toml: length 4.23 m (catalog estimate, trails closed), width
# 1.80 m, height 1.28 m over the shield (firing position). Barrel 9 ft 3 in
# (2.82 m), L/50, no muzzle brake (Wikipedia "Ordnance QF 6-pounder").
#
# Modeling estimates (no primary drawing read): line of fire 0.84 m; tyres
# 6.00-16 (about 0.71 m); wheel track 1.53 m so that wheels (with hubs) and shield both end
# at the catalog width; spaced double shield as on the 6-pounder. With the barrel
# starting behind the axle the muzzle sits about 2.0 m ahead of the axle, which
# leaves about 2.2 m for the trails, consistent with the catalog length.
# Carriage M2 features: caster wheel on the right trail (swung up), trail
# handles, utility box. Positions are relative to the axle (y = 0).
unit = "us_57mm_m1"
assembly = "towed_gun"

[gun]
part = "field_gun"
trunnion = [0.05, 0.84]
cradle = [1.20, 0.22, 0.20]
recoil = [0.95, 0.05]
breech = [0.38, 0.20]
segments = [[0.85, 0.050, 0.045], [1.45, 0.040, 0.036]]
muzzle_brake = "none"

[carriage]
part = "split_trail_carriage"
wheel_diameter = 0.71
wheel_width = 0.16
wheel_track = 1.53
trail_spread_deg = 52        # firing position (prompt 227); folds closed while towed
trail_width = 0.12
trail_height = 0.17
spade = [0.30, 0.26]
mount_z = 0.66
spokes = 0

[shield]
part = "gun_shield"
y = 0.36
bottom_z = 0.30
slope_deg = 10
cutout = [0.24, 0.26]
wing_width = 0.16
wing_deg = 20
spaced = true
thickness = 0.008   # 6.35 mm plates (catalog armor_turret_front_mm)

[[part]]
part = "box_prop"    # telescope sight on the left of the cradle
center = [-0.20, 0.05, 0.95]
size = [0.08, 0.28, 0.11]
parent = "Gun"

[[part]]
part = "cylinder_prop"  # elevation handwheel
from = [-0.26, -0.30, 0.70]
to = [-0.30, -0.30, 0.70]
radius = 0.09
material = "Metal"
parent = "Carriage"

[[part]]
part = "cylinder_prop"  # caster wheel of the carriage M2, swung up on the right trail
from = [0.72, -1.22, 0.40]
to = [0.82, -1.22, 0.40]
radius = 0.15
material = "Rubber"
parent = "Trail_R"

[[part]]
part = "box_prop"    # caster wheel fork
center = [0.77, -1.12, 0.32]
size = [0.12, 0.22, 0.05]
material = "Metal"
parent = "Trail_R"

[[part]]
part = "box_prop"    # utility box on the left trail (carriage M2)
center = [-0.61, -0.91, 0.40]
size = [0.16, 0.42, 0.14]
parent = "Trail_L"

[[part]]
part = "crew_sockets"
positions = [[-0.85, -0.58], [0.36, -0.98], [-0.32, -1.55], [0.38, -1.78],
             [-0.55, -2.28], [0.55, -2.42], [0.0, -2.85]]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.0, 0.8]
parent = "Carriage"

[[part]]
part = "marking"
name = "Shield"
kind = "number"
parent = "Shield"
position = [-0.55, 0.37, 0.70]
normal = [0, 0.98, 0.17]
size = 0.25

[validate]
# Catalog width (1.80 m) is in travel order; spread trails are wider in firing pose.
exclude_width = ["Trail_L", "Trail_R"]
