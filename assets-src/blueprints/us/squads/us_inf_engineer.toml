# US combat engineer squad (catalog us_inf_engineer, strength 12 and the BAR are
# catalog estimates): 11 M1 rifles, 1 BAR, demolition charges and a Bangalore
# torpedo.
#
# Roles: `engineer` (M1, demolition charge, Bangalore torpedo) for the four men
# of the demolition team, `auto_rifleman` for the BAR, `rifleman` for the rest.
# The squad leader is a `scout` (M1 rifle and binoculars) because the
# `squad_leader` soldier carries a Thompson, which the catalog does not list for
# this squad. No other deviations.
#
# Formation: demolition team ahead, covered by the BAR and riflemen in a wedge
# behind (display only).
