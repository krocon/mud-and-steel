# Republic P-47D-30/40 Thunderbolt (prompt 008, us infantry_air).
# Main dimensions from data/catalog/us.toml: length 11.02 m, wingspan 12.43 m
# (fitted), height 4.47 m. As on the P-51D, the catalog height is the tail-down
# figure with one blade vertical: the fuselage climbs 9 deg toward the nose
# (estimate), wing and tail stay level, and the propeller hub sits at
# 2.49 m = height - prop radius.
#
# Modeling estimates (P-47D three-view, Republic figures as commonly quoted):
# Curtiss Electric 4-blade paddle propeller 13 ft (3.96 m); elliptical wing
# drawn as a taper from 2.85 m root to 1.20 m tip chord (wing area 300 sq ft),
# ~4 deg dihedral; main gear track ~15 ft 6 in (4.72 m), 34 in (0.86 m)
# wheels; the deep fuselage with the oval cowling (~1.36 x 1.60 m) and the
# turbo-supercharger ducting under the cockpit; bubble canopy (D-25 onward);
# horizontal tail span ~4.8 m.
#
# Weapons from the catalog (one typical load): eight .50 in wing guns (four per
# wing, staggered), two 500 lb AN-M64 on the wing racks outboard of the gear
# (store ~1.45 x 0.36 m, estimate from the AN-M64 drawing dimensions), ten 5 in
# HVAR on zero-length launchers (five per wing, kit default 1.73 x 0.127 m).
unit = "us_p47d"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
segments = 16
# Drawn level around thrust line z = 2.30 (prompt 215)
sections = [[-6.95, 0.04, 0.38, 2.30, 2.0],
            [-5.80, 0.48, 0.88, 2.28, 2.4],
            [-3.70, 0.96, 1.54, 2.24, 2.5],
            [-1.35, 1.16, 1.84, 2.22, 2.5],
            [0.80, 1.28, 1.84, 2.24, 2.4],
            [2.40, 1.36, 1.60, 2.28, 2.2],
            [3.05, 1.22, 1.32, 2.30, 2.1]]

[wing]
part = "wing"
y = 0.0
z = 1.55
root_chord = 2.85
tip_chord = 0.45
planform = "elliptical"
le_share = 0.22
sweep_deg = 1.0
dihedral_deg = 4.0
thickness = 0.15
aileron = [0.58, 0.92]

[tail]
part = "tail"
y = -5.75
z = 2.32
span = 4.8
root_chord = 1.75
tip_chord = 0.85
planform = "rounded"
# Broad rounded P-47D-30/40 dorsal-fillet fin and rudder
fin_outline = [[-4.75, 2.75], [-5.65, 3.05], [-6.15, 3.85], [-6.50, 4.15], [-6.85, 4.15], [-6.90, 2.25]]
rudder_outline = [[-6.90, 2.05], [-6.90, 4.12], [-7.20, 4.06], [-7.48, 3.60], [-7.58, 2.80], [-7.38, 2.12]]

[canopy]
part = "canopy"
y = [-2.05, 0.10]
z = 3.05
width = 0.84
height = 0.58
profile = [[0.0, 0.25], [0.22, 0.80], [0.52, 1.0], [0.80, 0.94], [0.94, 0.68], [1.0, 0.35]]
frames = 1

[landing_gear]
part = "landing_gear"
main_y = 0.30
main_track = 4.72
main_wheel_diameter = 0.86
strut_top_z = 1.50
ground_z = 0.31
tail_y = -6.00
tail_wheel_diameter = 0.42
tail_strut_top_z = 1.95
tail_ground_z = 1.49

[[propeller]]
part = "propeller"
position = [0.0, 3.20, 2.30]
diameter = 3.96
blades = 4
spinner = [0.46, 0.50]
blade_width = 0.24

[[part]]
part = "fixed_guns"           # four .50 in M2 per wing, staggered in the leading edge
muzzles = [[2.75, 0.08, 1.73], [2.95, 0.04, 1.75], [3.15, 0.00, 1.76], [3.35, -0.04, 1.78]]
length = 0.35

[[part]]
part = "bomb_load"            # two 500 lb AN-M64 on the wing racks
bombs = [[2.85, -0.60, 1.32]]
length = 1.45
diameter = 0.36

[[part]]
part = "rocket_rails"         # ten 5 in HVAR on zero-length launchers
rockets = [[3.60, -0.55, 1.545], [3.95, -0.55, 1.575], [4.30, -0.55, 1.605], [4.65, -0.55, 1.635],
           [5.00, -0.55, 1.665]]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.55, -1.20, 1.48]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.55, -1.20, 1.48]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.80, 2.65]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [1.40, -1.00, 1.70]

[[part]]
part = "marking"
name = "Wing_L"               # star on the upper left wing
position = [-4.60, -0.95, 1.95]
normal = [0.0, 0.0, 1.0]
size = 1.2

[[part]]
part = "marking"
name = "Wing_R"               # star under the right wing, between the rocket launchers
position = [4.62, -0.95, 1.80]
normal = [0.0, 0.0, -1.0]
size = 1.0

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.50, -4.30, 2.24]
normal = [-1.0, 0.0, 0.0]
size = 0.9

[[part]]
part = "marking"
name = "Hull_R"
position = [0.50, -4.30, 2.24]
normal = [1.0, 0.0, 0.0]
size = 0.9

[[part]]
part = "shadow_proxy"
