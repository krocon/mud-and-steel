# North American P-51D Mustang (prompt 008, us infantry_air).
# Main dimensions from data/catalog/us.toml: length 9.83 m, wingspan 11.28 m
# (fitted), height 4.17 m. The catalog height is the usual tail-down figure with
# one propeller blade vertical, so the model stands in a three-point attitude:
# the fuselage sections climb 9 deg toward the nose (estimate from three-views of
# a P-51D on its gear), wing and tail stay level (the kit has no wing
# incidence), and the propeller hub sits at 2.47 m = height - prop radius.
#
# Modeling estimates (P-51D three-view, NAA manual figures as commonly quoted):
# Hamilton Standard 4-blade propeller 11 ft 2 in (3.40 m); wing root chord
# 104 in (2.64 m), tip chord 50 in (1.27 m), ~5 deg dihedral, slightly swept
# leading edge; main gear track 11 ft 10 in (3.61 m), 27 in (0.69 m) wheels;
# horizontal tail span ~13 ft 2 in (4.0 m); belly radiator scoop behind the
# wing; bubble canopy (D-5 onward). Fuselage width ~0.88 m at the cockpit.
#
# Weapons from the catalog: six .50 in wing guns (three per wing, outside the
# propeller arc) and two 1,000 lb AN-M65 bombs on the wing racks (store size
# ~1.75 x 0.48 m, estimate from the AN-M65 drawing dimensions 69.5 x 18.8 in).
unit = "us_p51d"
assembly = "aircraft"

[layout]
cg_chord = 0.3
ground_angle = "fit"

[fuselage]
part = "fuselage"
segments = 16
# Drawn level around thrust line z = 2.15 (prompt 215)
sections = [[-6.15, 0.03, 0.30, 2.18, 2.0],
            [-5.10, 0.40, 0.72, 2.16, 2.4],
            [-2.90, 0.80, 1.24, 2.08, 2.5],
            [-1.15, 0.88, 1.42, 2.06, 2.6],
            [0.60, 0.88, 1.38, 2.08, 2.6],
            [2.10, 0.78, 1.04, 2.12, 2.4],
            [2.68, 0.64, 0.64, 2.15, 2.1]]

[wing]
part = "wing"
y = 0.0
z = 1.56
root_chord = 2.64
tip_chord = 1.22
planform = "rounded"
sweep_deg = 4.0
dihedral_deg = 5.0
thickness = 0.14
aileron = [0.58, 0.92]

[tail]
part = "tail"
y = -4.95
z = 2.26
span = 4.0
root_chord = 1.55
tip_chord = 0.85
planform = "rounded"
# Characteristic P-51D dorsal fillet fin and squared-top rudder
fin_outline = [[-4.35, 2.48], [-5.00, 2.85], [-5.55, 3.68], [-5.90, 3.74], [-5.95, 2.18]]
rudder_outline = [[-5.95, 2.00], [-5.95, 3.74], [-6.25, 3.72], [-6.46, 3.35], [-6.54, 2.45], [-6.35, 2.02]]

[canopy]
part = "canopy"
y = [-2.80, -0.75]
z = 2.70
width = 0.76
height = 0.56
profile = [[0.0, 0.25], [0.22, 0.78], [0.50, 1.0], [0.78, 0.94], [0.93, 0.68], [1.0, 0.35]]
frames = 1

[landing_gear]
part = "landing_gear"
main_y = 0.35
main_track = 3.61
main_wheel_diameter = 0.69
strut_top_z = 1.52
ground_z = 0.14
tail_y = -5.20
tail_wheel_diameter = 0.32
tail_strut_top_z = 1.85
tail_ground_z = 1.32

[[propeller]]
part = "propeller"
position = [0.0, 2.82, 2.15]
diameter = 3.40
blades = 4
spinner = [0.68, 0.64]
blade_width = 0.20

[[part]]
part = "cylinder_prop"        # belly radiator scoop (intake forward, behind the wing)
from = [0.0, -4.35, 1.38]
to = [0.0, -1.80, 1.24]
radius = 0.26
segments = 10

[[part]]
part = "fixed_guns"           # three .50 in M2 per wing in the leading edge
muzzles = [[2.05, 0.02, 1.68], [2.30, 0.00, 1.71], [2.55, -0.02, 1.74]]
length = 0.30

[[part]]
part = "bomb_load"            # two 1,000 lb AN-M65 on the wing racks
bombs = [[2.60, -0.80, 1.26]]
length = 1.75
diameter = 0.48

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [-0.42, 1.85, 2.22]

[[part]]
part = "socket"
name = "Socket_Exhaust_"
position = [0.42, 1.85, 2.22]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.50, 2.50]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-1.20, -1.00, 1.70]

[[part]]
part = "marking"
name = "Wing_L"               # star on the upper left wing
position = [-3.8, -1.05, 2.02]
normal = [0.0, 0.0, 1.0]
size = 1.1

[[part]]
part = "marking"
name = "Wing_R"               # star under the right wing
position = [3.8, -1.05, 1.80]
normal = [0.0, 0.0, -1.0]
size = 1.1

[[part]]
part = "marking"
name = "Hull_L"
position = [-0.38, -3.90, 2.12]
normal = [-1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "marking"
name = "Hull_R"
position = [0.38, -3.90, 2.12]
normal = [1.0, 0.0, 0.0]
size = 0.8

[[part]]
part = "shadow_proxy"
