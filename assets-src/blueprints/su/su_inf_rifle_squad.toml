# Soviet rifle squad, shtat 04/550 (1943/44), catalog su.toml: 9 men with
# 6 Mosin-Nagant M1891/30, 2 PPSh-41, 1 DP-27. Composition: squad leader (PPSh),
# DP-27 gunner and assistant gunner (rifle, pan carrier), one rifleman with a
# PPSh-41 and five riflemen. The catalog marks the weapon mix as uncertain
# (the number of PPSh grew during 1943-45).
# The formation is the default arrangement for the gallery and for spawning;
# spacing is the soldiers' distance in m (skirmish line in combat was wider,
# about 6-8 paces; the game sets formations itself).
unit = "su_inf_rifle_squad"
assembly = "squad"
formation = "wedge"
spacing = 2.5

[[member]]
role = "squad_leader"
weapon = "PPSh-41"

[[member]]
role = "mg_gunner"
weapon = "DP-27"

[[member]]
role = "assistant_gunner"
weapon = "Mosin-Nagant M1891/30"

[[member]]
role = "smg_gunner"
weapon = "PPSh-41"

[[member]]
role = "rifleman"
weapon = "Mosin-Nagant M1891/30"
count = 5
