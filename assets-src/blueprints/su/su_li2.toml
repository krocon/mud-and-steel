# Lisunov Li-2 (prompt 055): Soviet licence-built DC-3, the military version
# with a dorsal gun turret. Same layout as the C-47 blueprint (twin
# Shvetsov ASh-62IR in DC-3 nacelles, three-blade propellers 3.6 m), main
# dimensions from data/catalog/su.toml (length 19.65 m, span 28.81 m, height
# 5.15 m); the nose is 0.2 m longer, a ShKAS turret sits on the fuselage
# behind the wing. Modeling estimates from Li-2 photographs.
unit = "su_li2"
assembly = "aircraft"

[layout]
cg_chord = 0.3

[fuselage]
part = "fuselage"
# [y, width, height, z_center, exponent], tail -> nose; y = 0 at the wing root leading edge
sections = [[-13.25, 0.05, 0.20, 2.75, 2.0], [-11.60, 0.60, 0.90, 2.62, 2.2], [-7.50, 1.85, 2.15, 2.45, 2.3],
            [-3.00, 2.35, 2.55, 2.40, 2.4], [1.00, 2.40, 2.60, 2.40, 2.4], [3.40, 2.25, 2.40, 2.42, 2.3],
            [5.30, 1.55, 1.70, 2.40, 2.2], [6.32, 0.40, 0.45, 2.35, 2.0]]
segments = 14

[wing]
part = "wing"
y = 0.0
z = 1.45
root_chord = 4.90
tip_chord = 1.60
sweep_deg = 15.0
dihedral_deg = 6.0
thickness = 0.15
aileron = [0.6, 0.95]

[tail]
part = "tail"
y = -9.50
z = 2.75
span = 8.00
root_chord = 2.60
tip_chord = 1.30
fin_height = 2.40
fin_root_chord = 3.00
fin_tip_chord = 1.20
fin_sweep_deg = 30

[canopy]
part = "canopy"                # cockpit windows
y = [3.70, 4.90]
z = 3.35
width = 1.40
height = 0.30

[landing_gear]
part = "landing_gear"
main_y = 0.80
main_track = 5.70
main_wheel_diameter = 1.14
strut_top_z = 1.25
tail_y = -11.40
tail_wheel_diameter = 0.50
tail_strut_top_z = 2.10

[[propeller]]
part = "propeller"
name = "Propeller_L"
position = [-2.85, 3.05, 1.70]
diameter = 3.60
blades = 3

[[propeller]]
part = "propeller"
name = "Propeller_R"
position = [2.85, 3.05, 1.70]
diameter = 3.60
blades = 3

[[part]]
part = "nacelle"               # P&W R-1830
x = 2.85
y = [-2.20, 2.90]
z = 1.70
diameter = 1.40

[[part]]
part = "socket"
name = "Socket_Passenger_01"
position = [-1.25, -6.20, 1.60]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-2.85, 0.5, 2.1]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [2.85, 0.5, 2.1]

[[part]]
part = "marking"
name = "Wing_L"
position = [-10.5, -3.8, 2.55]
normal = [0.0, 0.0, 1.0]
size = 1.6

[[part]]
part = "marking"
name = "Wing_R"
position = [10.5, -3.8, 2.55]
normal = [0.0, 0.0, 1.0]
size = 1.6

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.10, -8.4, 2.45]
normal = [-1.0, 0.0, 0.0]
size = 1.2

[[part]]
part = "marking"
name = "Hull_R"
position = [1.10, -8.4, 2.45]
normal = [1.0, 0.0, 0.0]
size = 1.2

[[part]]
part = "canopy"                # dorsal turret fairing (ShKAS)
y = [-3.60, -2.60]
z = 3.55
width = 0.90
height = 0.40

[[part]]
part = "flex_mg"               # ShKAS, dorsal turret
position = [0.0, -3.10, 4.00]
direction = [0.0, -1.0, 0.2]
length = 0.70

[[part]]
part = "socket"                # tracer origin: tip of the dorsal MG
name = "Socket_Muzzle"
position = [0.0, -3.78, 4.17]

[[part]]
part = "shadow_proxy"

[validate]
exclude_height = ["Propeller_*"]
