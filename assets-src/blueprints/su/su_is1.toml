# IS-1 (IS-85) heavy tank (late 1943 - early 1944): IS hull with the early
# stepped nose and the IS-85 cast turret with the 85 mm D-5T. Main
# dimensions from data/catalog/su.toml: length 8.30 m with gun, hull 6.70 m,
# width 3.10 m, height 2.70 m (cupola top). No drawing in the reference
# folder (prompt 063): running gear, lower hull and turret as su_is2 (same
# turret casting); stepped glacis with a near-vertical driver's plate as on
# the early IS-2 (photographs, Wikipedia "IS tank family"); narrower D-5T
# mantlet, barrel without muzzle brake; no DShK; coaxial, bow and turret
# rear DT (data.json).
unit = "su_is1"
assembly = "tank"

[layout]
turret_y = 0.55
turret_ring_diameter = 1.80
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.65
track_thickness = 0.05
link_pitch = 0.16
road_wheel_diameter = 0.55
road_wheels = [2.30, 1.45, 0.60, -0.25, -1.10, -1.95]
sprocket = { y = -2.95, z = 0.72, diameter = 0.68, teeth = 14 }
idler = { y = 2.95, z = 0.64, diameter = 0.60, spoked = false }
return_rollers = { y = [1.85, 0.20, -1.50], z = 0.90, diameter = 0.24 }
arm = 0.32

[hull]
part = "plate_hull"
lower = [[-3.20, 0.42], [2.95, 0.42], [3.385, 0.95], [-3.385, 0.95], [-3.385, 0.62]]
# stepped nose: lower glacis, near-vertical driver's plate, roof, sloped rear plate
upper = [[-3.385, 0.95], [3.385, 0.95], [2.85, 1.30], [2.65, 1.62], [-3.05, 1.62], [-3.385, 1.25]]
upper_side_slope_deg = 15
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.45
width = 2.15
exponent = 2.4
front_scale = 0.84
y_shift = -0.15
profile = [[0.0, 1.0], [0.45, 0.98], [0.8, 0.88], [1.0, 0.72]]

[cupola]
x = -0.50
y = -0.40
diameter = 0.70
height = 0.24
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.95, 0.42]
mantlet = { kind = "cast_box", size = [0.80, 0.32, 0.50] }
sleeve = [0.35, 0.11]
segments = [["fit", 0.065, 0.055]]
muzzle_brake = "none"

[[mg]]  # coaxial DT, right of the gun
part = "mg"
mount = "coax"
position = [0.30, 0.15, 0.05]

[[mg]]  # DT in a ball mount in the turret rear
part = "su.turret_rear_mg"
position = [0.18, -0.78, 1.98]

[[mg]]  # bow DT fired by the driver, right of the visor in the driver's plate
part = "su.bow_mg"
position = [0.35, 2.78, 1.48]
normal = [0.0, 0.97, 0.26]

[[part]]
part = "turret_hatch"   # loader's hatch
x = 0.48
y = -0.40
diameter = 0.50
socket = true

[[part]]
part = "box_prop"       # driver's visor block in the glacis
center = [0.0, 2.76, 1.48]
size = [0.36, 0.10, 0.14]

[[part]]
part = "deck_box"       # engine deck louvres
center = [0.0, -1.90]
size = [1.9, 1.5, 0.05]

[[part]]
part = "su.fuel_drums"  # external fuel tanks on the rear hull sides
positions = [[-1.34, -2.30, 1.25], [1.34, -2.30, 1.25]]
length = 0.80
diameter = 0.34

[[part]]
part = "exhaust"
kind = "pipe"
position = [-0.70, -3.21, 1.45]
length = 0.14
diameter = 0.16

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.70, -3.21, 1.45]
length = 0.14
diameter = 0.16

[[part]]
part = "headlight"
position = [-1.20, 2.95, 1.30]
diameter = 0.20

[[part]]
part = "antenna"        # 10-RK radio whip on the turret
position = [0.60, 0.10, 2.40]
parent = "Turret"
length = 2.2

[[part]]
part = "tool"
kind = "shovel"
position = [1.45, 0.4, 1.02]

[[part]]
part = "tow_hook"
position = [0.0, 3.24, 0.80]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -3.26, 0.80]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.90, 1.70]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.55, 2.45]
parent = "Turret"

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-1.05, 0.30, 2.05]
normal = [-0.97, 0.0, 0.25]
size = 0.5

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [1.05, 0.30, 2.05]
normal = [0.97, 0.0, 0.25]
size = 0.5

[[part]]
part = "marking"
name = "Turret_Rear"
kind = "number"
parent = "Turret"
position = [-0.35, -0.70, 2.10]
normal = [0.0, -0.95, 0.30]
size = 0.4

[validate]
# catalog height is the cupola top; the antenna stands above
exclude_height = ["Antenna_*"]
