center = [0.30, -1.05, 1.22]
size = [0.55, 0.65, 0.04]

[[part]]
part = "exhaust"                        # muffler across the rear plate
kind = "muffler"
position = [0.0, -2.26, 0.85]
length = 0.70
diameter = 0.16

[[part]]
