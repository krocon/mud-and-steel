# OT-130 flamethrower tank (T-26 Model 1933 conversion, 1938; prompt 063, tier 3).
# The reference folder "OT-133" holds the data of the OT-130 (docs/VEHICLE_REFS.md).
# Main dimensions from data/catalog/su.toml (onwar.com): length 4.80 m, width
# 2.40 m, height 2.40 m, as the T-26 Model 1933. The folder has no drawing:
# built on su_t26_1933 (checked against its drawing su025t26m33.jpg): same hull,
# running gear and cylindrical turret with the rear bustle. Differences kept in
# the model: the 45 mm gun is replaced by the short KS-24 flame projector in a
# round mantlet (photographs), one DT beside it (catalog: one DT), no turret
# rear MG; the flame fuel tank sits in the hull and is not visible.
unit = "su_ot130"
assembly = "tank"

[layout]
turret_y = 0.06
turret_ring_diameter = 1.20
hull_length = 4.43
fender_overhang = 0.03

[running_gear]
part = "small_wheel_bogie"
bogies = [[0, 1, 2, 3], [4, 5, 6, 7]]
spring = "leaf"
track_width = 0.26
track_thickness = 0.03
link_pitch = 0.09
road_wheel_diameter = 0.29
road_wheels = [1.51, 1.05, 0.64, 0.20, -0.12, -0.56, -0.99, -1.42]
sprocket = { y = 2.03, z = 0.75, diameter = 0.62, teeth = 15 }    # front drive
idler = { y = -1.92, z = 0.43, diameter = 0.62 }                  # large spoked rear idler
return_rollers = { y = [1.34, 0.51, -0.34, -1.16], z = 0.86, diameter = 0.20 }

[hull]
part = "plate_hull"
upper_half_width = 0.79
lower = [[-1.85, 0.38], [1.75, 0.38], [2.215, 0.80], [2.215, 0.95], [-2.215, 0.95], [-2.215, 0.60]]
# sloped nose, driver's front plate, roof, raised fighting compartment under
# the turret, engine deck dropping to the rear
upper = [[-2.215, 0.95], [2.215, 0.95], [2.215, 1.10], [1.45, 1.20], [1.38, 1.25], [0.75, 1.25], [0.73, 1.51],
         [-0.69, 1.51], [-0.71, 1.22], [-1.55, 1.17], [-2.215, 1.00]]
fender_front = 2.38
fender_rear = -2.42                     # long rear mudguards over the idler
fender_slope_front = 0.15

[turret]
part = "su.offset_turret"
x = -0.14
height = "fit"
# cylindrical turret (front half round) with a long rear bustle
plan = [[-0.65, 0.0], [-0.56, 0.33], [-0.33, 0.56], [0.0, 0.65], [0.33, 0.56], [0.56, 0.33], [0.65, 0.0],
        [0.62, -0.35], [0.46, -1.06], [0.33, -1.16], [-0.37, -1.16], [-0.53, -1.03], [-0.64, -0.35]]
side_slope_deg = 2
bevel = 0.015

[gun]
part = "tank_gun"
trunnion = [0.62, 0.28]
x = -0.14
mantlet = { kind = "round", size = [0.44, 0.22, 0.40] }
sleeve = [0.20, 0.07]
segments = [[0.55, 0.045, 0.040], [0.08, 0.030, 0.030]]   # KS-24 flame projector with nozzle
muzzle_brake = "none"

[[mg]]  # DT in its own mount right of the flame projector
part = "mg"
mount = "coax"
position = [0.16, 0.05, 0.0]

[[part]]
part = "turret_hatch"
x = -0.30
y = 0.10
diameter = 0.42
height = 0.10
socket = true

[[part]]
part = "turret_hatch"                   # second roof hatch over the gunner
x = 0.10
y = -0.55
size = [0.45, 0.40]

[[part]]
