# A-3 inflatable boat of the PA-3 pontoon park, prompt 119. Main dimensions
# from data/catalog/su.toml: 6.0 x 2.3 x 0.85 m (ru.wikipedia PA-3, after
# the 1941 engineer handbook). Modeling estimates: a low floor tray inside
# a ring of rubberized tubes (rounded bow and stern), two thwarts.
unit = "su_a3_boat"
assembly = "boat"

[hull]
part = "section_hull"
open = [2.65, -2.65]
floor_z = 0.08
wall = 0.04
sections = [
    { y = 3.00, bottom_z = 0.20, bottom_hw = 0.45, chine_z = 0.30, chine_hw = 0.60, top_z = 0.60, top_hw = 0.65 },
    { y = 2.65, bottom_z = 0.0, bottom_hw = 0.75, chine_z = 0.05, chine_hw = 0.85, top_z = 0.60, top_hw = 0.88 },
    { y = -2.65, bottom_z = 0.0, bottom_hw = 0.75, chine_z = 0.05, chine_hw = 0.85, top_z = 0.60, top_hw = 0.88 },
    { y = -3.00, bottom_z = 0.20, bottom_hw = 0.45, chine_z = 0.30, chine_hw = 0.60, top_z = 0.60, top_hw = 0.65 },
]
height = "keep"

[[part]]
