points = [[0.0, 2.76], [0.55, 2.62], [0.92, 2.10], [0.92, -2.10], [0.55, -2.62], [0.0, -2.76], [-0.55, -2.62], [-0.92, -2.10], [-0.92, 2.10], [-0.55, 2.62]]
