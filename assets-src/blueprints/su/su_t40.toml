# T-40 amphibious light tank (1941-1942; prompt 063, tier 3).
# Main dimensions from data/catalog/su.toml (onwar.com): length 4.11 m, width
# 2.33 m, height 1.95 m. The catalog has no length_hull_mm: hull_length is the
# boat hull from bow to stern in the drawing.
# Shapes measured in the onwar.com drawing su034t40.jpg (front to the left,
# about 149 px/m; never committed): four rubber-tyred road wheels of about
# 0.52 m on torsion bars, three return rollers, FRONT drive sprocket, rear
# idler, 0.26 m track (data.json), ground clearance 0.36 m (data.json); boat
# hull whose upper part reaches out over the tracks (buoyancy sponsons) with
# sloped sides, low bow deck in front of the driver's plate, screw propeller in
# a tunnel under the stern; small faceted conical turret offset about 0.35 m
# to the left and 0.35 m behind the hull center, 12.7 mm DShK with the coaxial
# DT (both machine guns, so their mount is the `Gun`). The drawing gives the
# turret roof at 2.01 m, the catalog 1.95 m: the fitted turret is a little
# lower than drawn.
unit = "su_t40"
assembly = "tank"

[layout]
turret_y = -0.35
turret_ring_diameter = 0.95
hull_length = 4.06
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.26
track_thickness = 0.03
link_pitch = 0.11
road_wheel_diameter = 0.52
road_wheels = [1.20, 0.40, -0.41, -1.12]
sprocket = { y = 1.74, z = 0.52, diameter = 0.50, teeth = 13 }   # front drive
idler = { y = -1.73, z = 0.50, diameter = 0.45, spoked = false }
return_rollers = { y = [0.71, -0.04, -0.81], z = 0.76, diameter = 0.16 }
arm = 0.24

[hull]
part = "plate_hull"
lower = [[-1.85, 0.36], [1.40, 0.36], [2.03, 1.00], [-2.03, 1.00], [-2.03, 0.60]]
# low bow deck, driver's front plate, roof, sloped stern
upper = [[-2.03, 1.00], [2.03, 1.00], [2.03, 1.13], [1.35, 1.17], [1.28, 1.53], [-1.75, 1.53], [-2.03, 1.08]]
upper_side_slope_deg = 30
bevel = 0.015

[turret]
part = "su.offset_turret"
x = -0.35
height = "fit"
# small faceted conical turret
plan = [[-0.28, 0.55], [0.28, 0.55], [0.52, 0.25], [0.52, -0.25], [0.30, -0.52], [-0.30, -0.52], [-0.52, -0.25],
        [-0.52, 0.25]]
side_slope_deg = 22
front_slope_deg = 10
bevel = 0.015

[gun]
part = "tank_gun"
trunnion = [0.52, 0.22]
x = -0.35
mantlet = { kind = "box", size = [0.28, 0.12, 0.22] }
segments = [[0.03, 0.03, 0.03]]       # no cannon: the twin MG mount is the Gun

[[mg]]  # DShK 12.7 mm, muzzle behind the nose (drawing)
part = "mg"
mount = "coax"
position = [-0.05, 0.0, 0.0]
length = 1.55

[[mg]]  # coaxial DT, right of the DShK
part = "mg"
mount = "coax"
position = [0.10, 0.0, 0.0]
length = 0.9

[[part]]
part = "screw_propeller"
position = [0.0, -1.70, 0.62]
diameter = 0.40
tunnel = true

[[part]]
part = "turret_hatch"
x = -0.35
y = -0.18
diameter = 0.42
socket = true

[[part]]
part = "su.glacis_hatch"      # driver's hatch in the front plate, center
x = 0.15
y = 1.30
size = [0.45, 0.30]

[[part]]
part = "deck_box"             # engine grille, right of the turret
center = [0.45, -0.55]
size = [0.45, 0.95, 0.04]

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.45, -1.92, 1.25]
length = 0.06
diameter = 0.09

[[part]]
part = "headlight"
position = [-0.55, 1.75, 1.20]
diameter = 0.14

[[part]]
part = "headlight"
position = [0.55, 1.75, 1.20]
diameter = 0.14

[[part]]
part = "tool"
kind = "shovel"
position = [0.80, -1.20, 1.38]

[[part]]
part = "tow_hook"
position = [0.0, 1.96, 0.85]
pair = true
socket = false

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.45, -0.55, 1.58]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [-0.35, -0.35, 1.85]
parent = "Turret"

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-0.85, -0.35, 1.72]
normal = [-0.93, 0.0, 0.37]
size = 0.22

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [0.15, -0.35, 1.72]
normal = [0.93, 0.0, 0.37]
size = 0.22

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [0.0, -2.00, 1.10]
normal = [0, -1, 0]
size = 0.22
