# IS-2 Model 1944 heavy tank (straightened glacis). Main dimensions from
# data/catalog/su.toml: length 9.90 m with gun, hull 6.77 m, width 3.09 m,
# height 2.73 m (top of the commander's cupola).
# Modeling estimates from photographs and drawings (Wikipedia "IS-2"; Zaloga,
# Osprey New Vanguard 7): six 550 mm road wheels per side on torsion bars, three
# return rollers, rear drive sprocket, front idler, 650 mm track; single-piece
# glacis at 60 deg, upper hull sides sloped inward, large rounded cast turret with
# a long rear overhang, wide cast mantlet, D-25T with German-style double-baffle
# muzzle brake, commander's cupola on the left rear with the DShK AA mount (from
# late 1944), DT in a ball mount in the turret rear, fixed bow DT, coaxial DT.
unit = "su_is2"
assembly = "tank"

[layout]
turret_y = 0.55
turret_ring_diameter = 1.80
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.65
track_thickness = 0.05
link_pitch = 0.16
road_wheel_diameter = 0.55
road_wheels = [2.30, 1.45, 0.60, -0.25, -1.10, -1.95]
sprocket = { y = -2.95, z = 0.72, diameter = 0.68, teeth = 14 }
idler = { y = 2.95, z = 0.64, diameter = 0.60, spoked = false }
return_rollers = { y = [1.85, 0.20, -1.50], z = 0.90, diameter = 0.24 }
arm = 0.32

[hull]
part = "plate_hull"
lower = [[-3.20, 0.42], [2.95, 0.42], [3.385, 0.95], [-3.385, 0.95], [-3.385, 0.62]]
# 60 deg glacis, roof, sloped rear plate
upper = [[-3.385, 0.95], [3.385, 0.95], [2.25, 1.62], [-3.05, 1.62], [-3.385, 1.25]]
upper_side_slope_deg = 15
bevel = 0.02

[turret]
part = "cast_turret"
height = "fit"
length = 2.45
width = 2.15
exponent = 2.4
front_scale = 0.84
y_shift = -0.15
profile = [[0.0, 1.0], [0.45, 0.98], [0.8, 0.88], [1.0, 0.72]]

[cupola]
x = -0.50
y = -0.40
diameter = 0.70
height = 0.24
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.95, 0.42]
mantlet = { kind = "cast_box", size = [0.95, 0.32, 0.55] }
sleeve = [0.45, 0.13]
segments = [["fit", 0.085, 0.075]]
muzzle_brake = "double_baffle"

[[mg]]  # coaxial DT, right of the gun
part = "mg"
mount = "coax"
position = [0.30, 0.15, 0.05]

[[mg]]  # DT in a ball mount in the turret rear
part = "su.turret_rear_mg"
position = [0.18, -0.78, 1.98]

[[mg]]  # fixed bow DT fired by the driver, right of the visor
part = "su.bow_mg"
position = [0.35, 2.90, 1.24]
normal = [0.0, 0.87, 0.50]

[[mg]]  # DShK AA mount on the cupola ring
part = "pintle_mg"
parent = "Turret"
position = [-0.50, 0.15, 3.0]
length = 1.63
post = 0.25
jacket = false

[[part]]
part = "turret_hatch"   # loader's hatch
x = 0.48
y = -0.40
diameter = 0.50
socket = true

[[part]]
part = "box_prop"       # driver's visor block in the glacis
center = [0.0, 2.52, 1.43]
size = [0.36, 0.10, 0.14]

[[part]]
part = "deck_box"       # engine deck louvres
center = [0.0, -1.90]
size = [1.9, 1.5, 0.05]

[[part]]
part = "su.fuel_drums"  # external fuel tanks on the rear hull sides
positions = [[-1.34, -2.30, 1.25], [1.34, -2.30, 1.25]]
length = 0.80
diameter = 0.34

[[part]]
part = "exhaust"
kind = "pipe"
position = [-0.70, -3.25, 1.45]
length = 0.14
diameter = 0.16

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.70, -3.25, 1.45]
length = 0.14
diameter = 0.16

[[part]]
part = "headlight"
position = [-1.20, 2.95, 1.30]
diameter = 0.20

[[part]]
part = "antenna"        # 10-RK radio whip on the turret
position = [0.60, 0.10, 2.40]
parent = "Turret"
length = 2.2

[[part]]
part = "tool"
kind = "shovel"
position = [1.45, 0.4, 1.02]

[[part]]
part = "tow_hook"
position = [0.0, 3.28, 0.80]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -3.30, 0.80]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -1.90, 1.70]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 0.55, 2.45]
parent = "Turret"

[[part]]
part = "marking"
name = "Turret_L"
parent = "Turret"
position = [-1.05, 0.30, 2.05]
normal = [-0.97, 0.0, 0.25]
size = 0.5

[[part]]
part = "marking"
name = "Turret_R"
parent = "Turret"
position = [1.05, 0.30, 2.05]
normal = [0.97, 0.0, 0.25]
size = 0.5

[[part]]
part = "marking"
name = "Turret_Rear"
kind = "number"
parent = "Turret"
position = [-0.35, -0.70, 2.10]
normal = [0.0, -0.95, 0.30]
size = 0.4

[validate]
# catalog height is the cupola top; the DShK on its mount and the antenna stand above
exclude_height = ["MG_*", "Antenna_*"]
