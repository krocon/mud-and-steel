# T-26 light tank, Model 1933 (1933-1936; prompt 063, tier 3).
# Main dimensions from data/catalog/su.toml (onwar.com): length 4.80 m (front
# sprocket to rear idler; the 45 mm muzzle stays inside, data.json barrel
# overhang 0), width 2.40 m, height 2.40 m. The catalog has no length_hull_mm:
# hull_length is the riveted hull from nose to rear plate in the drawing.
# Shapes measured in the onwar.com drawing su025t26m33.jpg (front to the left,
# about 158 px/m in both directions; never committed): eight small road wheels
# of about 0.29 m in two Vickers bogie units of four with large leaf springs,
# four return rollers, front drive sprocket, large rear idler; 0.26 m track,
# ground clearance 0.38 m (data.json); riveted hull with a raised fighting
# compartment under the turret (roof 1.25 m, compartment 1.51 m), engine deck
# dropping to the rear; cylindrical turret with a long rear bustle, offset
# about 0.14 m to the left (top view). The drawing gives the turret roof at
# 2.11 m and the hatch at 2.27 m, the catalog (data.json) 2.40 m: the fitted
# turret is about 0.13 m taller than drawn (reported in docs/VEHICLE_REFS.md).
# Armament: 45 mm 20-K with coaxial DT; second DT in the turret rear ball mount.
unit = "su_t26_1933"
assembly = "tank"

[layout]
turret_y = 0.06
turret_ring_diameter = 1.20
hull_length = 4.43
fender_overhang = 0.03

[running_gear]
part = "small_wheel_bogie"
bogies = [[0, 1, 2, 3], [4, 5, 6, 7]]
spring = "leaf"
track_width = 0.26
track_thickness = 0.03
link_pitch = 0.09
road_wheel_diameter = 0.29
road_wheels = [1.51, 1.05, 0.64, 0.20, -0.12, -0.56, -0.99, -1.42]
sprocket = { y = 2.03, z = 0.75, diameter = 0.62, teeth = 15 }    # front drive
idler = { y = -1.92, z = 0.43, diameter = 0.62 }                  # large spoked rear idler
return_rollers = { y = [1.34, 0.51, -0.34, -1.16], z = 0.86, diameter = 0.20 }

[hull]
part = "plate_hull"
upper_half_width = 0.79
lower = [[-1.85, 0.38], [1.75, 0.38], [2.215, 0.80], [2.215, 0.95], [-2.215, 0.95], [-2.215, 0.60]]
# sloped nose, driver's front plate, roof, raised fighting compartment under
# the turret, engine deck dropping to the rear
upper = [[-2.215, 0.95], [2.215, 0.95], [2.215, 1.10], [1.45, 1.20], [1.38, 1.25], [0.75, 1.25], [0.73, 1.51],
         [-0.69, 1.51], [-0.71, 1.22], [-1.55, 1.17], [-2.215, 1.00]]
fender_front = 2.38
fender_rear = -2.42                     # long rear mudguards over the idler
fender_slope_front = 0.15

[turret]
part = "su.offset_turret"
x = -0.14
height = "fit"
# cylindrical turret (front half round) with a long rear bustle
plan = [[-0.65, 0.0], [-0.56, 0.33], [-0.33, 0.56], [0.0, 0.65], [0.33, 0.56], [0.56, 0.33], [0.65, 0.0],
        [0.62, -0.35], [0.46, -1.06], [0.33, -1.16], [-0.37, -1.16], [-0.53, -1.03], [-0.64, -0.35]]
side_slope_deg = 2
bevel = 0.015

[gun]
part = "tank_gun"
trunnion = [0.62, 0.28]
x = -0.14
mantlet = { kind = "round", size = [0.40, 0.18, 0.36] }
sleeve = [0.25, 0.05]
segments = [[1.20, 0.030, 0.027]]      # 20-K: muzzle near the nose (drawing)
muzzle_brake = "none"

[[mg]]  # coaxial DT, right of the gun
part = "mg"
mount = "coax"
position = [0.16, 0.05, 0.0]

[[mg]]  # DT in the ball mount in the turret rear
part = "su.turret_rear_mg"
position = [-0.10, -1.08, 1.78]

[[part]]
part = "turret_hatch"
x = -0.30
y = 0.10
diameter = 0.42
height = 0.10
socket = true

[[part]]
part = "turret_hatch"                   # second roof hatch over the gunner
x = 0.10
y = -0.55
size = [0.45, 0.40]

[[part]]
part = "box_prop"                       # driver's vision hatch in the front plate
center = [0.40, 1.42, 1.18]
size = [0.40, 0.05, 0.12]

[[part]]
part = "deck_box"                       # radiator grille behind the turret
center = [0.30, -1.05, 1.22]
size = [0.55, 0.65, 0.04]

[[part]]
