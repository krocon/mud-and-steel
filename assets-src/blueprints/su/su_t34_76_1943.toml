# T-34/76 Model 1943 (hexagonal turret, commander's cupola). Main dimensions
# come from data/catalog/su.toml (height 2.46 m is without the cupola).
# Part dimensions are modeling estimates: road wheels 830 mm, track 500 mm,
# 60 deg upper glacis, 40 deg upper hull sides, rear drive.
unit = "su_t34_76_1943"
assembly = "tank"

[layout]
turret_y = 0.62
turret_ring_diameter = 1.42
fender_overhang = 0.03

[running_gear]
part = "christie"
track_width = 0.50
track_thickness = 0.04
link_pitch = 0.172
road_wheel_diameter = 0.83
road_wheels = [1.62, 0.80, -0.02, -0.84, -1.66]
sprocket = { y = -2.58, z = 0.62, diameter = 0.64, teeth = 6 }
idler = { y = 2.56, z = 0.56, diameter = 0.60, spoked = false }
dish = 0.04

[hull]
part = "plate_hull"
lower = [[-2.70, 0.40], [2.35, 0.40], [2.96, 0.90], [-2.96, 0.90], [-2.96, 0.55]]
# superstructure: 60 deg glacis, roof, 47 deg rear plate
upper = [[-2.96, 0.90], [2.96, 0.90], [1.70, 1.65], [-2.20, 1.65], [-2.96, 0.98]]
upper_side_slope_deg = 40
bevel = 0.02

[turret]
part = "plate_turret"
height = "fit"
# hexagonal turret ("Gaika"): narrow front, wide middle, rear overhang
plan = [[-0.62, 1.00], [0.62, 1.00], [0.98, 0.30], [0.82, -1.05], [-0.82, -1.05], [-0.98, 0.30]]
side_slope_deg = 22
front_slope_deg = 12
bevel = 0.025

[cupola]
x = -0.38
y = -0.42
diameter = 0.62
height = 0.24
vision_blocks = 6
hatch = "single"

[gun]
part = "tank_gun"
trunnion = [0.88, 0.33]
mantlet = { kind = "cast_box", size = [0.62, 0.30, 0.42] }
sleeve = [0.30, 0.10]
segments = [["fit", 0.058, 0.05]]
muzzle_brake = "none"

[[mg]]  # coaxial DT
