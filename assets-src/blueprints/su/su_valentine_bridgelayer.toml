bevel = 0.02

[[part]]
part = "box_prop"
parent = "Bridge"
center = [0.88, -0.10, 2.62]
size = [1.14, 5.90, 0.42]
bevel = 0.02

[[part]]
part = "box_prop"
parent = "Bridge"
center = [0.0, -0.10, 2.30]
size = [0.62, 5.60, 0.22]

[[part]]
part = "cylinder_prop"
parent = "Bridge"
from = [-1.45, 2.60, 3.20]
to = [1.45, 2.60, 3.20]
