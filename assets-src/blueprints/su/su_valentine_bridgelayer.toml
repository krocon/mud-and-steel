# Valentine Bridgelayer (Lend-Lease, prompt 055): turretless Valentine II
# hull carrying a folded 34 ft scissors bridge. Main dimensions from
# data/catalog/su.toml (length 5.9 m with the bridge, hull 5.41 m, width
# 2.9 m = the bridge, height 3.4 m). Modeling estimates from photographs:
# six road wheels per side on the "slow motion" bogies (here torsion-bar
# stand-ins of one size), rear drive sprocket, low riveted hull; the bridge
# folded in half lies on a frame over the hull (two treadway layers, the
# hinge at the front), a launching arm at the bow.
unit = "su_valentine_bridgelayer"
assembly = "bridgelayer"

[layout]
fender_overhang = 0.135

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.36
track_thickness = 0.04
link_pitch = 0.11
road_wheel_diameter = 0.50
road_wheels = [1.55, 0.95, 0.40, -0.40, -0.95, -1.55]
sprocket = { y = -2.30, z = 0.62, diameter = 0.64, teeth = 15 }
idler = { y = 2.30, z = 0.60, diameter = 0.60, spoked = false }
return_rollers = { y = [1.10, 0.0, -1.10], z = 0.86, diameter = 0.20 }
arm = 0.24

[hull]
part = "plate_hull"
lower = [[-2.55, 0.40], [2.30, 0.40], [2.705, 0.92], [-2.705, 0.92], [-2.705, 0.55]]
upper = [[-2.705, 0.92], [2.705, 0.92], [2.705, 1.10], [2.25, 1.55], [-2.35, 1.55], [-2.705, 1.25]]
bevel = 0.012
fender_front = 2.70

# Frame the folded bridge rests on.
[[part]]
part = "box_prop"
center = [0.0, -0.4, 1.66]
size = [2.0, 3.6, 0.22]

# The folded scissors bridge: two treadway layers, hinge at the front.
[[part]]
part = "box_prop"
parent = "Bridge"
center = [-0.88, -0.10, 1.98]
size = [1.14, 5.90, 0.42]
bevel = 0.02

[[part]]
part = "box_prop"
parent = "Bridge"
center = [0.88, -0.10, 1.98]
size = [1.14, 5.90, 0.42]
bevel = 0.02

[[part]]
