# KV-1E Model 1940 (spring/summer 1941): KV-1 with bolted additional
# armor plates ("s ekranami") on the turret and the hull sides and the
# 76.2 mm F-32 (L/31.5). Main dimensions from data/catalog/su.toml: length
# 6.80 m (no gun overhang), width 3.30 m, height 2.70 m. No drawing in the
# reference folder (prompt 063): hull, running gear and turret as
# su_kv1_1941 (onwar.com drawing su012kv1m41.jpg); hull 6.75 m ([layout],
# the catalog has no hull length). Appliqué plates as thin boxes on the
# turret faces and the upper hull sides (estimates from photographs).
unit = "su_kv1e"
assembly = "tank"

[layout]
hull_length = 6.75
turret_y = 0.15
turret_ring_diameter = 1.54
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.65
track_thickness = 0.05
link_pitch = 0.16
road_wheel_diameter = 0.60
road_wheels = [2.37, 1.46, 0.55, -0.36, -1.23, -2.06]
sprocket = { y = -2.91, z = 0.64, diameter = 0.72, teeth = 16 }
idler = { y = 3.07, z = 0.70, diameter = 0.62, spoked = true }
return_rollers = { y = [1.74, -0.11, -1.83], z = 1.00, diameter = 0.34 }
arm = 0.30
dish = 0.04

[hull]
part = "plate_hull"
lower = [[-3.10, 0.45], [2.95, 0.45], [3.40, 1.30], [-3.40, 1.30], [-3.40, 0.75]]
# glacis 25 deg from horizontal, driver's front plate, roof, rounded rear
upper = [[-3.40, 1.30], [3.40, 1.30], [2.40, 1.50], [2.15, 1.69], [-2.95, 1.69], [-3.30, 1.52], [-3.40, 1.38]]
upper_half_width = 0.97
bevel = 0.02

[turret]
part = "plate_turret"
height = 0.84
# welded turret: chamfered front corners, widest ahead of the ring center,
# narrower rear over the engine deck
plan = [[-0.70, 1.27], [0.70, 1.27], [0.84, 1.05], [0.92, 0.30], [0.80, -1.05], [0.66, -1.28], [-0.66, -1.28], [-0.80, -1.05], [-0.92, 0.30], [-0.84, 1.05]]
side_slope_deg = 17
bevel = 0.02

[gun]
part = "tank_gun"
trunnion = [1.30, 0.52]
mantlet = { kind = "cast_box", size = [0.62, 0.55, 0.58] }
sleeve = [0.30, 0.11]       # F-32 cradle
segments = [[1.05, 0.055, 0.05]]
muzzle_brake = "none"

[[mg]]  # coaxial DT, right of the gun
part = "mg"
mount = "coax"
position = [0.22, 0.20, 0.0]

[[mg]]  # bow DT in a ball mount, left of the driver
part = "mg"
mount = "ball"
position = [-0.50, 2.30, 1.58]

[[mg]]  # DT in a ball mount in the turret rear
part = "su.turret_rear_mg"
position = [0.0, -1.28, 2.10]

[[part]]
part = "turret_hatch"         # large hatch over the rear of the roof
x = 0.0
y = -0.45
diameter = 0.70
socket = true

[[part]]
part = "cylinder_prop"        # PT-K periscope, roof front left
parent = "Turret"
from = [-0.40, 0.95, 2.52]
to = [-0.40, 0.95, 2.70]
radius = 0.07

[[part]]
part = "cylinder_prop"        # periscope, roof right
parent = "Turret"
from = [0.40, 0.55, 2.52]
to = [0.40, 0.55, 2.66]
radius = 0.06

[[part]]
part = "plate"                # bolted plates on the turret sides (mirrored)
parent = "Turret"
corners = [[0.779, -0.75, 1.80], [0.886, 0.45, 1.80], [0.72, 0.45, 2.35], [0.613, -0.75, 2.35]]
thickness = 0.035
mirror = true

[[part]]
part = "box_prop"             # bolted plate on the left hull side
center = [-0.99, 0.65, 1.50]
size = [0.03, 2.60, 0.32]

[[part]]
part = "box_prop"             # bolted plate on the right hull side
center = [0.99, 0.65, 1.50]
