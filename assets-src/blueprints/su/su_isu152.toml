# ISU-152 heavy self-propelled gun (accepted November 1943) on the IS chassis.
# Main dimensions from data/catalog/su.toml: length 9.18 m with gun, hull 6.77 m,
# width 3.07 m, height 2.48 m (superstructure roof).
# Running gear and lower hull follow su_is2 (six 550 mm road wheels on torsion
# bars, three return rollers, rear sprocket, 650 mm track). Modeling estimates
# from photographs and drawings (Wikipedia "ISU-152"; Zaloga): tall box-shaped
# superstructure over the front two thirds of the hull, its sides continuing the
# sloped upper hull sides, front plate about 30 deg; ML-20S mounted right of the
# center line in a large cast box mantlet with a heavy armored sleeve and a
# slotted multi-baffle muzzle brake; three roof hatches, the DShK AA mount on the
# loader's hatch (from 1945); external fuel tanks on the rear hull sides.
unit = "su_isu152"
assembly = "casemate"

[layout]
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.65
track_thickness = 0.05
link_pitch = 0.16
road_wheel_diameter = 0.55
road_wheels = [2.30, 1.45, 0.60, -0.25, -1.10, -1.95]
sprocket = { y = -2.95, z = 0.72, diameter = 0.68, teeth = 14 }
idler = { y = 2.95, z = 0.64, diameter = 0.60, spoked = false }
return_rollers = { y = [1.85, 0.20, -1.50], z = 0.90, diameter = 0.24 }
arm = 0.32

[hull]
part = "plate_hull"
lower = [[-3.20, 0.42], [2.95, 0.42], [3.385, 0.95], [-3.385, 0.95], [-3.385, 0.62]]
# short upper nose plate up to the superstructure, engine deck, sloped rear plate
upper = [[-3.385, 0.95], [3.385, 0.95], [3.10, 1.52], [-3.05, 1.52], [-3.385, 1.25]]
upper_side_slope_deg = 15
bevel = 0.02

[casemate]
part = "casemate"
plan = [[-1.38, 3.00], [1.38, 3.00], [1.38, -0.40], [-1.38, -0.40]]
side_slope_deg = 15
front_slope_deg = 34
rear_slope_deg = 5
bevel = 0.025

[gun]
part = "tank_gun"
trunnion = [2.30, 1.90]      # model space: y, z
x = 0.30                     # gun right of the center line
mantlet = { kind = "cast_box", size = [0.92, 0.45, 0.80] }
sleeve = [0.60, 0.17]
segments = [["fit", 0.10, 0.095]]
muzzle_brake = "slotted"

[[mg]]  # DShK on the loader's hatch ring
part = "pintle_mg"
position = [0.62, -0.05, 2.64]
length = 1.63
post = 0.16
jacket = false

[[part]]
part = "hull_hatch"           # commander's hatch, left
center = [-0.62, 0.70]
z = "casemate"
size = [0.55, 0.55]
hinge = "rear"
socket = true

[[part]]
part = "hull_hatch"           # loader's hatch, right rear
center = [0.62, -0.05]
z = "casemate"
size = [0.55, 0.55]
hinge = "rear"

[[part]]
part = "hull_hatch"           # gunner's hatch
center = [-0.20, -0.05]
z = "casemate"
size = [0.45, 0.45]
hinge = "rear"

[[part]]
part = "box_prop"             # panoramic sight head, left of the gun
center = [-0.25, 1.45, 2.47]
size = [0.14, 0.16, 0.06]

[[part]]
part = "box_prop"             # driver's visor in the superstructure front, left
center = [-0.60, 2.82, 1.78]
size = [0.32, 0.10, 0.12]

[[part]]
part = "deck_box"             # engine deck louvres
center = [0.0, -2.00]
size = [1.9, 1.4, 0.05]

[[part]]
part = "su.fuel_drums"        # external fuel tanks on the rear hull sides
positions = [[-1.34, -0.95, 1.20], [-1.34, -2.05, 1.20], [1.34, -0.95, 1.20], [1.34, -2.05, 1.20]]
length = 1.02
diameter = 0.34

[[part]]
part = "exhaust"
kind = "pipe"
position = [-0.70, -3.25, 1.40]
length = 0.14
diameter = 0.16

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.70, -3.25, 1.40]
length = 0.14
diameter = 0.16

[[part]]
part = "headlight"
position = [-1.20, 3.05, 1.35]
diameter = 0.20

[[part]]
part = "antenna"              # 10-RK radio whip, left rear of the roof
position = [-1.05, -0.20, 2.48]
length = 2.0

[[part]]
part = "tool"
kind = "shovel"
position = [1.45, -1.2, 1.02]

[[part]]
part = "tow_hook"
position = [0.0, 3.28, 0.80]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -3.30, 0.80]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -2.0, 1.60]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.0, 2.48]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.25, 0.90, 2.00]
normal = [-0.97, 0.0, 0.26]
size = 0.5

[[part]]
part = "marking"
name = "Hull_R"
position = [1.25, 0.90, 2.00]
normal = [0.97, 0.0, 0.26]
size = 0.5

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [-0.40, -0.40, 2.00]
normal = [0.0, -0.99, 0.09]
size = 0.4

[validate]
# catalog height is the superstructure roof; hatches, DShK and antenna stand above
exclude_height = ["Hatch_*", "MG_*", "Antenna_*"]
