# SU-152 heavy self-propelled gun (1943) on the KV-1S chassis. Main
# dimensions from data/catalog/su.toml: length 8.95 m with gun, hull 6.70 m,
# width 3.25 m, height 2.45 m (superstructure roof). No drawing in the
# reference folder (prompt 063): running gear and lower hull as su_kv1s
# (onwar.com drawing su013kv1s.jpg); superstructure, gun and fittings
# estimated from photographs (Wikipedia "SU-152") and su_isu152: box-shaped
# superstructure over the front half of the hull, its base on the fenders,
# front plate about 30 deg, sides about 20 deg; ML-20S right of the center
# line in a box mantlet with a heavy armored sleeve and a slotted muzzle
# brake; no machine gun (catalog); roof hatches; engine deck behind.
unit = "su_su152"
assembly = "casemate"

[layout]
fender_overhang = 0.0

[running_gear]
part = "torsion_bar"
twin = false
track_width = 0.67
track_thickness = 0.05
link_pitch = 0.16
road_wheel_diameter = 0.60
road_wheels = [2.37, 1.46, 0.55, -0.36, -1.23, -2.06]
sprocket = { y = -2.91, z = 0.64, diameter = 0.72, teeth = 16 }
idler = { y = 3.07, z = 0.70, diameter = 0.62, spoked = true }
return_rollers = { y = [1.74, -0.11, -1.83], z = 1.00, diameter = 0.34 }
arm = 0.30
dish = 0.04
spokes = 8

[hull]
part = "plate_hull"
lower = [[-3.10, 0.45], [2.95, 0.45], [3.40, 1.22], [-3.40, 1.22], [-3.40, 0.75]]
# flat glacis, driver's front plate, roof, rounded rear
upper = [[-3.40, 1.22], [3.40, 1.22], [2.50, 1.38], [2.30, 1.55], [-2.95, 1.55], [-3.30, 1.42], [-3.40, 1.30]]
upper_half_width = 0.97
bevel = 0.02

[casemate]
part = "casemate"
plan = [[-1.42, 2.70], [1.42, 2.70], [1.42, -0.55], [-1.42, -0.55]]
z = 1.31
side_slope_deg = 20
front_slope_deg = 30
rear_slope_deg = 8
bevel = 0.025

[gun]
part = "tank_gun"
trunnion = [2.15, 1.88]      # model space: y, z
x = 0.25                     # gun right of the center line
mantlet = { kind = "cast_box", size = [0.92, 0.45, 0.80] }
sleeve = [0.60, 0.17]
segments = [["fit", 0.10, 0.095]]
muzzle_brake = "slotted"

[[part]]
part = "hull_hatch"           # commander's hatch, left
center = [-0.60, 0.60]
z = "casemate"
size = [0.55, 0.55]
hinge = "rear"
socket = true

[[part]]
part = "hull_hatch"           # loader's hatch, right rear
center = [0.60, -0.15]
z = "casemate"
size = [0.55, 0.55]
hinge = "rear"

[[part]]
part = "hull_hatch"           # gunner's hatch
center = [-0.15, -0.15]
z = "casemate"
size = [0.45, 0.45]
hinge = "rear"

[[part]]
part = "box_prop"             # panoramic sight head, left of the gun
center = [-0.30, 1.35, 2.40]
size = [0.14, 0.16, 0.08]

[[part]]
part = "box_prop"             # driver's visor in the superstructure front, left
center = [-0.60, 2.45, 1.80]
size = [0.32, 0.10, 0.12]

[[part]]
part = "deck_box"             # engine deck louvres
center = [0.0, -1.90]
size = [1.6, 1.4, 0.04]

[[part]]
part = "su.fuel_drums"        # external fuel tanks on the rear hull sides
positions = [[-1.30, -1.20, 1.52], [-1.30, -2.25, 1.52], [1.30, -1.20, 1.52], [1.30, -2.25, 1.52]]
length = 0.95
diameter = 0.34

[[part]]
part = "exhaust"
kind = "pipe"
position = [-0.45, -3.26, 1.12]
length = 0.08
diameter = 0.16

[[part]]
part = "exhaust"
kind = "pipe"
position = [0.45, -3.26, 1.12]
length = 0.08
diameter = 0.16

[[part]]
part = "headlight"
position = [-0.85, 2.80, 1.38]
diameter = 0.20

[[part]]
part = "antenna"              # 10-RK radio whip, left rear of the roof
position = [-1.00, -0.35, 2.45]
length = 2.0

[[part]]
part = "tool"
kind = "shovel"
position = [1.40, 1.6, 1.30]

[[part]]
part = "tow_hook"
position = [0.0, 3.25, 0.95]
pair = true
socket = false

[[part]]
part = "tow_hook"
position = [0.0, -3.25, 0.95]
pair = true

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, -2.0, 1.57]

[[part]]
part = "socket"
name = "Socket_Fire_"
position = [0.0, 1.0, 2.45]

[[part]]
part = "marking"
name = "Hull_L"
position = [-1.22, 0.90, 1.90]
normal = [-0.94, 0.0, 0.34]
size = 0.5

[[part]]
part = "marking"
name = "Hull_R"
position = [1.22, 0.90, 1.90]
normal = [0.94, 0.0, 0.34]
size = 0.5

[[part]]
part = "marking"
name = "Hull_Rear"
kind = "number"
position = [-0.40, -0.62, 1.90]
normal = [0.0, -0.99, 0.14]
size = 0.4

[validate]
# catalog height is the superstructure roof; hatches and antenna stand above
exclude_height = ["Hatch_*", "Antenna_*"]
