# T-34-85 Model 1944: T-34 hull stretched to the catalog 6.10 m (running gear
# stations of su_su85), large three-man cast turret with the 85 mm ZiS-S-53,
# commander's cupola at the left rear, loader's hatch right, two ventilator
# domes at the rear of the roof. Checked against the onwar.com drawing
# su047t3485m44.jpg (prompt 063): turret plan, ring 0.5 m ahead of the hull
# center, gun axis, fuel tanks. The drawing is not uniformly scaled (side view
# about 195 px/m along, 183 px/m up when the catalog height 2.72 m is the
# cupola top); catalog values win.
unit = "su_t34_85_1944"
assembly = "tank"

[layout]
turret_y = 0.51
turret_ring_diameter = 1.60
fender_overhang = 0.03

[running_gear]
part = "christie"
track_width = 0.50
track_thickness = 0.04
link_pitch = 0.172
road_wheel_diameter = 0.83
road_wheels = [1.67, 0.82, -0.02, -0.87, -1.71]
sprocket = { y = -2.66, z = 0.62, diameter = 0.64, teeth = 6 }
idler = { y = 2.64, z = 0.56, diameter = 0.60, spoked = false }
dish = 0.04

[hull]
part = "plate_hull"
lower = [[-2.78, 0.40], [2.42, 0.40], [3.05, 0.90], [-3.05, 0.90], [-3.05, 0.55]]
# superstructure: 60 deg glacis, roof, 47 deg rear plate
upper = [[-3.05, 0.90], [3.05, 0.90], [1.76, 1.65], [-2.27, 1.65], [-3.05, 0.98]]
upper_side_slope_deg = 40
bevel = 0.02

[turret]
part = "plate_turret"
height = "fit"
cast = true
# long cast turret: rounded narrow front, widest just behind the ring center,
# rear bustle over the engine deck (half widths from the drawing's top view)
plan = [[-0.50, 1.32], [0.50, 1.32], [0.85, 0.86], [0.93, 0.10], [0.90, -0.60], [0.80, -1.00], [0.49, -1.32], [-0.49, -1.32], [-0.80, -1.00], [-0.90, -0.60], [-0.93, 0.10], [-0.85, 0.86]]
side_slope_deg = 12
front_slope_deg = 14
bevel = 0.05

[cupola]
x = -0.40
y = -0.40
diameter = 0.70
height = 0.20
vision_blocks = 5
hatch = "split"

[gun]
part = "tank_gun"
trunnion = [1.30, 0.42]
mantlet = { kind = "cast_box", size = [0.74, 0.40, 0.50] }
sleeve = [0.32, 0.12]
segments = [["fit", 0.066, 0.058]]
muzzle_brake = "none"

[[mg]]  # coaxial DT
part = "mg"
mount = "coax"
position = [0.22, 0.30, 0.0]

[[part]]
part = "su.glacis_ball_mg"   # bow DT in a ball mount, radio operator side
x = 0.55
y = 2.45

[[part]]
part = "su.glacis_hatch"
x = -0.42
y = 2.35
size = [0.55, 0.62]

[[part]]
part = "turret_hatch"        # loader's hatch, right
x = 0.42
y = -0.40
diameter = 0.55
socket = true

[[part]]
