# T-26S light tank, Model 1939 (1939-1940; prompt 063, tier 3).
# Main dimensions from data/catalog/su.toml (onwar.com): length 4.80 m, width
# 2.40 m, height 2.30 m. Shapes measured in the onwar.com drawing
# su027t26sm39.jpg (front to the left, about 158 px/m; never committed).
# Chassis, running gear, turret and gun as su_t26s_1937 (same positions in
# both drawings). Difference kept in the model: the turret stands on a wide
# platform with sloped armor walls (about 1.95 x 1.60 m at the base, out over
# the mudguards, top at 1.55 m), instead of the narrow vertical-walled box.
# The drawing gives the turret roof at 2.10 m and the hatch at 2.30 m (catalog).
unit = "su_t26s_1939"
assembly = "tank"

[layout]
turret_y = 0.06
turret_ring_diameter = 1.20
hull_length = 4.43
fender_overhang = 0.03

[running_gear]
part = "small_wheel_bogie"
bogies = [[0, 1, 2, 3], [4, 5, 6, 7]]
spring = "leaf"
track_width = 0.26
track_thickness = 0.03
link_pitch = 0.09
road_wheel_diameter = 0.29
road_wheels = [1.51, 1.05, 0.64, 0.20, -0.12, -0.56, -0.99, -1.42]
sprocket = { y = 2.03, z = 0.75, diameter = 0.62, teeth = 15 }    # front drive
idler = { y = -1.92, z = 0.43, diameter = 0.62 }                  # large spoked rear idler
return_rollers = { y = [1.34, 0.51, -0.34, -1.16], z = 0.86, diameter = 0.20 }

[hull]
part = "plate_hull"
upper_half_width = 0.79
lower = [[-1.85, 0.38], [1.75, 0.38], [2.215, 0.80], [2.215, 0.95], [-2.215, 0.95], [-2.215, 0.60]]
# sloped nose, driver's front plate, roof, raised fighting compartment under
# the turret, engine deck dropping to the rear
upper = [[-2.215, 0.95], [2.215, 0.95], [2.215, 1.10], [1.45, 1.20], [1.38, 1.25], [0.80, 1.25], [0.66, 1.57],
         [-0.72, 1.57], [-0.76, 1.22], [-1.55, 1.17], [-2.215, 1.00]]
fender_front = 2.38
fender_rear = -2.42                     # long rear mudguards over the idler
fender_slope_front = 0.15

[turret]
part = "su.offset_turret"
x = -0.14
height = "fit"
# conical welded turret of oval plan, pointed front
plan = [[0.0, 0.76], [0.23, 0.68], [0.43, 0.46], [0.67, 0.14], [0.72, -0.25], [0.67, -0.64], [0.51, -0.96],
        [0.28, -1.18], [0.0, -1.26], [-0.28, -1.18], [-0.51, -0.96], [-0.67, -0.64], [-0.72, -0.25],
        [-0.67, 0.14], [-0.43, 0.46], [-0.23, 0.68]]
side_slope_deg = 16
front_slope_deg = 22
rear_slope_deg = 0
bevel = 0.015

[gun]
part = "tank_gun"
trunnion = [0.70, 0.26]
x = -0.14
mantlet = { kind = "round", size = [0.40, 0.18, 0.36] }
sleeve = [0.25, 0.05]
segments = [[1.15, 0.030, 0.027]]      # 20-K M1938: muzzle near the nose (drawing)
muzzle_brake = "none"

[[mg]]  # coaxial DT, right of the gun
part = "mg"
mount = "coax"
position = [0.16, 0.05, 0.0]

[[mg]]  # DT in the ball mount in the turret rear
part = "su.turret_rear_mg"
position = [-0.12, -1.16, 1.86]

