[[part]]
part = "marking"
name = "Turret_Rear"
kind = "number"
parent = "Turret"
position = [-0.65, -1.26, 2.80]
normal = [0.0, -1.0, 0.0]
size = 0.35

[validate]
# catalog height is the turret top (hatch); the antenna stands above
exclude_height = ["Antenna_*"]
