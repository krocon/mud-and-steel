mp_40 = "Schüsse der MP 40 deutscher Trupps, Panzerbesatzungen und des Sd.Kfz. 222; statt shot_mg."
ppsh_41 = "Schüsse der PPSh-41 sowjetischer Trupps und Panzerbesatzungen; statt shot_mg."

