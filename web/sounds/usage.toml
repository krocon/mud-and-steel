# When the game plays each sound (prompt 083). Shown on the sound page
# (`just sounds-web`), checked by `just sounds-web --check`.
#
# One German sentence per entry (about 120 characters at most) naming the occasion,
# not the sound. Taken from the code: godot/scenes/audio/*.gd, world/air_view.gd,
# world/artillery_view.gd, world/destruction_view.gd, world/crater_view.gd.
# A class the code never plays reads "Derzeit ungenutzt."
#
# Tables: [class] = folders of the manifest classes (sounds.json), [weapon] =
# weapon/<slug>/, [ambience] = ambience/<layer>/, [music] = moods of music/<mood>_NN,
# [voice] = callouts of voice/<faction>/<callout>/ (may stand before any file ships).
# Only plain `key = "text"` lines: the tool reads this file without a TOML library.

[class]
# Shots (sound_classes.gd shot_class, indirect_shot_class; acoustics.gd air events)
shot_rifle = "Schuss einer Waffe unter 20 mm mit Kadenz unter 300 Schuss/min: Gewehre, Karabiner, Pistolen."
shot_mg = "Schuss unter 20 mm ab 300 Schuss/min (MG, MPi); auch MG-Flak (−3 dB) und Tiefflieger-Beschuss aus der Luft."
shot_cannon_small = "Kanonenschuss von 20 bis 36 mm (Maschinenkanonen, leichte Pak); auch leichte Flak gegen Flugzeuge (−3 dB)."
shot_cannon_medium = "Kanonenschuss von 37 bis 74 mm, außer Mörsern, Haubitzen und Panzerabwehrtrupps."
shot_cannon_large = "Kanonenschuss ab 75 mm, außer Mörsern, Haubitzen und Panzerabwehrtrupps."
shot_mortar = "Abschuss eines Mörsers (Mörsertrupps, schwere Mörser, „GrW“ im Waffennamen), direkt wie indirekt."
shot_rocket = "Schuss eines Panzerabwehrtrupps ab 20 mm (Panzerschreck, Panzerfaust, Bazooka) und Salve eines Raketenwerfers."
shot_howitzer = "Abschuss einer Feldhaubitze, einer Selbstfahrlafette ab 100 mm und jedes indirekte Feuer außer Mörsern und Raketen."

# Supersonic crack and reverberation (acoustics.gd scan_cracks; sound_classes.gd blast_tail_db; battle_sound.gd _destroyed)
crack_bullet = "Überschallgeschoss unter 20 mm fliegt bis 12 m am Hörpunkt vorbei; nur bis 200 m Kameraabstand."
crack_shell = "Überschallgranate ab 20 mm fliegt bis 25 m am Hörpunkt vorbei; nur bis 200 m Kameraabstand."
explosion_tail = "Nachrollen nach Granateinschlägen ab 100 mm, Fahrzeugexplosionen ab Größe eines mittleren Panzers und Abstürzen."

# Impacts and hits (sound_classes.gd hit_class; battle_sound.gd shell_incoming, smoke)
hit_bullet_ground = "Geschoss unter 20 mm schlägt in den Boden oder in ein Kartenobjekt (dort −3 dB)."
hit_bullet_armor = "Geschoss unter 20 mm trifft ein Fahrzeug."
hit_shell_small = "Granate von 20 bis 36 mm schlägt auf Boden oder Infanterie ein; leise (−8 dB) bei jeder Nebelgranate."
hit_shell = "Granate ab 37 mm schlägt auf Boden oder Infanterie ein, lauter und tiefer mit dem Kaliber."
hit_shell_water = "Granate ab 20 mm schlägt in flaches oder tiefes Wasser ein."
hit_ricochet = "Granate ab 20 mm trifft ein Fahrzeug und durchschlägt die Panzerung nicht."
hit_penetration = "Granate ab 20 mm trifft ein Fahrzeug und durchschlägt die Panzerung."
hit_object = "Granate ab 20 mm trifft ein Kartenobjekt (Gebäude, Mauer, Baum)."
shell_incoming = "Indirekt verschossene Granate schlägt in etwa 1,5 s ein (Pfeifen am Zielpunkt); Nebelgranaten 8 dB leiser."

# Explosions and fire (battle_sound.gd _destroyed, _assign_fires; acoustics.gd air events)
explosion_vehicle = "Fahrzeug wird zerstört (tiefer mit seiner Größe) oder ein Flugzeug stürzt ab."
flak_burst = "Granate schwerer Flak zerplatzt am Himmel."
fire = "Brennendes Wrack: 60 s Feuer, dann 90 s leiser schwelend; brennende Kartenobjekte unter 8 m Größe."
fire_large = "Brennendes Kartenobjekt ab 8 m Größe, lauter mit der Größe, leiser, während es herunterbrennt."

# Vehicles and aircraft (sound_classes.gd engine_class, has_tracks; acoustics.gd _aircraft_class)
engine_wheel = "Motor eines Lastwagens oder Spähwagens in Hörweite; Tonhöhe und Lautstärke folgen der Geschwindigkeit."
engine_halftrack = "Motor eines Halbkettenfahrzeugs in Hörweite; Tonhöhe und Lautstärke folgen der Geschwindigkeit."
engine_track_light = "Motor eines Kettenfahrzeugs unter 20 t Gefechtsmasse in Hörweite (Panzer, Jagdpanzer, Sturmgeschütze)."
engine_track_heavy = "Motor eines Kettenfahrzeugs ab 20 t Gefechtsmasse in Hörweite (Panzer IV, T-34, Sherman und schwerer)."
tracks = "Kettengerassel jedes Kettenfahrzeugs neben seinem Motor; im Stand stumm, lauter mit der Geschwindigkeit."
engine_aircraft = "Eines der drei nächsten Flugzeuge mit unter 18 m Spannweite; Tonhöhe nach Doppler, höher im Absturz."
engine_bomber = "Eines der drei nächsten Flugzeuge ab 18 m Spannweite; Tonhöhe nach Doppler, höher im Absturz."

# Buildings and objects (sound_classes.gd object_class; battle_sound.gd _destroyed, crater_event)
building_damage = "Ein Gebäude wird von Granaten ab 20 mm beschädigt (Stufe „beschädigt“ in data/destruction.toml)."
building_collapse = "Gebäude oder Munitions-/Treibstofflager wird zur Ruine, oder ein Basisgebäude wird zerstört."
tree_fall = "Ein Baum wird von einer Granate ab 20 mm gefällt."
wall_break = "Mauer, Hecke, Heuballen oder Holzstapel wird zerstört und verschwindet."
fence_crush = "Fahrzeug walzt einen Holzzaun (ab 2,5 t) oder Stacheldraht (ab 8 t) platt."
crater = "Ein Krater entsteht: Erde regnet herab, lauter mit dem Kaliber; Graben von Pionieren bleibt stumm."

# Notices and interface (battle_sound.gd notice, _watch_notices; ui_sound.gd; air_view.gd _warn)
ui_click = "Klick auf jeden Knopf in jedem Bildschirm: Menü, Lobby, Editor, Spiel."
ui_select = "Die Auswahl eigener Einheiten ändert sich und ist nicht leer; höchstens alle 0,12 s."
ui_order = "Befehl zum Bewegen, Angreifen oder Besetzen eines Gebäudes ist erteilt; höchstens alle 0,12 s."
ui_unit_ready = "Neue eigene Einheit (kein Gebäude) erscheint, nicht in den ersten 2 s; höchstens jede Sekunde."
ui_build_complete = "Eigenes Basisgebäude ist fertig gebaut; höchstens jede Sekunde."
ui_under_attack = "Eigene Einheit wird getroffen oder Feindflugzeuge kommen in Sicht; höchstens alle 20 Sekunden."
ui_unit_lost = "Eigene Einheit wird zerstört; höchstens alle 6 Sekunden."
ui_victory = "Das Gefecht ist entschieden und der eigene Spieler hat gewonnen."
ui_defeat = "Das Gefecht ist entschieden und der eigene Spieler hat nicht gewonnen (auch bei Unentschieden)."

