note = "Prompt 119. Paddled by the men aboard (2 engineers and 6 passengers paddle). draft_mm = depth minus 8 in freeboard at full load, derived. speed_water_kmh_x10 = 4 km/h is an estimate for a paddled boat (no source). No armor (plywood), no weapon. Used e.g. at the Waal crossing at Nijmegen (Sep 1944). Two boats lashed together carry a 37 mm gun; not modeled (cargo_vehicles none)."
