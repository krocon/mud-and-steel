[[unit]]
id = "de_inf_rifle_squad"
faction = "de"
category = "inf_rifle"
name_de = "Schützengruppe (1944)"
name_en = "Rifle squad (1944)"
designation = "Schützengruppe, Infanterie-Division 44"
year_from = 1943
year_to = 1945
tier = 1
model = "assets/models/de/de_inf_rifle_squad.tscn"
squad_size = 9
speed_road_kmh_x10 = 50
speed_offroad_kmh_x10 = 40
weapon = [
    { name = "MP 40", count = 1, caliber_mm_x10 = 90, ammo = "9 mm Parabellum", rate_rpm = 500, muzzle_velocity_mps = 400, range_effective_m = 100 },
    { name = "MG 42", count = 1, caliber_mm_x10 = 79, ammo = "7.92x57 mm s.S.", rate_rpm = 1200, muzzle_velocity_mps = 740, range_effective_m = 800, ammo_carried = 1800 },
    { name = "Kar98k", count = 6, caliber_mm_x10 = 79, ammo = "7.92x57 mm s.S.", rate_rpm = 15, muzzle_velocity_mps = 760, range_effective_m = 500 },
    { name = "P 38", count = 2, caliber_mm_x10 = 90, ammo = "9 mm Parabellum", muzzle_velocity_mps = 365, range_effective_m = 50 },
    { name = "Stielhandgranate 24", count = 9 },
]
source = [
    { ref = "TM-E 30-451 Handbook on German Military Forces (US War Dept., March 1945), ch. II (infantry division 1944, rifle squad)", covers = "1944 squad size (not re-fetched)" },
    { ref = "https://festung.net/wehrmacht-squad-regulations/", covers = "H.Dv. 130/2a (1942): roles and weapons per position - leader MP, Schütze 1 MG + pistol, Schütze 2 pistol + ammunition, Schütze 3 rifle + ammunition, riflemen with rifle" },
    { ref = "https://militaryhistoryvisualized.com/?p=433", covers = "MIS 'The German Squad in Combat' (1943): 10-man squad, MG ammunition 5 x 50-round drums + 3 x 300-round boxes" },
    { ref = "https://en.wikipedia.org/wiki/MG_42", covers = "MG 42 cyclic rate, muzzle velocity, squad MG ammunition 1800 rounds" },
    { ref = "https://en.wikipedia.org/wiki/Karabiner_98k", covers = "Kar98k muzzle velocity and effective range" },
    { ref = "Gander/Chamberlain, Small Arms, Artillery and Special Weapons of the Third Reich (1978), MP 40 and P 38 entries", covers = "MP 40 and P 38 data" },
]
uncertain = ["weapon"]
note = "1944 Schützengruppe of 9 men: Gruppenführer (MP 40), MG-Schütze 1 and 2 (MG 42, P 38 each), 6 riflemen incl. Schütze 3 as ammunition bearer (Kar98k). Earlier squads (H.Dv. 130/2a 1942, MIS 1943) had 10 men with the same role/weapon pattern; the 9-man 1944 strength is supported only by secondary/hobby sources found online (TM-E 30-451 not re-fetched). MG ammunition: 1800 rounds (Wikipedia) vs ~1150 rounds carried by the 1943 squad (MIS); 1800 used. Leaders sometimes carried the StG 44 instead of the MP 40 in late 1944/45. MG 42 effective range on bipod given as 800 m (sources vary 600-1000 m). Kar98k rate is a practical aimed rate. Hand grenade count (one per man) is an assumption."

