[package]
name = "bridge"
description = "Thin godot-rust GDExtension that hosts the simulation in Godot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sim.workspace = true
net.workspace = true
editor.workspace = true
ai.workspace = true
godot.workspace = true
# Reading only the header of map.toml for the map picker (prompt 201).
serde.workspace = true
toml.workspace = true
# Online over Steam (prompt 026). Without it the game builds and runs
# without any Steam library; `SteamLobby` then reports that.
steam = { workspace = true, optional = true }

[features]
default = ["steam"]
steam = ["dep:steam"]

# No `float_arithmetic` deny here: the bridge intentionally converts sim fixed-point
# values to/from f32 for Godot. `unsafe_code = "deny"` (instead of "forbid") allows
# only the single `#[gdextension] unsafe impl ExtensionLibrary` entry point.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
flat_map_option = "warn"
