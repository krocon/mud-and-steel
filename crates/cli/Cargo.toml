[package]
name = "cli"
description = "Headless simulation runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
png.workspace = true
sim.workspace = true
net.workspace = true
editor.workspace = true
mapgen.workspace = true
ai.workspace = true
clap.workspace = true
# Stuck audit settings (stuck_audit.rs).
serde.workspace = true
toml.workspace = true
# `steam-host`/`steam-join` (prompt 026); off by default, so the CLI and its
# tests never need the Steam library.
steam = { workspace = true, optional = true }

[features]
steam = ["dep:steam"]

[lints.rust]
unsafe_code = "forbid"
