name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon (ARM64), the others on x86_64.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # data/maps/*/*.png are in Git LFS; test_small is compiled into sim.
          lfs: true

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Test runner of `just check`: runs all tests in parallel across the
      # test binaries (docs/VERSIONS.md).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Steam is optional (prompt 026): the bridge must also build without
      # it, and the CLI's Steam peers only with it. No Steam client needed.
      - name: Clippy (bridge without Steam)
        run: cargo clippy -p bridge --no-default-features --all-targets -- -D warnings

      - name: Clippy (CLI with Steam)
        run: cargo clippy -p cli --features steam --all-targets -- -D warnings

      # Includes the golden-hash test (crates/sim/tests/determinism.rs): it
      # passing on all three systems proves bit-identical simulation results.
      # --no-fail-fast: one failing test must not hide the result of the others.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      - name: Headless run
        run: cargo run -p cli -- run --ticks 1000 --seed 42

      # Vehicle database (prompt 064): schema, index and agreement with the
      # catalog. Plain Python 3, no reference folder needed.
      - name: Vehicle database
        if: runner.os == 'Linux'
        run: python3 tools/vehicle_refs.py --check

      # Map from real geodata (prompt 081): generated twice from the
      # sources in assets-src/geo/, identical, and equal to the committed
      # map. Plain Python 3.
      - name: Geodata map
        if: runner.os == 'Linux'
        run: python3 -I tools/geo_import.py check assets-src/geo/harbor_city/site.json

      # Sound page (prompt 083): every sound folder has a remark in
      # web/sounds/usage.toml and vice versa. Folder and file names only, so
      # it needs neither Git LFS nor the private sounds.
      - name: Sound remarks
        if: runner.os == 'Linux'
        run: python3 -I tools/sounds_web.py --check

  # Performance (prompt 016, docs/PERFORMANCE.md): the overall benchmark on
  # one runner. Informational only: shared CI machines are too noisy for a
  # hard limit, so this job never blocks a merge. The table lands in the
  # job summary; compare it with docs/PERFORMANCE.md by hand.
  bench:
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Bench (bench_large, 2 Hard AIs, 3000 ticks, minimum of 2 runs)
        run: |
          cargo run -q --release -p cli -- bench --ticks 3000 --runs 2 --windows 5 | tee bench.txt
          {
            echo '## cli bench'
            echo
            echo '```'
            head -n 3 bench.txt
            echo '```'
            echo
            tail -n +4 bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
