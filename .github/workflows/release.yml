name: Release

# Release builds (prompt 044, docs/RELEASE.md). Runs on a version tag
# (`v0.1.0`, must match the version in Cargo.toml) or by hand (Actions >
# Release > Run workflow). Builds the GDExtension in the release profile on
# each system, exports the game for all three systems on macOS (one download
# of the export templates; signing needs a Mac), plays the exported game's
# self-test on each system and uploads three archives as workflow artifacts.
#
# It uploads nothing to Steam and creates no GitHub release; both stay manual
# (tools/steam/upload.sh). macOS signing and notarization only happen when
# the secrets of docs/RELEASE.md exist; otherwise the app is signed ad-hoc.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: "4.7.2"

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from Cargo.toml (and the tag)
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(bash tools/release/version.sh "$GITHUB_REF_NAME")
          else
            version=$(bash tools/release/version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  lib:
    name: GDExtension (${{ matrix.system }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            system: macos
          # The oldest available runner: the library needs the glibc it was
          # built against (2.35) or newer. See docs/RELEASE.md.
          - os: ubuntu-22.04
            system: linux
          - os: windows-latest
            system: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The simulation compiles data/maps/test_small (Git LFS) in.
          lfs: true

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Second macOS architecture (universal library)
        if: matrix.system == 'macos'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build and stage (target/export)
        env:
          REQUIRE_UNIVERSAL: "1"
        run: bash tools/release/build-lib.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.system }}
          path: target/export/
          if-no-files-found: error

  export:
    name: Export (all systems, on macOS)
    needs: [version, lib]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Libraries of all three systems
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: target/export
          merge-multiple: true

      - name: Cache Godot and its export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Install Godot and the export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-download
          cd ~/godot-download
          [[ -f editor.zip ]] || curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          [[ -f templates.tpz ]] || curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o editor.zip -d ~/godot
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -o templates.tpz -d ~/godot-templates
          cp -R ~/godot-templates/templates/. "$templates/"
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      # The editor loads the debug entry of the .gdextension; the release
      # library registers the same classes, so it serves the import.
      - name: Bridge for the editor
        run: |
          mkdir -p target/debug
          cp target/export/libbridge.dylib target/export/libsteam_api.dylib target/debug/

      - name: Import
        run: bash tools/godot-import.sh

      - name: Export macOS (signed and notarized when the secrets exist)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/release/export.sh macos

      - name: Export Windows
        run: bash tools/release/export.sh windows

      - name: Export Linux
        run: bash tools/release/export.sh linux

      - name: Smoke test (macOS, exported game headless)
        timeout-minutes: 20
        run: bash tools/release/smoke-test.sh macos

      - uses: actions/upload-artifact@v4
        with:
          name: MudAndSteel-${{ needs.version.outputs.version }}-macos
          path: build/release/MudAndSteel-*-macos.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MudAndSteel-${{ needs.version.outputs.version }}-windows
          path: build/release/MudAndSteel-*-windows.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MudAndSteel-${{ needs.version.outputs.version }}-linux
          path: build/release/MudAndSteel-*-linux.tar.gz
          compression-level: 0
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.system }})
    needs: [version, export]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: linux
          - os: windows-latest
            system: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Only for the scripts; the game comes from the export job.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: MudAndSteel-${{ needs.version.outputs.version }}-${{ matrix.system }}
          path: download

      - name: Unpack
        run: |
          mkdir -p game
          if [[ "${{ matrix.system }}" == linux ]]; then
            tar -xzf download/*.tar.gz -C game
          else
            python -m zipfile -e download/*.zip game
          fi
          ls -la game

      - name: Exported game headless (menu flow self-test)
        run: bash tools/release/smoke-test.sh ${{ matrix.system }} "$PWD/game"
