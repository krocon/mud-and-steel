[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
sim = { path = "crates/sim" }
net = { path = "crates/net" }
fixed = { version = "1.31", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
toml = "1.2"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
godot = { version = "=0.5.5", features = ["api-4-7"] }
rusty_enet = "0.4.1"
if-addrs = "0.15"

[profile.release]
debug = "line-tables-only"

# The simulation runs in debug builds too (tests, the Godot debug bridge);
# A* is too slow unoptimized. Overflow checks and debug assertions stay on.
[profile.dev.package.sim]
opt-level = 3

# The bridge computes the terrain rasters for the renderer (4 M samples on a
# 4 km map); unoptimized that takes seconds at every game start.
[profile.dev.package.bridge]
opt-level = 2
