; Export presets (prompt 044). Use them through tools/release/export.sh,
; which stages the release GDExtension, the license files and data/ and
; signs the macOS app afterwards; see docs/RELEASE.md. No secrets in here:
; signing identities and notarization credentials come from the environment
; (GitHub secrets) in tools/release/macos-sign.sh.
;
; Versions: the presets leave their version fields empty, so Godot uses
; application/config/version of project.godot, which a test keeps equal to
; the Cargo workspace version.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="licenses/*"
exclude_filter=""
export_path="../build/export/macos/Mud and Steel.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=1
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon=""
