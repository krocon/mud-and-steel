# Map sketch of `battery_heights` ("Batteriehöhen", prompt 131): a river
# valley between four wooded heights, built for two against two with a lot of
# artillery. A river runs north to south through the middle in a wide S-curve
# (bulging east in the north, west in the south) under three stone bridges;
# marsh in the inner bends (west bank in the north, east bank in the south);
# zigzag trench lines on both banks from the north to the south bridge, a
# switch line across the west valley south of the main road; on each side a
# big height (north-west / south-east, 65 m, rock bands towards the valley)
# and a smaller one (south-west / north-east, 47 m), conifer and mixed wood,
# eight prepared gun positions per team on the reverse slopes and in the
# valley; a camp with halls on the main road at the map edge, a smaller one
# on the smaller height, a hamlet at the north bridge and a village with a
# church, fields at the edges. An own design after the template picture
# docs/.vorlagen/batteriehoehen/ (not in the repository; its names are not
# used), not a copy of any other game's map.
#
# Point-symmetric (`mirror = "point"`, image (2 - x, 2 - y)): the west side is
# written by a small script and every element is followed by its image, so
# the drawing reads whole; only the north half counts. West (team 0, players
# 0 and 2) against east (team 1, players 1 and 3). The template is about
# 8 km wide; the map is 4 km and its distances follow the ranges of the game
# (indirect fire 1/8 of the real range, sight 250 m), see docs/MAPS.md
# ("battery_heights"). Lines and areas in meters (x east, y south, origin in
# the map center); generated with `just gen-sketch battery_heights`.
name = "battery_heights"
size_m = [4000, 4000]
biome = "forest"
weather = "clear"
