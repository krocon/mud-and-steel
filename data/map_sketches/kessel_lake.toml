# Map sketch of `kessel_lake` ("Kesselsee", prompt 128): an own design, not a
# copy of any other game's map. A rock ring (the "Kessel") in the middle with
# two passages north and south, a hamlet on the meadow inside, a ring track
# around it; a lake in the north-west and one in the south-east with beaches,
# an islet, a sandbank and fords over the shallows; mountains in the north-east
# and south-west corners; a street village north and one south, farmsteads,
# fields and small woods.
#
# Point-symmetric (`mirror = "point"`, about (1, 1)): only the north half
# counts (heights, terrain and objects of the south half are the image of the
# north half); lines and areas are written for both halves (image = (2 - x,
# 2 - y)) so the drawing reads whole. Lines and areas in meters (x east,
# y south, origin in the map center); generated with `just gen-sketch
# kessel_lake` (crates/cli/src/gen_sketch.rs, docs/MAPS.md). The design
# drawing (docs/.vorlagen/kesselsee/, not in the repository) is 2 km wide,
# 1 px = 3.57 m.
name = "kessel_lake"
size_m = [2000, 2000]
biome = "forest"
look = "rock"
weather = "clear"
seed = 128
mirror = "point"

