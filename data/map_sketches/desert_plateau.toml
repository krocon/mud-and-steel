# Map sketch of `desert_plateau` ("Wüstenplateau", prompt 133): a sand plain for
# two against two with nine plateaus (rock bands, flat tops, winding ramps, old
# forts and ruins), two dry wadis that split it into three strips (six stone
# bridges, two fords each, boulders on the rims stop vehicles elsewhere), oases
# with ponds, palms and mud-brick villages, mountains at the edges, four camps
# joined by a ring track. An own design after the template picture
# docs/.vorlagen/wuestenplateau/ (not in the repository; its labels are not
# used), not a copy of any other game's map.
#
# Point-symmetric (`mirror = "point"`, image (2 - x, 2 - y)): written by a small
# design script, every element followed by its image; only the north half
# counts. West (team 0, players 0 and 2) against east (team 1, players 1 and 3).
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch desert_plateau`.
