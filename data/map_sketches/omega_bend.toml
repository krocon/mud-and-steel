# Map sketch of `omega_bend` ("Omegaschleife", prompt 130): an own design
# accepted by the user, not a copy of any other game's map. A river crosses the
# north of the map from west to east and swings into an almost round loop (an
# omega) towards the north edge; the peninsula inside the loop holds a small
# village with a church, reached over a neck from the south and over two stone
# bridges from the north quarters. Two more stone bridges lead from the south
# over the straight reaches west and east. The south is wide meadow with
# hamlets, wood strips, small woods, a few fields, a pond in the middle and a
# small station at the south edge. Few houses, much meadow and wood, every
# way curved.
#
# Mirror-symmetric west against east (`mirror = "west"`, about x = 1 m): only
# the west half counts (heights, terrain and objects of the east half are its
# image); lines and areas are written for both halves (image = (2 - x, y)) so
# the drawing reads whole; objects on the axis turned along it (church,
# station) stand once. Lines and areas in meters (x east, y south, origin in
# the map center); generated with `just gen-sketch omega_bend`
# (crates/cli/src/gen_sketch.rs, docs/MAPS.md). The design drawing
# (docs/.vorlagen/omegaschleife/, not in the repository) is 2 km wide,
# 1 px = 3.57 m.
