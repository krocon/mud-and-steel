# Map sketch of `pit_hill` ("Grubenhügel", prompt 129): an own design the user
# accepted, not a copy of any other game's map. A terraced hill in the middle
# (foot, upland ring at 35 m, top at 60 m with a mining village and two pits),
# rock bands on half of each slope, two winding ramps for vehicles; a long side
# ridge west and east of it beyond a dip; a ring track around both; a stepped
# mountain range along the north and south edge; a lake bay with a peninsula
# and an islet in the north-west and south-east; a railway along the west and
# east edge with a station and a loading yard; hamlets at the mountain foot.
#
# Point-symmetric (`mirror = "point"`, about (1, 1)): only the north half
# counts; lines and areas are written for both halves (image = (2 - x, 2 - y))
# so the drawing reads whole. Lines and areas in meters (x east, y south,
# origin in the map center); generated with `just gen-sketch pit_hill`
# (crates/cli/src/gen_sketch.rs, docs/MAPS.md). The design drawing
# (docs/.vorlagen/grubenhuegel/, not in the repository) is 2 km wide,
# 1 px = 3.57 m; its colours are height bands. The numbers were computed by a
# small script (ellipses, winding ramps) and smoothed after the stage pictures.
name = "pit_hill"
size_m = [2000, 2000]
biome = "forest"
weather = "clear"
seed = 129
mirror = "point"

