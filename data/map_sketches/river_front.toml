# Map sketch of `river_front` ("Flussfront", prompt 123): an artillery duel
# over a broad river. The river runs west to east through the middle with
# three wooded islands (west, middle, east), rocky banks, rapids and two
# fords; ten long stone bridges (chains of `env_bridge_stone` `ArchHigh`):
# one at each end, a chain north-south over the middle island, one from
# each bank to the west and east island and one from each of these to the
# middle island. On each bank a town with a square, a town hall and a
# church on the straight main road, a ring road joining the bridgeheads,
# farmsteads, golden and green fields, woods; rock mountains in the four
# corners and hills behind the towns. Each side has four prepared gun
# positions (`battery_*`) on the reverse slopes of the hills, behind the
# hills from the river; observation hills on the banks with supply points;
# MG bunkers and trenches at the bridge ends, stone houses as bridge towers.
#
# North (team 0) against south (team 1), strictly mirror-symmetric:
# `mirror = "north"` generates the north half and copies it mirrored about
# the path cell center line y = 1 m onto the south half (ground, terrain,
# objects, bridges). Only the north half and what lies on the axis are
# drawn here; starts, supply points and markers are listed for both halves.
# Distances follow the range table in docs/MAPS.md ("river_front").
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch river_front` (crates/cli/src/gen_sketch.rs).
