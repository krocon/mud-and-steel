# Map sketch of `river_front` ("Flussfront", prompt 123): an artillery duel
# over a broad river. The river runs west to east through the middle: at
# both ends it forks into two arms around a head of land, in the middle it
# widens to 770 m and holds many wooded islands (a row of three on the
# axis, one before each bank on the main road, four smaller ones, rock
# islets). Forty-four stone bridges (chains of `env_bridge_stone`
# `ArchHigh`), none longer than 160 m: where the water is wider, a small
# island carries the road from one bridge to the next (`reach_m` keeps a
# bridge to its own channel). One over each arm at both ends and one over
# each west arm between the table mountains, the main road over the bank
# island and the center island (east of it a second bridge to the bank
# island), a chain from each bank to the west and east island, a chain
# from these to the center island, a chain from each bank to the heads,
# and the wooded islands joined to their neighbors; fords over the east
# arms and from the heads to the islands. On each
# bank a town with a square, a town hall and a church on the straight main
# road, a ring road joining the bridgeheads, farmsteads, golden and green
# fields, woods; a mountain range in each of the four corners that
# vehicles can drive (a track up to each summit, markers `peak_*`) and
# hills behind the towns. Each side has four prepared gun positions
# (`battery_*`) on the reverse slopes of the hills; observation hills on
# the banks with supply points; MG bunkers and trenches at the bridge
# ends, stone houses as bridge towers.
#
# North (team 0) against south (team 1), strictly mirror-symmetric:
# `mirror = "north"` generates the north half and copies it mirrored about
# the path cell center line y = 1 m onto the south half (ground, terrain,
# objects, bridges). Only the north half and what lies on the axis are
# drawn here; starts, supply points and markers are listed for both halves.
# Distances follow the range table in docs/MAPS.md ("river_front").
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch river_front` (crates/cli/src/gen_sketch.rs).
