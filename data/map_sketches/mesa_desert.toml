# Map sketch of `mesa_desert` ("Tafelberge", prompt 126): flat sandy basins
# from which table mountains rise with steep cliffs, steps and hollows on
# their plateaus; large ragged plateaus at the edges, a ring of small
# buttes and rock needles around an open centre. Height against width: the
# plateaus see far over the basins but are reached only over a few ramps;
# the basins hold room for tanks but little cover.
#
# Point-symmetric (`mirror = "point"`, about (1, 1)): only the north half
# is drawn (mesas, tracks, hollows), its image is the south half. Starts,
# supply points and markers are listed for both halves (image = (2 - x,
# 2 - y)). Lines and areas in meters (x east, y south, origin in the map
# center); generated with `just gen-sketch mesa_desert`
# (crates/cli/src/gen_sketch.rs, docs/MAPS.md).
