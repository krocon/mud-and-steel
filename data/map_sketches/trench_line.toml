# Map sketch of `trench_line` ("Grabenlinie", prompt 124; second layout): a
# deadlocked trench war in the mud. A brook runs diagonally through the
# map (north-west to south-east) and a road crosses it at a right angle
# through a ford in the middle. Around the ford lies a round, churned no
# man's land of shell craters, many with water, enclosed by a ring track
# that crosses the brook on two timber bridges. North and south of the
# ring a trench system faces it: a front line of large jags (redans), a
# second line jagged the other way (closed cells between the two), a
# support line, communication trenches, wire in front. West and east of
# the ring a low rise carries gun positions in sandbag pits, tents and
# dumps beside them: the east one on the north bank, the west one on the
# south bank. A shot-up house stands inside the ring on each bank.
#
# North-east (team 0) against south-west (team 1), point-symmetric about
# the map center like `city_large`: `mirror = "point"` generates the north
# half and copies it, turned by 180° about the path cell center point
# (1, 1), onto the south half (ground, terrain, objects, bridges, trenches,
# wire, craters, puddles). Only the north half is drawn here (the brook,
# the road and the ring run a little past the axis, the copy overwrites
# them; hills near the axis are listed with their images so that the
# ground meets), starts, supply points and markers are listed for both
# halves.
#
# Distances follow the range table in docs/MAPS.md ("trench_line"): the
# front lines lie 620 m apart across the ring (beyond the medium mortars,
# within the heavy ones), the gun rises 450 m from the middle on the flanks
# (light howitzers reach the enemy trenches and the enemy rise), the starts
# in the corners beyond every gun on the enemy rise.
#
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch trench_line` (crates/cli/src/gen_sketch.rs).
