# Map sketch of `trench_line` ("Grabenlinie", prompt 124): a deadlocked
# trench war in the mud. Two trench systems face each other across the map
# (fronts west to east), between them a churned no man's land of shell
# craters, many filled with water, wire in front of the trenches, a shot-up
# house in the middle; behind each front a support line, communication
# trenches, a lateral track, camps with dumps, and gun positions in
# sandbag pits. Two brooks with marshy banks run north to south along the
# flanks through shattered woods (the second way); remains of woods at the
# rear corners.
#
# North (team 0) against south (team 1), point-symmetric about the map
# center like `city_large`: `mirror = "point"` generates the north half
# and copies it, turned by 180° about the path cell center point (1, 1),
# onto the south half (ground, terrain, objects, bridges, trenches, wire,
# craters, puddles). Only the north half is drawn here (lines may run a
# little past the axis, the copy overwrites them), starts, supply points
# and markers are listed for both halves.
#
# Distances follow the range table in docs/MAPS.md ("trench_line"): the
# fronts lie about 290 m apart (medium mortars reach the enemy front from
# the own trench), the gun positions 640 m behind the own front (light
# howitzers reach no man's land and the enemy trenches, not the enemy gun
# positions), the starts behind the camps beyond the light howitzers of
# the enemy gun positions.
#
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch trench_line` (crates/cli/src/gen_sketch.rs).
name = "trench_line"
size_m = [2400, 2000]
biome = "forest"
look = "mud"
weather = "clear"
