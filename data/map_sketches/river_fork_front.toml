# Map sketch of `river_fork_front` ("Front an der Flussgabel", prompt 125):
# a front of trench systems across a fork of three rivers, deliberately
# NOT symmetric. The main river runs from the north-west to the south-east
# through the middle, a tributary comes from the north (north-east of the
# fork) and one from the south; they meet in the middle of no man's land.
# Two trench systems run across the map from west-south-west to
# east-north-east and cross the rivers; between them a no man's land of
# shell craters.
#
# North (team 0, the defender of the heights): wavy hills with woods in
# the north-east, the front trenches on their forward slope, gun positions
# on the reverse slope at the edge of the wood, villages and farms behind
# the front, a wood in the north-west; few tracks, only two bridges behind
# its own lines (and two in its trenches), supply points far apart in three
# sectors between the rivers.
# South (team 1, the attacker of the plain): flat, villages with fields up
# to the front, a gun position in a village, roads in every direction,
# four bridges and two fords behind its own lines (and two in its
# trenches), supply points nearer to its starts.
# Balance comes from these levers (bridges, fords, supply points, the
# position of the trenches, the height of the hills), not from mirroring;
# see docs/MAPS.md ("river_fork_front") and docs/AI.md.
#
# Distances follow the range table in docs/MAPS.md: the front lines lie
# 280 m apart (medium mortars reach the enemy front from the own trench),
# light howitzers reach the enemy front from the gun positions but not the
# enemy gun positions, the starts lie beyond every gun of the enemy
# positions.
#
# The template (a drawn situation map, not in the repository) is only
# used for its landscape; none of its names are used.
#
# Lines and areas in meters (x east, y south, origin in the map center);
# generated with `just gen-sketch river_fork_front`
# (crates/cli/src/gen_sketch.rs).
#
# Front base lines (used throughout): north front y = -0.06 x - 140, north
# support line y = -0.06 x - 260, south front y = -0.06 x + 140, south
# support line y = -0.06 x + 260; no man's land around y = -0.06 x.
name = "river_fork_front"
size_m = [3600, 2000]
biome = "forest"
