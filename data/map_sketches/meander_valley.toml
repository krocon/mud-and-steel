# Map sketch of `meander_valley` ("Mäandertal", prompt 132): a river winds in
# tight loops from the north-east to the south-west corner through a green
# valley with villages and fields; mesas with rock walls and grass tops stand
# on both sides, gun rings and bunkers on their tops, winding ramps up every
# mesa and down another side; seven stone bridges, two fords. An own design
# after the template picture docs/.vorlagen/maeandertal/ (not in the
# repository), not a copy of any other game's map.
#
# Point-symmetric (`mirror = "point"`, image (2 - x, 2 - y)): written by a small
# design script, every element followed by its image; only the north half
# counts. North-west (team 0, players 0 and 2) against south-east (team 1,
# players 1 and 3). Lines and areas in meters (x east, y south, origin in the
# map center); generated with `just gen-sketch meander_valley`.
