# Economy: resources, buildings, production (prompt 023). Integers only.
# Compiled into the simulation (`sim::economy::EconomyRules::builtin`, loaded
# by `Sim::new` and part of the state hash); the design and the reasons are in
# docs/GAME_DESIGN.md. All values here are PROVISIONAL game rules (not
# historical data, so they need no source), to be confirmed by the user.
#
# Resources are always listed as [fuel, ammunition, manpower].
# Times are game seconds (the time factor of data/scale.toml does not apply:
# these are not real durations).

[account]
# Every player starts with this much. Prompt 045: 600/600/400 before; the
# barracks, depot and vehicle works cost 450 manpower, so the first vehicle
# always waited for manpower while fuel was left over (docs/BALANCE.md).
start = [500, 600, 500]

[construction]
# At most this many construction sites per player at a time.
max_sites = 2
# A site starts with this share of its hit points and gains the rest
# linearly until it is completed.
start_hp_pct = 10
# Largest height difference over the footprint, in percent of its larger side.
max_grade_pct = 12
# Units must keep this distance (m) from the footprint of a new building.
clearance_m = 2

[production]
# Orders per producing building.
max_queue = 5
# Living units (without buildings) per player; production waits above it.
max_units = 80
# Default rally point: this far (m) in front of the building.
rally_m = 20

[supply]
# Map markers whose name starts with this are supply points.
marker_prefix = "supply"
# Units (not buildings) within this radius (m) take a point.
radius_m = 25
# Seconds of uncontested presence to neutralize an enemy point, and again
# to capture a neutral one.
capture_s = 20
# Income of a held point per minute (prompt 045: 60/60/30 before; more
# ammunition and manpower, less fuel, see docs/BALANCE.md).
income_per_min = [50, 90, 40]

# Unit prices from catalog values (docs/GAME_DESIGN.md "Unit costs"):
#   manpower = manpower_per_soldier * (squad size, else crew)
#   fuel     = fuel_per_tonne * combat mass in tonnes (vehicles only)
#   ammo     = ammo_base + sum over the weapons the simulation uses of
#              caliber_mm^2 * count / ammo_caliber_div
#              * range factor (direct fire, see range_ref_m below)
#   time_s   = time_base_s + (fuel + ammo + manpower) / time_per_point_div
[unit_cost]
manpower_per_soldier = 6
fuel_per_tonne = 4
ammo_base = 10
ammo_caliber_div = 60
time_base_s = 8
time_per_point_div = 8
# Prompt 045 [provisional]: the ammunition term of every direct-fire weapon
# is scaled by its game range (catalog range x 1/4) relative to range_ref_m,
# clamped to range_min_pct..range_max_pct percent; indirect weapons keep
# 100 %. Without it a T-34 (250 m, 5 rounds/min) cost more than a Panzer IV
# (375 m, 10 rounds/min) and lost 2:1 to it at the same price; the
# Panzerschreck squad (37 m) cost ten times the Soviet AT squad
# (docs/BALANCE.md). 0 switches the factor off.
# Prompt 067: game ranges are typical combat distances now (catalog
# range_typical_m x 1/4); the reference follows the 57-76 mm tank and
# anti-tank guns (700 m real, 175 m in the game; 250 m before).
range_ref_m = 175
range_min_pct = 50
range_max_pct = 150
# Decision 4 of prompt 045 (confirmed by the user 2026-11-16):
# the same term is also scaled by the weapon's catalog rate of fire
# relative to rate_ref_rpm, clamped to rate_min_pct..rate_max_pct percent.
# A gun that fires twice as fast deals about twice the damage in the same
# time (reload_ticks in crates/sim/src/combat.rs follows the catalog rate);
# without it a T-34 (F-34, 5 rounds/min) cost almost as much as a Panzer IV
# or an M4A3 (10 rounds/min) and lost to both at the same price
# (docs/BALANCE.md). The reference is the rate of the common 75 mm tank
# guns, so those keep their price; machine guns and rifles hit the upper
# bound (their caliber term is small). The lower bound is 75 %, not 50 %:
# aiming and hit chance, not only the reload, decide a tank fight, and with
# 75 % ten T-34 cost what eight Panzer IV cost (the measured equal
# strength of battle mode) while the Tiger (6 rounds/min) keeps a higher
# ammunition price than the Panzer IV. Indirect weapons keep 100 %.
# 0 switches the factor off.
rate_ref_rpm = 10
rate_min_pct = 75
rate_max_pct = 150
# Prompt 067 (kept by decision of 2026-11-16, docs/BALANCE.md): the same
# term is also scaled by the cube of the weapon's muzzle velocity relative to velocity_ref_mps, clamped to
# velocity_min_pct..velocity_max_pct percent. Caliber squared times
# velocity cubed is the square of the muzzle penetration of the combat
# rules (caliber x velocity^1.5, data/combat.toml). Before prompt 067 the
# range factor did this job by accident: the catalog's maximum ranges were
# longer for the high-velocity guns (KwK 40 1500 m, F-34 and M3 1000 m).
# With typical combat distances every 75 mm class gun reaches 175 m, and
# without this factor a Panzer IV (KwK 40, 750 m/s) would cost what a T-34
# (662 m/s) or an M4A3 (619 m/s) costs although it still beats both from
# the front at every distance (docs/BALANCE.md). The reference is between
# the medium-velocity 75 mm guns and the high-velocity ones; the lower
# bound of 100 % keeps low-velocity weapons (shaped charges, howitzers)
# from getting cheaper. Indirect weapons keep 100 %. 0 switches it off.
velocity_ref_mps = 650
velocity_min_pct = 100
velocity_max_pct = 150

[defeat]
# Decision 6 of prompt 045 (confirmed by the user 2026-11-16):
# a player who has had a completed building of base_buildings (in a base
# match: the headquarters from the start) is defeated at the end of the
# tick in which none of them is left completed and alive, even with units
# still on the field. Construction sites do not count. Without it, base
# matches on large maps never ended: both AIs rebuilt their armies at the
# unit limit (docs/BALANCE.md). Players without such a building from the
# start (battle mode) are not affected, mission sides that cannot be
# eliminated (prompt 039) neither. false switches the rule off.
without_base = true
# The headquarters and every building that produces units.
base_buildings = ["base_hq", "base_barracks", "base_factory"]

# Base buildings. Sizes in millimeters match the borrowed models (see
# docs/GAME_DESIGN.md); armor is the same on every face.
#   build_radius_m  own completed buildings allow new ones within this radius
#   income_per_min  paid while the building is completed
#   max_count       per player (0 = no limit), sites included
#   requires        completed own buildings needed to place it
#   produces        name of a production list below (empty = nothing)
[[building]]
id = "base_hq"
name = "Headquarters"
length_mm = 10000
width_mm = 8000
height_mm = 9000
hp = 6000
armor_mm = 40
cost = [200, 0, 300]
build_s = 60
build_radius_m = 120
# Prompt 045: 40/70/80 before. Ammunition was the bottleneck of every AI
# economy and fuel piled up unused (docs/BALANCE.md).
income_per_min = [40, 100, 90]
max_count = 0
requires = []
produces = ""

[[building]]
id = "base_barracks"
name = "Barracks"
length_mm = 12000
width_mm = 8000
height_mm = 7500
hp = 3000
armor_mm = 25
cost = [0, 0, 150]
build_s = 25
build_radius_m = 60
income_per_min = [0, 0, 0]
max_count = 0
requires = ["base_hq"]
produces = "infantry"

[[building]]
id = "base_depot"
name = "Supply depot"
length_mm = 14000
width_mm = 9000
height_mm = 8000
hp = 2500
armor_mm = 25
cost = [50, 0, 100]
build_s = 25
build_radius_m = 60
# Prompt 045: 40/50/30 before (see the headquarters).
income_per_min = [30, 70, 40]
max_count = 3
requires = ["base_hq"]
produces = ""

[[building]]
id = "base_factory"
name = "Vehicle works"
length_mm = 20000
width_mm = 10000
height_mm = 9000
hp = 4000
armor_mm = 30
cost = [150, 50, 200]
build_s = 45
build_radius_m = 60
income_per_min = [0, 0, 0]
max_count = 0
requires = ["base_hq", "base_depot"]
produces = "vehicles"

# Rocket battery position (prompt 054): fires the heavy strike of
# data/strike.toml late in the match; the enemy can destroy it during the
# warning time. One per player. Borrowed model: the ammunition dump of
# prompt 041 with launch frames (presentation). [provisional]
[[building]]
id = "base_rocket_battery"
name = "Rocket battery position"
length_mm = 6000
width_mm = 4000
height_mm = 2000
hp = 1500
armor_mm = 10
cost = [100, 150, 100]
build_s = 50
build_radius_m = 0
income_per_min = [0, 0, 0]
max_count = 1
requires = ["base_factory"]
produces = ""

# Fortifications from the catalog: placed like buildings, fight with their
# catalog weapons, cannot move, extend no build radius.
#   hp / armor_mm   0 = from the combat rules / the catalog
#   cost / build_s  omitted = from the unit cost formula
[[fortification]]
ids = ["de_bunker_tobruk", "su_bunker_dzot", "us_bunker_mg"]
hp = 2500
armor_mm = 60
cost = [0, 80, 60]
build_s = 20
requires = ["base_barracks"]

# Anti-aircraft guns (prompt 033): they fire at aircraft (data/air.toml) and,
# with their catalog weapon, at ground targets. Light flak needs the
# barracks, heavy flak the vehicle works. [provisional]
[[fortification]]
ids = ["de_flak38", "su_61k", "us_bofors_m1"]
hp = 0
armor_mm = 0
requires = ["base_barracks"]

[[fortification]]
ids = ["de_flak36", "su_52k", "us_90mm_m2"]
hp = 0
armor_mm = 0
requires = ["base_factory"]

# What producing buildings make, per faction (catalog ids). Mortar teams and
# self-propelled guns fire indirectly (prompt 032). Trucks, AT guns and
# howitzers come last (prompt 034): the guns are towed by trucks and
# halftracks; they replace the AT gun position of prompt 023 (a towed gun
# that could not move).
[produce.infantry]
