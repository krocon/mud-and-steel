# Combat rules (prompt 017). Integers only. Compiled into the simulation
# (`sim::CombatRules::builtin`), part of every SimConfig and of the state hash;
# see docs/ARCHITECTURE.md "Combat".
#
# These are game rules, not historical catalog values: unit values (armor,
# caliber, rate of fire, muzzle velocity, range, dimensions) come from the
# catalog and are converted by data/scale.toml. Balancing happens here.

[aim]
# Turret traverse in degrees per real second (the time factor applies). The
# catalog has no traverse speeds, so this is a rule per category.
turret_deg_per_s = 20
# Casemate vehicles (catalog `gun_traverse_deg`) turn the whole hull towards a
# target outside the gun's traverse when they stand still.
hull_deg_per_s = 30
# Infantry turns instantly. Per-category overrides of turret_deg_per_s:
[[aim.category]]
category = "tank_light"
turret_deg_per_s = 30

[[aim.category]]
category = "tank_heavy"
turret_deg_per_s = 15

[[aim.category]]
category = "recon_vehicle"
turret_deg_per_s = 30

[[aim.category]]
category = "halftrack"
turret_deg_per_s = 60

[fire]
# Automatic targets are chosen again every this many ticks.
retarget_ticks = 10
# Weapons whose catalog rate (cyclic for automatic weapons) is at least this
# fire bursts with a sustained rate of `automatic_sustained_pct` of it.
automatic_rpm = 200
automatic_sustained_pct = 25
# Units ordered to attack drive until the target is within this share of
# their longest weapon range.
attack_range_pct = 90
# Muzzle height over the ground as a share of the unit height.
muzzle_height_pct = 75

[dispersion]
# Angular error of a shot per axis (side and height), in tenths of a
# milliradian at real distances; triangular distribution. Ranges are
# compressed, so the error in game angles is divided by the direct-fire range
# factor: a hit at 400 m game range is as likely as at 1600 m real range.
mrad_x10 = 20
# Firing while moving multiplies the error.
moving_pct = 300

[ballistics]
# Gravity in mm/s² of real time; game gravity is this × time factor².
gravity_mm_per_s2 = 9807
# Projectiles vanish after this share of their weapon's range.
max_flight_range_pct = 150

[penetration]
# Kinetic rounds: penetration (mm, 0° plate) = caliber × (v / reference)^1.5,
# minus `loss_pct_per_km` percent per km of real distance (game distance ÷
# direct-fire range factor). The reference velocity is fitted to published
# penetration of the 8.8 cm KwK 36 and the 7.5 cm KwK 40 at 100 m (about 160
# and 135 mm against a vertical plate).
reference_velocity_mps = 520
loss_pct_per_km = 20
# Rounds slower than this are shaped charges (bazooka, Panzerschreck):
# penetration = caliber × heat_pct / 100, independent of distance.
heat_below_velocity_mps = 300
heat_pct = 160
# Random variation of every penetration roll, ± percent.
spread_pct = 10
# Effective thickness = plate / (cos impact angle × cos plate slope); the
# cosine never drops below this (at most 4 × the plate).
min_cos_pct = 25
# Hits in the upper share of a vehicle's height strike the turret (or the
# casemate) if the catalog has turret armor.
turret_height_pct = 35

# Heavy vehicles run over enemy soldiers (prompt 093). A vehicle of at least
# `min_mass_kg` (catalog mass: tanks from the Pz I on, halftracks, trucks
# over 5 t; not jeeps, motorcycles, tankettes) that drives at least
# `min_speed_mm_per_s` (game speed; 1.5 m/s is walking pace in real terms,
# so a tank turning on the spot or creeping hurts nobody) kills every enemy
# soldier whose position lies under its hull (catalog length x width, turned
# to its driving direction). Never soldiers of its own side or of allies,
# never soldiers in buildings, dug positions (foxholes, trenches, dugouts,
# nests) or vehicles.
# Soldiers step aside: one who stands in the lane of the vehicle (its width
# plus `dodge_clear_mm` on both sides) and sees it within `notice_mm` ahead
# of its nose walks sideways out of the lane at `dodge_speed_mm_per_s` (4
# m/s game speed = 2 m/s real, a hurried step). He starts `reaction_ticks`
# late, counted as the way the vehicle covers in that time, so a slow tank
# (4 m/s) leaves him 2.5 s and catches nobody who can move, a fast one (10
# m/s and more) catches those near the middle of its lane. Soldiers lying
# prone, pinned down, knocked down or badly wounded do not step aside.
# Soldiers of the vehicle's own side always do.
# Game values: no source gives reaction times or distances. [provisional]
[overrun]
min_mass_kg = 5000
min_speed_mm_per_s = 1500
notice_mm = 12000
reaction_ticks = 8
dodge_speed_mm_per_s = 4000
dodge_clear_mm = 800

# Secondary machine guns of vehicles (prompt 093): weapons below
# `max_caliber_mm` after the main weapon. They pick their own targets among
# the enemy infantry in sight, whatever the main weapon aims at, and never
# turn the turret. The mount follows from the catalog name of the weapon:
#   "coaxial"            fires along the turret: only at infantry within
#                        `coax_half_deg` of the gun's direction
#   "bow", "hull", "ball mount"  within `bow_half_deg` of the hull's front
#   "AA", "roof", "ring mount", "pulpit", "pedestal", "remote"  all round
#   "coaxial, bow" (several guns in one entry) and names that say nothing
#   (MG 34, DT of most German and Soviet tanks: one coaxial and one bow
#   gun)                 the turret cone or the bow cone
# Most secondary machine guns have no range in the catalog; they get
# `range_real_m` as their typical combat distance, the catalog value of the
# same guns as infantry weapons (M1919A4, MG 34/42 and DT: range_typical_m
# = 400). A few entries also lack the muzzle velocity (DT of the T-34/76
# 1943 and IS-2, MG 37(t), MG 13, DShK); they fly at `velocity_real_mps`,
# the middle of the catalog's machine guns (MG 42 740, MG 34 755, DT 840,
# M1919A4 853, M2HB 887 m/s), so that no tank goes without its machine guns
# for a gap in the catalog. The cones are game values (a coaxial gun has no
# traverse of its own, a ball mount about 15-20 degrees to each side plus
# the driver's small corrections): [provisional]
[vehicle_mg]
max_caliber_mm = 20
range_real_m = 400
velocity_real_mps = 800
coax_half_deg = 10
bow_half_deg = 30

[damage]
# Hit points of every vehicle.
vehicle_hp = 1000
# A penetrating hit on a vehicle costs caliber_mm² × vehicle_pct_per_mm2 / 100
# points: 7.5 cm 562 (two hits), 8.8 cm 774, 3.7 cm 136, 7.92 mm 6.
vehicle_pct_per_mm2 = 10
# Infantry has soldier_hp per soldier (catalog squad_size); a hit costs
# caliber_mm × infantry_per_mm points: rifle 63, 7.5 cm HE 600.
soldier_hp = 100
infantry_per_mm = 8
# Height of an infantry squad's hit box in mm (the 1.80 m reference figure).
infantry_height_mm = 1800

[targeting]
# Prompt 188: automatic targets by a score instead of yes/no keys. Every
# candidate in the unit's own sight and range that one of its weapons can
# hurt (after the fire discipline of prompt 176) gets
#   effect  × the share of the target's hit points one hit of the unit's
#             best weapon takes, against the hull plate it faces from
#             here (percent; 0 when it does not penetrate that side)
# + threat  × the same share for the target's best weapon against this
#             unit (it can hurt me)
# + role    for a target of the unit's kind: anti-tank guns, tank
#             destroyers, assault guns and anti-tank squads prefer armored
#             targets; machine guns, rifles and other infantry prefer
#             infantry and unarmored targets; tanks prefer units that can
#             penetrate them
# + focus   for each other unit of the same player that fires at it (at
#             most `focus_max`): finish what others started
# + stick   for its current target (no jumping at every check)
# - distance per 10 game meters.
# The highest score wins; ties go to the nearer, then the lower id.
# [provisional]
effect = 40
threat = 60
role = 40
focus = 8
focus_max = 2
stick = 30
distance_per_10m = 4
# Indirect weapons (mortars, howitzers, rocket launchers) without an order
# fire only at spotted targets within `indirect_auto_range_pct` of their
# range (not at the very edge, where the spread is widest) and never at
# squads with fewer than `indirect_min_soldiers` living men (snipers,
# crews, the last men of a squad): no shells on a single scout far away.
# 0 = no limit (replays from before prompt 188). Before: the nearest
# spotted soft target anywhere in range, also a lone sniper.
indirect_auto_range_pct = 85
indirect_min_soldiers = 3
