# Infantry rules (prompt 022). Integers only. Compiled into the simulation
# (`sim::InfantryRules::builtin`), part of every SimConfig and of the state
# hash; see docs/INFANTRY.md "Behavior".
#
# These are game rules, not catalog values: squad sizes, weapons and speeds
# come from the catalog (data/catalog/*.toml) and data/scale.toml. Durations
# are real milliseconds; the infantry time factor (2) applies.

[formation]
# Soldiers of a squad stand in two staggered rows across the facing:
# `row_size` soldiers per row, `spacing_mm` apart sideways, rows
# `spacing_mm` apart, every second row shifted by half a spacing. The squad
# leader (first soldier) stands in the middle of the front row.
spacing_mm = 3000
row_size = 5
# A soldier catches up with his place at most this share of the squad speed.
catch_up_pct = 150

[stance]
# Changing the stance takes this long; the squad neither moves nor fires
# meanwhile.
change_ms = 1000
# Automatic stance: a squad that was hit, or saw a round land within
# `near_miss_mm` of one of its soldiers, counts as under fire for
# `suppressed_ms` and goes prone when it is not moving.
suppressed_ms = 5000
near_miss_mm = 3000

# Per stance: movement speed (share of the catalog speed; prone = crawling,
# real 0.35 m/s against 1.4 m/s walking), height of every soldier's hit box
# (the 1.80 m reference figure; kneeling and lying measured on the soldier
# model of prompt 005), and the angular error of the squad's own shots.
[stance.stand]
speed_pct = 100
height_mm = 1800
dispersion_pct = 100

[stance.kneel]
speed_pct = 60
height_mm = 1100
dispersion_pct = 75

[stance.prone]
# Prompt 231: 15 % of the faster 3.89 m/s infantry pace (~0.58 m/s crawl).
speed_pct = 15
height_mm = 450
dispersion_pct = 50

[soldier]
# Half the width of a soldier's hit box (a 0.6 m wide, 0.6 m deep box).
half_width_mm = 300

[knockdown]
# Prompt 048: the blast of a high-explosive charge (shells, bombs, exploding
# dumps; data/indirect.toml [blast]) throws the soldiers near it to the
# ground, whether the fragments hit them or not. Radius per mm of caliber
# (8 cm: 4.8 m, 10.5 cm: 6.3 m); kneeling soldiers are knocked down within
# `kneel_pct`, prone ones within `prone_pct` of it, soldiers at a cover spot
# (behind an object or in a crater) within `cover_pct` of that. A soldier is
# thrown up to `throw_mm` away from the blast (falling linearly to 0 at the
# radius) and lies there; after `down_ms` (dazed, getting up, picking up his
# weapon) he goes on. While down he neither moves nor fires and is hit like a
# prone soldier. Soldiers in buildings and aboard vehicles are not affected.
# [provisional]
radius_mm_per_mm = 60
kneel_pct = 75
prone_pct = 40
cover_pct = 50
throw_mm = 2500
# Prompt 194: big charges throw farther. The throw at the point of impact is
# `throw_mm_per_mm` per mm of caliber, never less than `throw_mm` (8 cm
# mortar and smaller stay at 2.5 m) and at most `throw_max_mm`: 10.5 cm
# 3.2 m, 15 cm 4.5 m, SC 250 bomb (158 mm equivalent, data/air.toml) 4.7 m,
# SC 500 5.9 m, 21 cm rocket 6.3 m, SC 1000 7.5 m, 38 cm Sturmtiger rocket
# 11.4 m. Linear in the caliber after Hopkinson-Cranz cube-root scaling
# (blast effects at a distance scale with the cube root of the charge mass,
# the charge of similar shells with the cube of the caliber; docs/SOURCES.md).
# The factor itself is judgement: no source gives how far a man is thrown.
# The throw falls linearly to 0 at the knock-down radius. The man flies on
# a 45-degree arc: flight time sqrt(2 d / g) real (5 m: 1 s), then lies for
# `down_ms`. He never lands on a blocked point (wall, house, water): the
# throw is cut short at the last passable point along its line.
# [provisional]
throw_mm_per_mm = 30
throw_max_mm = 12000
down_ms = 6000
# A destroyed vehicle armed with a gun of at least `ammo_min_caliber_mm_x10`
# blows up its ammunition with `ammo_explosion_pct` percent and knocks the
# soldiers within `ammo_radius_mm` down (same stance and cover factors),
# throwing them up to `ammo_throw_mm`.
# [provisional]
ammo_explosion_pct = 40
ammo_radius_mm = 12000
# Prompt 194: an exploding tank's ammunition (several dozen kg of explosive
# and propellant) throws like a large shell. [provisional]
ammo_throw_mm = 6000
ammo_min_caliber_mm_x10 = 200

[cover]
# A standing squad looks for cover spots behind objects within
# `search_mm` of each soldier's formation place. Spots lie `gap_mm` behind
# the object (seen along the squad's facing), every `spot_spacing_mm` along
# its length.
search_mm = 8000
spot_spacing_mm = 1500
gap_mm = 700
# Soft cover counts for a soldier whose spot is within `reach_mm` of the
# object, when the object lies between the shooter and the soldier.
reach_mm = 2000

# Objects that hide soldiers but do not stop projectiles in the simulation
# (they block no tanks, prompt 013): a hit on a soldier in their cover is
# absorbed with probability `pct` percent. Objects that block tanks (walls,
# hedges, houses, trees) stop projectiles up to their height by themselves
# and are cover spots without a roll.
[[cover.object]]
id = "fort_sandbag_position"
pct = 80

