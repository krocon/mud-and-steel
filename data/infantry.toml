[grenades]
# Prompt 232: infantry fragmentation and smoke hand grenades.
# Historical models per faction (docs/SOURCES.md): DE Stielhandgranate 24 /
# Nebelhandgranate 39, US Mk 2 / M18 Smoke, SU F-1 / RDG-1, UK Mills No. 36M /
# No. 77. Unified balanced rule values (durations real ms, distances game mm).
# [provisional]
