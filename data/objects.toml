# --- Bridges: a deck over water (prompt 014) --------------------------------------
# The deck spans the object's length; its height runs linearly between the
# ground heights at both ends of the axis (docs/MAPS.md, "Bridges"). Widths
# are the roadway of the models (extra deck_width_m). Load limits are game
# rules: a single-lane timber bridge carries trucks, half-tracks, armored
# cars and light tanks (up to 16 t), but no Panzer IV, T-34 or Sherman; the
# stone arch bridge carries everything in the catalog.

[[object]]
id = "env_bridge_wood"
variants = ["Span8", "Span12", "Span16"]
blocks = "none"
deck = { width_mm = 4100, max_load_kg = 16000, terrain = 2 }

[object.variant.Span8]
length_mm = 8000

[object.variant.Span16]
length_mm = 16000

