# Map objects: which placed objects block movement, and with which ground
# shape. Integers only. Compiled into the simulation (`sim::ObjectRules`);
# see docs/MAPS.md ("Objects").
#
# These are game rules, not historical values. Sizes of boxes default to the
# catalog length x width of the object (data/catalog/neutral.toml); the length
# runs along the model's +Y axis (Blender), i.e. along the heading.
#
# Every [[object]] entry:
#   id         catalog id (faction neutral)
#   variants   variant names a map may use (the model's variants,
#              assets-src/blueprints/neutral/<id>.toml; checked by a test)
#   blocks     which path size classes the object blocks:
#              "none", "small" (infantry), "large" (tanks, trucks) or "all"
#   radius_mm  circular ground shape (trunks, poles), or
#   length_mm / width_mm  box (defaults: catalog values when radius_mm is absent)
#   deck       bridges only (needs a box): the drivable roadway along the
#              length (prompt 014), a table with
#                width_mm     roadway width between the railings
#                max_load_kg  heaviest unit that may cross (catalog mass_kg)
#                terrain      terrain id of data/terrain.toml whose speed
#                             applies on the deck (2 = road)
#   [object.variant.<Name>]  per-variant overrides of blocks / radius_mm /
#              length_mm / width_mm
#
# A path cell (4 m) is blocked for a class when a blocking shape overlaps it.
# Rationale: woods, hedges and walls stop tanks but not infantry; buildings
# stop everybody; fences, bushes, hay and small props stop nobody (tanks push
# through). Destruction (prompt 020, data/destruction.toml) changes what an
# object blocks during a match: ruins (also placed `Ruin` variants, whose
# `blocks` here is overridden) block large units only, felled trees and
# destroyed walls nothing.

# --- Trees: the trunk blocks vehicles ------------------------------------------

[[object]]
id = "env_tree_deciduous"
variants = ["Oak", "Beech", "OakYoung", "Bare"]
blocks = "large"
radius_mm = 500

[[object]]
id = "env_tree_conifer"
variants = ["Spruce", "Pine", "SpruceYoung"]
blocks = "large"
radius_mm = 400

[[object]]
id = "env_tree_birch"
variants = ["Birch", "BirchYoung"]
blocks = "large"
radius_mm = 300

[[object]]
id = "env_tree_palm"
variants = ["Palm", "PalmShort", "PalmLeaning"]
blocks = "large"
radius_mm = 400

[[object]]
id = "env_tree_stump"
variants = ["Broken", "Sawn"]
blocks = "none"
radius_mm = 500

[[object]]
id = "env_log_fallen"
variants = ["Log"]
blocks = "none"

[[object]]
id = "env_bush"
variants = ["Hazel", "Round", "Wide"]
blocks = "none"
radius_mm = 1500

[[object]]
id = "env_rock"
variants = ["Medium", "Small", "Large"]
blocks = "none"
radius_mm = 700

[object.variant.Large]
blocks = "large"
radius_mm = 1500

