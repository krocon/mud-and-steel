# --- Grown rock (prompt 074) -----------------------------------------------------
# Boxes per variant from the model's size (assets-src/blueprints/neutral/
# env_rock_*.toml: catalog box x size). Slabs are only a picture (box = the
# model). Outcrops and ridge pieces stop everybody, their boxes are 0.4 m
# larger on every side than the model's foot (tank hulls touch the rock
# instead of cutting into it), and they are solid for sight
# (data/vision.toml) up to their variant height.

[[object]]
id = "env_rock_slab"
variants = ["Field", "Long", "Broken", "Small", "Wide", "Strip"]
