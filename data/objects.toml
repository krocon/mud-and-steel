# Long steel bridges (prompt 115): a main arch and approach spans that are
# chained end to end on one axis; their deck heights run over the whole
# chain (docs/MAPS.md, "Bridges"). Two lanes and footways (12 m between the
# railings, several path cells wide), 100 t: every vehicle of the catalog.
# The arch and the girders hide nothing (`see_through`); the railing covers
# prone soldiers like a low wall against rounds from the side (game value,
# [provisional]).
[[object]]
