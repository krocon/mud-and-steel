# Battle on `valley_fields`: every German and Soviet unit type three times,
# each type once in each of three battle groups (north, center, south), so
# every group mixes tanks, halftracks, infantry, MGs, engineers and
# anti-tank teams. The Soviets (computer, holding their ground) defend the
# east edge of the town: their tanks stand right behind the houses (west of
# them, covered from the attack), guns and infantry at the edge, the tank
# reserve behind houses deeper in the town, the artillery in its west.
# The Germans (player 0, you) attack from the fields and the village in the
# east, about 500 m away, in waves after an artillery preparation; the Soviets answer with
# their artillery and a tank counterattack. Aircraft, fortifications and the anti-aircraft guns (built
# positions in this game, data/economy.toml) are left out.
#
#   just battle valley_fields/all_units
#
# Not a menu mission (data/battles/, no tests play it): a show of fighting
# for performance and sound. Generated from the catalog; every unit stands
# on open ground. Format: docs/MISSIONS.md.
#
# Times (game seconds):
#     0  German artillery fires on the Soviet line, recon probes forward
#    12  wave 1 (early tanks, assault guns, halftracks, infantry) advances
#    25  Soviet artillery fires on the approach
#    50  German counter-battery fire on the Soviet artillery
#    60  wave 2 (Tiger, Panther, tank destroyers) advances
#   100  Soviet tank counterattack from the reserve
#    80+ further barrages of both sides every 40 s
#     5+ a German recon plane flies over the town every 60 s
#    15+ ten Sturmtiger shell the houses of the east edge, every 45 s the
#        next ones, deeper into the town

[mission]
title = "Battle: all units"
player = 0
elimination = false

[[computer]]
