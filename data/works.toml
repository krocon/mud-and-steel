# Field works of engineers (prompt 035): mines, wire, anti-tank obstacles,
# foxholes and trenches, clearing, demolishing and repairing bridges.
# Integers only. Compiled into the simulation (`sim::works::WorksRules::builtin`,
# loaded by `Sim::new` and part of the state hash); the design and the reasons
# are in docs/ARCHITECTURE.md "Field works" and prompts/done/035-*.md.
#
# Costs are [fuel, ammunition, manpower] like data/economy.toml; times are
# game seconds (no time factor, like the economy). All values here are
# PROVISIONAL game rules to be confirmed by the user, except where a comment
# names a real value.

[engineers]
# Unit categories (data/catalog/SCHEMA.md) that do engineer work.
categories = ["inf_engineer"]
# A squad works on a site when it is within this distance (mm) of it.
reach_mm = 6000
# Engineers detect hostile mines within this distance (mm) of the squad.
detect_mm = 10000
# Clearing takes everything (known mines, wire, obstacles) within this
# distance (mm) of the ordered point.
clear_radius_mm = 15000
# Most unfinished sites per player.
max_sites = 24
# Unfinished sites nobody works on or walks to for this long are given up
# (refunded if no work was done yet).
abandon_s = 30
# Longest line of one order (mm).
max_line_mm = 200000

[mines]
# Trigger mass: a vehicle (catalog mass) triggers an anti-tank mine from
# `at_trigger_kg`, everything from `ap_trigger_kg`; a soldier with his kit
# counts as `soldier_kg`. Real orders of magnitude: Tellermine about 90 to
# 180 kg, S-mine 3 to 7 kg (TM-E 30-451, ch. VIII).
at_trigger_kg = 150
ap_trigger_kg = 5
soldier_kg = 100
# A soldier within this distance (mm) of an anti-personnel mine sets it off.
ap_reach_mm = 500
# Anti-tank mine: vehicles with armor up to `open_armor_mm` of
# data/indirect.toml are destroyed, others lose `at_damage_pct` of their hit
# points and their track: they cannot move until the crew has fitted it
# again after `track_repair_s`.
at_damage_pct = 30
track_repair_s = 90
# Explosions: caliber (tenths of mm) used for the crater (anti-tank) and for
# the fragments and crater (anti-personnel, data/indirect.toml blast rules).
at_crater_caliber_mm_x10 = 1500
ap_caliber_mm_x10 = 600
# An explosion shows the victim's player the mines within this distance (mm).
reveal_mm = 15000
# Mines per section laid by players come from the catalog entry
# `<faction>_minefield_at|ap` (weapon counts, length and width); sections
# placed in the map editor (neutral) use these counts and `section_mm`.
map_at_count = 20
map_ap_count = 40
section_mm = 20000
# Mines lie on a staggered grid, shifted by up to this much (mm).
jitter_mm = 1500

[dig]
# Foxholes and trenches lower the ground (prompt 021 height field) by
# `depth_mm` in `steps` steps and raise a parapet of `parapet_mm` beside
# them. On the 2 m height raster a sample may lie at most 600 mm below a
# neighbor before the path cell counts as too steep for infantry (60 %
# grade, data/terrain.toml), so the hole stays shallow here; prompt 052
# cuts real trenches.
depth_mm = 500
parapet_mm = 100
steps = 4
# Cover of a soldier of a standing squad on a dug sample (instead of the
# crater cover of data/craters.toml), per stance.
stand_pct = 60
kneel_pct = 75
prone_pct = 85

[bridge]
demolish_s = 30
demolish_cost = [0, 40, 0]
# Caliber (tenths of mm) of the demolition charge's blast.
demolish_caliber_mm_x10 = 2000
repair_s = 90
repair_cost = [40, 0, 80]

[crush]
# Vehicles of at least this mass (kg) flatten wire they drive over (like
# fort_barbed_wire in data/destruction.toml).
wire_kg = 5000

# Per kind: cost and build time of one piece (a mine section, a wire piece,
# a hedgehog, a foxhole, a trench piece), time to clear one item (a mine, a
# wire piece, a hedgehog; 0 = cannot be cleared), and the length of a piece
# along an ordered line (mm; 0 = one piece per point or section).
[work.mines_at]
cost = [0, 60, 0]
build_s = 40
clear_s = 3
piece_mm = 0

[work.mines_ap]
cost = [0, 40, 0]
build_s = 30
clear_s = 3
piece_mm = 0

[work.wire]
cost = [0, 0, 6]
build_s = 6
clear_s = 5
piece_mm = 4000

[work.hedgehogs]
cost = [0, 0, 10]
build_s = 10
clear_s = 8
piece_mm = 3000

[work.foxhole]
cost = [0, 0, 0]
build_s = 15
clear_s = 0
piece_mm = 0

[work.trench]
cost = [0, 0, 0]
build_s = 20
clear_s = 0
piece_mm = 4000

# --- Prompt 052: positions tier 2 ---------------------------------------------
# Zigzag trenches, firing positions, MG nests, dugouts, vehicle pits,
# camouflage nets, bunkers at trench edges, concrete teeth and map
# strongpoints (docs/ARCHITECTURE.md "Positions",
# prompts/done/052-*.md). All values are PROVISIONAL game rules. These
# rules and their state enter the state hash once a match uses them.
[positions]
# Fire trenches zigzag: every second corner lies this far (mm) beside the
# ordered line (the corners are the firing bays).
zigzag_mm = 1500
# Firing positions along finished trenches every `spot_spacing_mm`,
# `wall_mm` towards the squad's facing (the front wall); corners first.
spot_spacing_mm = 2000
wall_mm = 300
# The parapet of a dug position stops direct fire only from shooters
# farther away than `close_mm` and rounds that fall flatter than
# `steep_pct` (rise per 100 of run; 58 = 30 degrees).
close_mm = 25000
steep_pct = 58
# MG nests, dugouts and bunkers only within `edge_mm` of a finished
# trench of the own team.
edge_mm = 8000
# Cover of a soldier on a sample of an MG nest / a dugout per stance
# (stand, kneel, prone), instead of the trench values of [dig].
nest_pct = [85, 90, 95]
dugout_pct = [95, 95, 95]
# Radius (mm) of the ground an MG nest, a dugout and a vehicle pit lower.
nest_radius_mm = 1500
dugout_radius_mm = 2000
pit_radius_mm = 3000
# A vehicle of the team that stands `enter_s` game seconds within
# `pit_reach_mm` of a finished vehicle pit is dug in: only the turret
# (the part above turret_height_pct of data/combat.toml) can be hit.
pit_reach_mm = 3000
enter_s = 8
# Camouflage nets: units of the owner's team within `net_radius_mm` that
# stand and have not fired for `fire_reveal_s` are seen by enemies only
# with a ground unit within `spot_mm` (never from the air).
net_radius_mm = 5000
spot_mm = 80000
fire_reveal_s = 20
# Bunkers engineers build: the base-building fortification of the faction
# (the first of these catalog ids with the faction's prefix).
bunkers = ["de_bunker_tobruk", "su_bunker_dzot", "us_bunker_mg"]
# Map markers named `<prefix><name>` become neutral strongpoints at the
# start: a zigzag trench ring of `ring_sides` sides at `ring_mm`, MG
# nests, communication trenches, dugouts and a wire ring at `wire_mm`.
strongpoint_prefix = "strongpoint_"
ring_mm = 16000
ring_sides = 8
wire_mm = 30000

[positions.work.comm_trench]
cost = [0, 0, 0]
build_s = 15
clear_s = 0
piece_mm = 4000

[positions.work.vehicle_pit]
cost = [0, 0, 0]
build_s = 60
clear_s = 0
piece_mm = 0

[positions.work.mg_nest]
cost = [0, 0, 10]
build_s = 25
clear_s = 0
piece_mm = 0

[positions.work.dugout]
cost = [0, 0, 20]
build_s = 60
clear_s = 0
piece_mm = 0

[positions.work.camo_net]
cost = [0, 0, 10]
build_s = 10
clear_s = 4
piece_mm = 0

[positions.work.bunker]
cost = [0, 80, 60]
build_s = 60
clear_s = 0
piece_mm = 0

# Concrete teeth (Hoecker): one every 1.5 m, not crushed, slow to remove.
[positions.work.teeth]
cost = [0, 0, 15]
build_s = 15
clear_s = 30
piece_mm = 1500
