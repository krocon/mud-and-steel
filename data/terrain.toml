# Terrain types and slope rules. Integers only. Compiled into the simulation
# (`sim::TerrainRules::builtin`); see docs/MAPS.md.
#
# These are game rules, not historical catalog values: they scale the speeds
# from the unit catalog. Balancing happens here.
#
# Every [[terrain]] entry:
#   id          value of the pixel in a map's terrain.png; ids are 0, 1, 2, ...
#               in file order
#   name        identifier used in docs and tools
#   speed       which catalog speed the unit uses here: "road" or "offroad"
#               (units without a road speed fall back to offroad)
#   speed_pct   percent of that speed (1..=200)
#   passable    false: units never enter it; paths go around it (prompt 012)
#   debug_color 0xRRGGBB for the debug terrain mesh and the PNG palette

[slope]
# Uphill, the speed drops by `uphill_penalty_pct` percent per 100 % grade
# (rise / run), but not below `min_speed_pct`. Downhill has no effect yet.
# Steeper than `max_grade_pct` (60 % = 31 degrees) cannot be climbed.
uphill_penalty_pct = 200
min_speed_pct = 20
max_grade_pct = 60

[[terrain]]
id = 0
name = "grass"
speed = "offroad"
speed_pct = 100
passable = true
debug_color = 0x5f7d3a

