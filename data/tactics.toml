# Infantry tactics (prompt 047): fire teams, bounds from cover to cover,
# suppression, blind fire, mortar teams and weapon jams. Integers only.
# Compiled into the simulation (`sim::TacticsRules::builtin`), loaded by
# `Sim::new` like the other rule files and part of the state hash; see
# docs/INFANTRY.md "Tactics (prompt 047)".
#
# These are game rules, not catalog values. Durations are real
# milliseconds (the infantry time factor 2 applies), distances game
# millimeters. Values marked [provisional] wait for playtests (prompt 045).

[fire_teams]
# Squads with at least this many living soldiers split into two fire
# teams: the first half of the roster (leader and the squad's automatic
# weapon: MG group, BAR team) is the base of fire, the rest the maneuver
# team. Smaller squads (MG, mortar, sniper teams) move as one team.
min_size = 6
# The squad position advances between `bound_min_mm` and `bound_max_mm`
# per bound (the first bound: `bound_min_mm`); the moving team runs to a
# line half a bound ahead of it, so the two teams end up about one bound
# apart (a rush of a few seconds). The advance is the sample (every
# `sample_mm`) where the moving team finds the most cover spots within
# `cover_radius_mm` (objects, craters, trench positions). [provisional]
bound_min_mm = 10000
bound_max_mm = 20000
sample_mm = 2500
cover_radius_mm = 6000
# After its bound the team settles (takes its cover spots, gets ready to
# fire) for `settle_ms`; then the other team moves. A team that has not
# arrived after `timeout_ms` counts as arrived. [provisional]
settle_ms = 2000
timeout_ms = 20000
# Squads in contact first halt and take cover (the base of fire, or all of
# a single team), then the maneuver team bounds. Squads of one team halt and
# return fire this long between bounds.
overwatch_ms = 4000
# Contact lasts this long after the squad last had a target (an enemy it
# sees and can hurt). On a plain move with fire at will, squads in contact
# bound instead of walking on; with hold fire they keep running. Coming
# under fire from an enemy they do not see only makes them crouch.
contact_ms = 8000
# Only targets within this share of the squad's longest weapon range count
# as contact; farther ones it engages while it closes in (returning fire at
# the edge of its range achieves little). [provisional]
contact_range_pct = 60
# On attack-move the next bound starts only when the squad has no target or
# its target squad is suppressed to at least this (fire superiority first);
# until then both teams fire from cover. On a plain move the teams bound
# regardless (the player wants the squad there). [provisional]
advance_at = 30

[suppression]
# Suppression is a value of 0..100 per squad. Every round of another player
# that lands within `stance.near_miss_mm` (data/infantry.toml) of one of
# its soldiers adds `near_miss` (rounds of `heavy_caliber_mm_x10` and more:
# `heavy_near_miss`), every hit on a soldier `hit`, every shell or bomb
# within its blast radius `blast`. [provisional]
near_miss = 8
heavy_near_miss = 20
heavy_caliber_mm_x10 = 200
hit = 10
blast = 35
# Squads lying down take this share: the rounds crack over them.
prone_pct = 50
# Recovery: `recover_per_s` points per real second once nothing added to
# it for `recover_delay_ms`.
recover_delay_ms = 3000
recover_per_s = 8
# From `pinned_at` the squad is pinned: it goes to ground (automatic stance
# prone), bounds pause, and only `pinned_fire_pct` of its soldiers fire,
# without aiming, over their cover (the dispersion of their suppression).
# It recovers below `unpinned_at`.
pinned_at = 60
unpinned_at = 30
pinned_fire_pct = 50
# Effect grows linearly with suppression: at 100 the squad's dispersion is
# `dispersion_pct` percent larger and its speed `speed_pct` percent lower
# (not when crawling: lying down is slow enough).
# Experience (prompt 050) multiplies its own factors on top.
dispersion_pct = 150
speed_pct = 50

[close]
# A squad in automatic stance whose target is closer than this (game
# meters) fights lying down.
prone_within_mm = 60000

[blind_fire]
# A squad whose target went out of sight (around a corner, behind cover)
# keeps firing at the point where it last saw it for `remember_ms`, with
# `fire_pct` of its soldiers and `dispersion_pct` of the normal dispersion:
# few hits, but it keeps the enemy's heads down.
remember_ms = 6000
fire_pct = 50
dispersion_pct = 300

[mortar]
# Mortar teams (squads with an indirect weapon) fire at will at every enemy
# their player has spotted in range, not only at what they see themselves;
# on attack-move they halt for such a target, set up and engage it.
# 0 = off, 1 = on.
spotted_targets = 1
halt_on_attack_move = 1

[jams]
# Rare weapon jams of small arms: every round a soldier fires jams his
# weapon with `per_100k` / 100 000; he clears it for `clear_ms` and does
# not fire meanwhile. Rolled from the simulation's generator. 0 = off.
# [provisional]
enabled = 1
per_100k = 1000
clear_ms = 5000

[flank]
# Prompt 110: vehicles and guns (not squads) that stand without a target
# remember where fire came from and turn there: turreted vehicles their
# turret, guns and casemate vehicles their carriage or hull (with the turn
# speeds of `[aim]` in data/combat.toml). They do not see the shooter
# because of it; they fire once the normal sight rules show him. Counts:
# hits on them and rounds of another player landing within `near_miss_mm`
# of their hull, from the direction the round flew in. 0 = off.
enabled = 1
# The direction is remembered this long after the last round from it.
remember_ms = 20000
# Rounds from another direction (more than `same_deg` off) take over only
# when they are more dangerous (a penetrating hit before a bounced one, a
# hit before a near miss, then the shorter flight) and the current
# direction is at least `switch_ms` old: no twitching back and forth.
switch_ms = 6000
same_deg = 30
# The crew starts turning `react_ms` after the first round. Every round of
# `suppression.heavy_caliber_mm_x10` and more that hits or lands near the
# vehicle keeps its crew down another `shaken_ms`, up to `shaken_max_ms`:
# a crew under heavy fire turns late. [provisional]
react_ms = 2000
shaken_ms = 3000
shaken_max_ms = 12000
near_miss_mm = 6000
# A facing the player ordered (formation move or securing with a facing)
# holds this long after the unit reached it; rounds meanwhile are
# remembered, and the unit turns when the hold ends if they still count.
# Any new order ends the hold; an attack order or an automatic target
# always wins, hold fire only stops the firing, not the turning.
ordered_hold_ms = 60000

[discipline]
# Prompt 176: fire discipline and unarmed vehicles under fire.
# "Return fire" (`FireMode::ReturnFire`): a unit fires automatically only
# at units that fired at it: hits on it and rounds landing within
# `return_near_mm` of it, remembered for `return_remember_ms` after the
# last round. "Close range only" (`SetFireLimits`): automatic targets only
# within `close_range_pct` percent of the unit's longest range (half: the
# ambush waits until the enemy is close). "Vehicles only": no automatic
# targets among infantry (also for the machine guns). Attack orders are
# never limited. [provisional]
return_near_mm = 10000
return_remember_ms = 30000
close_range_pct = 50
# Unarmed vehicles (trucks, tractors, cars without weapons) that stand
# without an order and are hit, or that rounds of another player miss by
# less than `flank.near_miss_mm`, drive `retreat_mm` away from where the
# fire came from (the way to it planned as usual), at most every
# `retreat_cooldown_ms`. 0 = off. [provisional]
unarmed_retreat = 1
retreat_mm = 80000
retreat_cooldown_ms = 15000

[march]
# Prompt 187: a group order (formation move with attack-move, `Secure`;
# not the plain move M) drives as one body. Every member drives at most as
# fast as the slowest member type would on the ground under it (road,
# field, mud). Members compare the length of the route still ahead of them
# (to their own slot): one ahead of the rearmost by more than `lead_mm`
# drives at `slow_pct` percent of that pace, by more than `far_mm` at
# `far_pct` percent, never slower than `min_speed_mm_per_s` (game time).
# Nobody stops to wait on the way: a member standing in a lane, on a deck
# or in a gap would block the others behind it. On and near bridge decks
# (25 m) everybody drives at its own speed, so the deck clears soon. In
# front of a bridge: a member within `gate_mm` of that zone, heading for
# the bridge, waits there while a unit on the deck drives towards it (one
# direction at a time), and while the member just ahead of it (by route
# still ahead) is less than `gap_mm` in front (0 = off: 8 m made the test
# crossing 40 % slower for 4 fewer stuck units in the whole stuck audit).
# A member behind the group's middle by more than `catch_up_mm` drives at
# its own full speed until it has caught up. Members in a fight (a target,
# or fired at lately) leave the pace. 0 = off. [provisional]
enabled = 1
lead_mm = 15000
slow_pct = 50
far_mm = 30000
far_pct = 25
catch_up_mm = 10000
min_speed_mm_per_s = 500
gate_mm = 20000
gap_mm = 0

[rush]
# Prompt 196: squads run in an assault and in the rush of a bound. An
# assault: the squad moves on attack-move or with an attack order towards
# its seen target, the target is within `assault_within_mm` (game meters,
# ahead along the route), not a squad still holding out (suppressed below
# `fire_teams.advance_at`), and the squad is not pinned. Then it stops
# bounding and the whole squad charges. The moving fire team of a bound
# (and a single team between its halts) runs as well, but only in contact
# or under fire (on attack-move the teams bound from the start; running
# all the way would spend the squad before it meets the enemy). Running
# soldiers
# stand upright, move at `speed_pct` percent of the squad's stance speed
# and do not fire. Only with the automatic stance or a fixed standing one.
# `speed_pct` (prompt 231): with `[speed] infantry = 7/2` (3.89 m/s off road),
# 155 % gives a ~6.0 m/s sprint in an assault or bound rush (was 300 % at the
# older 2.22 m/s pace).
# A squad runs `run_ms` real at most; then it is exhausted: it moves at
# `tired_speed_pct` and its dispersion grows to `tired_dispersion_pct`,
# and it does not run, until it has caught its breath down to
# `rested_pct` of the run. Standing still restores a full run in
# `rest_ms`, walking (and halting between bounds) at `walk_rest_pct` of
# that pace. 0 = off.
# [provisional: judgement, no source gives how long a loaded man sprints]
enabled = 1
speed_pct = 155
assault_within_mm = 30000
run_ms = 20000
rest_ms = 30000
walk_rest_pct = 25
rested_pct = 50
tired_speed_pct = 70
tired_dispersion_pct = 150

[drop]
# Prompt 196: soldiers throw themselves down under close fire, even below
# the pinning threshold: a high-explosive charge (shell, bomb, mine) within
# `blast_mm_per_mm` per mm of caliber (at most `blast_max_mm`: 8 cm 12 m,
# 10.5 cm 15.8 m, 15 cm 22.5 m), or a round of an automatic weapon
# (`fire.automatic_rpm` of data/combat.toml: machine guns, machine
# pistols) or of `suppression.heavy_caliber_mm_x10` and more that lands
# within `burst_mm` of the soldier. He lies `down_ms` real (prone hit box,
# does not move, fires lying), then goes on and does not throw himself
# down again for `again_ms` (the next rush; lasting fire pins the squad
# through its suppression instead). Only soldiers in the open:
# a soldier at a cover spot (behind an object, in a crater, trench or
# ruin) stays there and keeps the squad's stance, soldiers in buildings
# and aboard vehicles are not affected. Only with the automatic stance;
# never in an assault (else every attack would stay on the ground in its
# last stretch). A moving squad halts while at least `halt_pct` of its
# living soldiers are down (100: only when all are; at 50 the attacks of
# the AI tests stalled under machine-gun fire), the others go on and those
# down follow when they get up. 0 = off. [provisional: the radius follows the
# fragment danger zone of mortar rounds (docs/SOURCES.md), the rest is
# judgement]
enabled = 1
blast_mm_per_mm = 150
blast_max_mm = 40000
burst_mm = 3000
down_ms = 3000
again_ms = 4000
halt_pct = 100

[escort]
# Prompt 198: infantry advances behind the tanks of its group. A group
# order that drives as one body (formation move with attack-move, `Secure`;
# see `[march]`) in an open formation (line, wedge, broad wedge; not in a
# column or dispersed) with squads and tanks, tank destroyers or assault
# guns, while its player sees an enemy within `contact_mm` of the group or
# its target (game meters; on the march far from the enemy every unit
# keeps its own slot, which crosses bridges and narrow ground faster):
# the vehicles (and other vehicles of the group) take the formation, every
# squad a place behind one tank, `behind_mm` from its center along the
# facing of the order (one squad per tank, spread evenly; more squads
# follow `rank_mm` further back). On the way the soldiers of such a squad
# walk in two files `file_mm` apart, `row_mm` between the rows, centered
# on the tank's track (the hull stops small-arms fire from the front: the
# rounds hit the vehicle, sim/combat.rs; nothing stops splinters from
# above); with the automatic stance crouched (`kneel`) while the squad or
# its tank is in a fight (contact, a target, under fire), else upright at
# the marching pace. A squad first walks into its tank's track (behind
# the tank against the way). Near bridges (the queue zone and the gate in
# front of it, `[march]`) everybody goes by himself. Pace: a squad more
# than `ahead_mm` in front of its place behind the tank waits, the tank
# drives at `slow_pct` while its squad is more than `slow_mm` behind the
# place and waits beyond `wait_mm`, also in a fight (the tank holds or
# drives slowly, its infantry fires past it). The squad neither bounds nor
# halts to fight while it follows; in an assault (`[rush]`) it leaves
# the tank and charges. Farther than `leash_mm` from its tank, or the tank
# gone, the squad goes on by itself. 0 = off.
# [provisional: judgement from the practice of infantry following tanks
# in the attack (docs/SOURCES.md); distances not from a manual]
enabled = 1
behind_mm = 9000
rank_mm = 10000
file_mm = 1400
row_mm = 2000
ahead_mm = 3000
slow_mm = 3000
slow_pct = 50
wait_mm = 20000
leash_mm = 60000
kneel = 1
contact_mm = 300000
