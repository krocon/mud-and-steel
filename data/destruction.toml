[[class]]
ids = ["env_fence_wood"]
hp = 0
damaged_pct = 0
remains = "flat"
# Trucks, half-tracks and tanks; jeeps and motorcycles drive around.
crush_min_mass_kg = 2500

[[class]]
ids = ["fort_barbed_wire"]
hp = 0
damaged_pct = 0
remains = "flat"
# Tracked vehicles and heavy trucks flatten wire entanglements.
crush_min_mass_kg = 8000

