# Destruction of map objects (prompt 020). Integers only. Compiled into the
# simulation (`sim::DestructionRules::builtin`, loaded by `Sim::new` and part
# of the state hash); see docs/ARCHITECTURE.md "Destruction".
#
# These are game rules, not historical values: the catalog has no structural
# strength. They are chosen so that the guns of the catalog behave sensibly
# with the damage formula of data/combat.toml (caliber_mm² × 0.1: 3.7 cm 136,
# 7.5 cm 562, 8.8 cm 774):
#   - a 7.5 cm round fells a tree, three bring down a dry-stone wall segment;
#   - a farmhouse is damaged after three hits and a ruin after five;
#   - rifles and machine guns (below min_caliber_mm) never hurt objects.
#
# Every [[class]]:
#   ids          catalog ids (data/catalog/neutral.toml) of the class
#   hp           hit points of an intact object; 0 = cannot be shot to pieces
#                (only crushed)
#   damaged_pct  the object counts as damaged at or below this share of its
#                hit points (0 = no damaged stage)
#   remains      what is left when it is destroyed:
#                  "ruin"   a lower ruin (buildings): blocks `ruin_blocks`,
#                           stops projectiles up to `ruin_height_pct` of the
#                           catalog height; it does not block sight (rubble
#                           with gaps, and infantry inside must see out)
#                  "fallen" a felled tree: blocks nothing, no forest
#                  "gone"   nothing (walls, hedges): blocks nothing
#                  "flat"   flattened (fences, wire): blocks nothing
#   ruin_blocks  "none", "small", "large" or "all" (ruins only)
#   ruin_height_pct  share of the catalog height (ruins only)
#   crush_min_mass_kg  vehicles at least this heavy (catalog mass_kg) flatten
#                the object when their hull touches it (0 = never). If the
#                object blocks vehicles (data/objects.toml), those heavy
#                enough plan their way through it at the cost of [crush]
#   crush_variants  per model variant (data/objects.toml) a crush limit
#                instead of crush_min_mass_kg (0 = never): trees by trunk
#                thickness (prompt 106)
#   stand_radius_mm / stand_min_objects  dense stands are never crushed: an
#                object with at least stand_min_objects other objects of its
#                class within stand_radius_mm (as the map places them)
#   blast        true: also damaged by the blast of big explosions around
#                the impact point ([blast]), not only by direct hits
#   damaged_clear  true: a damaged object no longer counts for sight (a bare
#                tree is no forest)
#   damaged_height_pct  a damaged object stops projectiles only up to this
#                share of its catalog height (default 100)
#   damaged_variant / ruin_variant  model variants (assets-src/blueprints/
#                neutral/<id>.toml) a map places for an object that starts
#                damaged or destroyed; the presentation shows them
#
# Objects whose id is in no class (bunkers, hedgehogs, rocks, bridges,
# props) cannot be destroyed.

[damage]
# Rounds below this caliber do not damage objects.
min_caliber_mm = 20

# Blast of big explosions on the objects around the impact point (prompt 085;
# only classes with `blast = true`: trees so far). Explosions below
# `min_caliber_mm` (shells, rockets, bombs as data/air.toml converts them,
# exploding dumps) do nothing, so mortar and gun fire never adds up to a
# cleared wood. Above it, an explosion of caliber c deals `damage_per_mm` ×
# (c − `base_caliber_mm`) hit points at the impact point, falling linearly to
# 0 at `radius_mm_per_mm` × c (at most `max_radius_m`). With the trees below
# (400 hp, bare at 160 hp or less, i.e. after 240 damage):
#   8 cm mortar, 7.5 cm gun, tank guns: nothing (direct hits only)
#   10.5 cm howitzer: 330 at the point, strips trees within  5 m, fells none
#   12 cm mortar: 420, fells within 1 m, strips within 9 m
#   13.2 cm rocket (BM-13): 492, fells within 4 m, strips within 12 m
#   15 cm howitzer / rocket: 600, fells within 9 m, strips within 16 m
#   SC 250 bomb (158 mm): 648, fells within 11 m, strips within 18 m
# Blasts do not add up (direct hits do): a tree keeps at most what an intact
# one has left after the strongest blast, so a salvo into a wood leaves a lane
# of felled trees around the impacts among bare ones instead of clearing it.
# Game values: no source gives such radii for trees.
# [provisional]
[blast]
min_caliber_mm = 100
base_caliber_mm = 50
damage_per_mm = 6
radius_mm_per_mm = 180
max_radius_m = 30

# Breaking through walls (prompt 093) and trees (prompt 106). Objects that block vehicles and have a
# crush_min_mass_kg (mud and dry-stone walls) do not block vehicles of that
# mass: the path search lets them through at the cost of `detour_m` meters
# of driving per 4 m path cell with such an object, so a tank takes a gate
# or an open corner that is nearer than that and breaks through otherwise
# (a courtyard wall is one or two cells deep: 40-80 m). A vehicle that
# breaks an object with hit points (a wall, not a fence or wire) drives at
# `slow_pct` of its speed for `slow_ticks` ticks (20 Hz) per piece, at most
# `slow_max_ticks`. Game values: no source gives such numbers.
# [provisional]
[crush]
detour_m = 40
slow_pct = 50
slow_ticks = 20
slow_max_ticks = 60

# --- Trees: one 7.5 cm hit fells them; big blasts fell or strip them -------------

# Damaged = bare (prompt 085): stripped of leaves, needles or fronds. The bare
# crown does not count as forest for sight; projectiles are stopped by trunk
# and main branches (half the height); paths stay blocked as by a standing
# tree. A bare tree still falls to further hits.
#
# Heavy vehicles push trees over (prompt 106). The tree falls the way the
# vehicle drives and lies there like a shot-down one (remains "fallen":
# blocks nothing, no forest, no sight block). Limits by trunk thickness;
# the variants of data/objects.toml stand for these trunks at breast height
# (judgement values from the catalog heights, not in the catalog sources):
#   thin, up to about 20 cm: young birch (12 m), young spruce (14 m)
#     -> from 18 t: every medium and heavy tank and the heavier tracked
#        tank destroyers, assault guns and self-propelled guns (the lightest
#        medium tank of the catalog, Pz IV A, has 18.4 t);
#   thick, about 25-40 cm: young oak (12.5 m), mature birch (20 m), date
#     palms (fibrous trunk, the same thickness at every height)
#     -> from 40 t: heavy tanks (M26 41.9 t and up), Panther, Jagdpanther,
#        Jagdtiger, ISU-152 and the like;
#   very thick, 50 cm and more: mature oak, beech, spruce, pine and the bare
#     winter tree (catalog 25-35 m) -> never.
# No wheeled vehicle of the catalog reaches 18 t (the heaviest truck has
# 7.4 t, armored cars and halftracks at most 9.1 t), so trucks and wheels
# never fell trees. US Army doctrine: tanks push through small trees
# (FM 7-20 appendix D); closely spaced small trees can be pushed over, but
# the pile-up may stop the tank, and huge trees stand far enough apart to
# drive between them (FM 5-33 Terrain Analysis, 1990, vegetation); heavy
# stands of trees of 8 in (20 cm) and more spaced less than 20 ft (6 m)
# build up into an obstacle for tracked vehicles that push through them
# (US Army subcourse IN0201). Sources in docs/SOURCES.md. The masses are
# game values: no source names them.
#
# Dense stands stay closed: a tree with at least 6 other trees within 10 m
# stands in a wood, where a felled 12-20 m trunk lands on the next ones and
# piles up (the source's heavy stands under 6 m apart; 6 neighbors within
# 10 m are about 220 trees per hectare, 6.7 m apart on average). A straight
# row of trees counts at most 4 neighbors at 4 m apart, so single trees,
# tree rows (even closed ones down to 3.4 m), orchards (8-12 m) and loose
# groves stay crushable; the woods of the generated maps (6.5 m apart with
# scatter, about 7 neighbors) do not, apart from some trees at their
# edges. The stand counts as the map places it, also after trees fell.
# [provisional]
[[class]]
ids = ["env_tree_deciduous", "env_tree_conifer", "env_tree_birch", "env_tree_palm", "env_tree_stone_pine",
    "env_tree_cypress", "env_tree_olive"]
hp = 400
damaged_pct = 40
remains = "fallen"
blast = true
damaged_clear = true
damaged_height_pct = 50
crush_variants = { BirchYoung = 18000, SpruceYoung = 18000, OakYoung = 40000, Birch = 40000, Palm = 40000, PalmShort = 40000, PalmLeaning = 40000, StonePineYoung = 40000, CypressShort = 40000, OliveYoung = 18000 }
stand_radius_mm = 10000
stand_min_objects = 6

