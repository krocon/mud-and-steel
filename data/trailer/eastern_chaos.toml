# ================================================================================
# DETERMINISTIC BATTLE CHOREOGRAPHY
# ================================================================================

# t = 0 s: Ignite early wrecks & start German meadow track-loop maneuvers!
[[trigger]]
id = "t0_tracks_and_wrecks"
when = "time"
delay_s = 0
actions = [
    { do = "order", group = "de_jagdpanther", to = "jagd_mid", order = "move" },
    { do = "order", group = "de_flak", to = "flak_mid", order = "move" },
    { do = "order", group = "de_recon", to = "recon_mid", order = "move" },
    { do = "fire", group = "de_igniter_meadow", hold_fire = false },
    { do = "fire", group = "de_igniter_village", hold_fire = false },
    { do = "order", group = "su_m_van_1", to = "meadow_charge_l", order = "move" },
    { do = "order", group = "su_m_van_2", to = "meadow_charge_r", order = "move" },
]

# t = 4 s: Complete curving track-loop arcs into final German firing line
[[trigger]]
id = "t4_positions"
when = "time"
delay_s = 4
actions = [
    { do = "order", group = "de_jagdpanther", to = "jagd_pos", order = "move" },
    { do = "order", group = "de_flak", to = "flak_pos", order = "move" },
    { do = "order", group = "de_recon", to = "recon_pos", order = "move" },
]

# t = 8 s: Open fire on vanguard so corpses litter the birch zone before start_s
[[trigger]]
id = "t8_vanguard_slaughter"
when = "time"
delay_s = 8
actions = [
    { do = "fire", group = "de_jagdpanther", hold_fire = false },
    { do = "fire", group = "de_flak", hold_fire = false },
    { do = "fire", group = "de_recon", hold_fire = false },
    { do = "fire", group = "de_meadow_inf", hold_fire = false },
    { do = "fire", group = "de_vil_pz4", hold_fire = false },
    { do = "fire", group = "de_vil_stug", hold_fire = false },
    { do = "fire", group = "de_vil_marder", hold_fire = false },
    { do = "fire", group = "de_vil_mg", hold_fire = false },
    { do = "fire", group = "de_vil_inf_1", hold_fire = false },
    { do = "fire", group = "de_vil_inf_2", hold_fire = false },
]

# t = 14 s: Launch Soviet Wave 1 & village push + mortar barrages!
[[trigger]]
id = "t14_wave1_and_village"
when = "time"
delay_s = 14
actions = [
    { do = "fire", group = "de_igniter_meadow", hold_fire = true },
    { do = "fire", group = "de_igniter_village", hold_fire = true },
    { do = "fire", group = "su_vil_t34", hold_fire = false },
    { do = "fire", group = "su_vil_is2", hold_fire = false },
    { do = "fire", group = "su_vil_su85", hold_fire = false },
    { do = "fire", group = "su_vil_inf_1", hold_fire = false },
    { do = "fire", group = "su_vil_inf_2", hold_fire = false },
    { do = "order", group = "su_vil_t34", to = "t34_push", order = "advance" },
    { do = "order", group = "su_vil_is2", to = "is2_push", order = "advance" },
    { do = "order", group = "su_vil_inf_1", to = "village_core", order = "advance" },
    { do = "order", group = "su_vil_inf_2", to = "village_core", order = "advance" },
    { do = "order", group = "su_m_wave1_l", to = "meadow_charge_l", order = "move" },
    { do = "order", group = "su_m_wave1_c", to = "meadow_charge_c", order = "move" },
    { do = "order", group = "su_m_wave1_r", to = "meadow_charge_r", order = "move" },
    { do = "barrage", group = "su_mortars_village", at = "village_core", radius_m = 28, salvos = 10 },
    { do = "barrage", group = "de_mortars_meadow", at = "birch_killzone", radius_m = 20, salvos = 12 },
]

# t = 21 s: Launch Soviet Wave 2 & village reinforcements + second mortar wave
[[trigger]]
