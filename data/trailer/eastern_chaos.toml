# Trailer scene (prompt 242): "Ostfront-Dorfchaos" 9:16 Short on `eastern_village_chaos`.
#
# Deterministic Eastern Front mass-infantry & armor chaos across two adjacent
# zones of one continuous battle:
#   - Zone A (Village, x ~ -55..15, y ~ -45..40): Soviet T-34-85, IS-2, SU-85
#     and massed rifle squads storm shattered farmhouses while German Pz IV,
#     StuG III, Marder, Opel Blitz and MG/rifle teams fight back amid burning
#     wrecks, explosions and smoke.
#   - Zone B (Birch Meadow Flank, x ~ 55..125, y ~ -55..45): German Jagdpanther,
#     Flakpanzer 38(t), Sd.Kfz. 222, a standing German rifle squad and a late-
#     arriving Hummel hold a curving dirt cart road criss-crossed with heavy tank
#     tracks against relentless waves of Soviet infantry pouring past two birch
#     trees and blazing vehicle wrecks.
#
# All actions are regular deterministic simulation commands (docs/MISSIONS.md).
# [provisional]

[mission]
title = "Trailer: eastern chaos short"
player = 0
elimination = false

