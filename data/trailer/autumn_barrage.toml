# --- Deterministic Script ------------------------------------------------------

# t = 0 s: open fire on early wreck targets so tall black smoke columns already
# rise from the village edge and left wood flank before start_s.
[[trigger]]
id = "early_wrecks"
when = "time"
delay_s = 0
actions = [
  { do = "fire", group = "sherman_west_2", hold_fire = false },
  { do = "fire", group = "sherman_1", hold_fire = false },
  { do = "fire", group = "sherman_3", hold_fire = false },
]

# t = 1 s: first staggered M7 Priest barrage wave (long arching white puff trails).
[[trigger]]
id = "priests_wave_1"
when = "time"
delay_s = 1
actions = [
  { do = "barrage", group = "priest_left", at = "far_village_west", radius_m = 20, salvos = 24 },
  { do = "barrage", group = "priest_support_1", at = "village_west", radius_m = 16, salvos = 24 },
  { do = "barrage", group = "mortars_village_a", at = "village_west", radius_m = 16, salvos = 24 },
]

# t = 3 s: second foreground M7 Priest staggered by 2 s for overlapping arcs.
[[trigger]]
id = "priests_wave_2"
when = "time"
delay_s = 3
actions = [
  { do = "barrage", group = "priest_right", at = "far_village_mid", radius_m = 20, salvos = 24 },
  { do = "barrage", group = "mortars_village_b", at = "village_east", radius_m = 16, salvos = 24 },
]

# t = 5 s: third right-edge M7 Priest + second support Priest join in.
[[trigger]]
id = "priests_wave_3"
when = "time"
delay_s = 5
actions = [
  { do = "barrage", group = "priest_far_right", at = "far_village_east", radius_m = 20, salvos = 24 },
  { do = "barrage", group = "priest_support_2", at = "village_east", radius_m = 16, salvos = 24 },
]

# t = 11 s: Sherman platoon rolls steadily past the autumn woodland into the
# dark ploughed field while engaging the village defenders and hero Panzer IV.
[[trigger]]
id = "shermans_advance"
when = "time"
delay_s = 11
actions = [
  { do = "order", group = "sherman_1", to = "advance_1", order = "move" },
  { do = "order", group = "sherman_2", to = "advance_2", order = "move" },
  { do = "order", group = "sherman_3", to = "advance_3", order = "move" },
  { do = "order", group = "sherman_4", to = "advance_4", order = "move" },
  { do = "order", group = "sherman_west_1", to = "left_flank_go", order = "move" },
  { do = "fire", group = "sherman_2", hold_fire = false },
  { do = "fire", group = "sherman_4", hold_fire = false },
  { do = "fire", group = "sherman_west_1", hold_fire = false },
  { do = "order", group = "de_pz4_hero", to = "hero_tank_out", order = "advance" },
  { do = "fire", group = "de_pz4_hero", hold_fire = false },
  { do = "fire", group = "de_pz4_west", hold_fire = false },
]

# t = 19 s: a 6-man US recon squad sprints across the autumn meadow into the
# right-foreground brick stepped-gable cottage (48, 2, capacity 10);
# `trailer_shots.gd` issues the player-0 garrison command at 19.2 s so the
# soldiers visibly rush inside the house for cover during Cut 3.
[[trigger]]
id = "infantry_flee_spawn"
when = "time"
delay_s = 19
actions = [
  { do = "spawn", group = "us_inf_flee", owner = 0, unit = "us_inf_recon", count = 1, at = "infantry_yard", hold_fire = false },
]

# t = 25 s: pinpoint 105 mm demolition salvo (radius_m = 0) onto the center
# ochre stepped-gable manor house at (3, -82); lands at ~31.75 s so the building
# collapses storey-by-storey right in front of the final side-view cut.
[[trigger]]
id = "manor_collapse_salvo"
when = "time"
delay_s = 25
actions = [
  { do = "barrage", group = "manor_demolition", at = "target_manor", radius_m = 0, salvos = 1 },
]
