# Trailer scene (prompt 226): "Herbst-Artillerieangriff" on `autumn_village`.
#
# Two foreground US M7 Priest self-propelled howitzers (plus a third battery
# just offscreen right) fire staggered high-angle 105 mm salvos across the full
# frame with arching white smoke-puff bead trails into a Dutch/Flemish
# stepped-gable village while a US Sherman platoon advances past a colorful
# autumn forest toward the dark ploughed field and exchanges fire with German
# defenders amid burning smoke plumes and orange shell impacts.
#
# Choreography (all regular deterministic simulation commands, no cheats):
# - t = 0 s: foreground-right M7 Priests and offscreen-right Priest begin
#   staggered barrages onto the stepped-gable village; an early German vehicle
#   on the village edge and a left-flank skirmish vehicle are engaged so rich
#   two-stage black smoke columns are already rising before start_s.
# - t = 8..32 s: four US Shermans roll steadily forward from the meadow beside
#   the colorful autumn woodland toward the dark ploughed autumn field, firing
#   directly at the village defenders; left-flank Shermans fight near the wood
#   edge; M7 Priests keep firing staggered salvos throughout the full 10 s shot.
#
# Format: docs/MISSIONS.md. [provisional]

[mission]
title = "Trailer: autumn barrage"
player = 0
elimination = false

# --- Places ---------------------------------------------------------------------

[[spawn]]
name = "village_west"
position_m = [-26, -80]

[[spawn]]
name = "village_center"
position_m = [-10, -82]

[[spawn]]
name = "village_east"
position_m = [24, -78]

# Pinpoint collapse target: the tall ochre stepped-gable manor house at (3, -82)
[[spawn]]
name = "target_manor"
position_m = [3, -82]

# Forward firing point where the hero Panzer IV emerges from behind the village
[[spawn]]
name = "hero_tank_out"
position_m = [-6, -62]

# Yard southwest of the right-foreground brick stepped-gable cottage (48, 2)
# where US infantry sprint across the autumn meadow into cover inside the house.
[[spawn]]
name = "infantry_yard"
position_m = [38, 15]

# Beyond-village artillery aim points (~205 m from foreground M7 Priests, well
# above the 105 mm minimum indirect range) so both foreground Priests launch
# continuous high-arching white smoke-puff chains across the entire frame!
[[spawn]]
name = "far_village_west"
position_m = [-28, -158]

[[spawn]]
name = "far_village_mid"
position_m = [6, -162]

[[spawn]]
name = "far_village_east"
position_m = [40, -158]

[[spawn]]
name = "advance_1"
