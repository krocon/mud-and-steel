# Trailer tool (prompt 199): shells in the air to judge how they are drawn.
# On the open meadow of `ambush_meadow` three German medium mortars and a
# battery of four light field howitzers fire barrages at empty ground, and
# west of them two Panzer IV and two T-34 advance at each other (they meet
# at about 8 s, the duel is over at 11.5 s). Looked at by
# the `survey_shells_*` shots (`just shell-shots`).
# Format: docs/MISSIONS.md; played by godot/scenes/tools/trailer_shots.gd.

[mission]
title = "Trailer: shells"
player = 1
elimination = false

# --- Places ---------------------------------------------------------------------

[[spawn]]
name = "mortar_target"
position_m = [150, -30]

[[spawn]]
name = "howitzer_target"
position_m = [220, -250]

[[spawn]]
name = "duel_north"
position_m = [-51, -100]

[[spawn]]
name = "duel_south"
position_m = [-31, 50]

