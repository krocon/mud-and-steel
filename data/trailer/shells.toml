# --- Script ---------------------------------------------------------------------

[[trigger]]
id = "fire"
when = "time"
delay_s = 2
actions = [
  { do = "barrage", group = "mortars", at = "mortar_target", radius_m = 30, salvos = 40 },
  { do = "barrage", group = "howitzers", at = "howitzer_target", radius_m = 40, salvos = 20 },
  { do = "fire", group = "panzers" },
  { do = "fire", group = "t34s" },
  { do = "order", group = "panzers", to = "duel_south", order = "advance" },
  { do = "order", group = "t34s", to = "duel_north", order = "advance" },
]
