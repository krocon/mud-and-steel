# --- Script ---------------------------------------------------------------------

[[trigger]]
id = "start"
when = "time"
actions = [
  { do = "camouflage", group = "tigers" },
  { do = "order", group = "infantry", to = "infantry_goal", order = "move" },
]

[[trigger]]
id = "march"
when = "time"
delay_s = 34
actions = [
  { do = "order", group = "t34_lead", to = "halt", order = "move" },
  { do = "order", group = "t34_west", to = "halt", order = "move" },
  { do = "order", group = "t34_east", to = "halt", order = "move" },
  { do = "order", group = "t34_rear", to = "halt", order = "move" },
  { do = "order", group = "launchers", to = "launch", order = "move" },
]

# The first tank enters the kill zone: fire at will.
[[trigger]]
id = "contact"
after = ["march"]
when = "area"
area = "kill_zone"
unit = "su_t34"
actions = [
  { do = "fire", group = "tigers" },
  { do = "fire", group = "ambush" },
]

[[trigger]]
id = "react"
after = ["contact"]
when = "time"
delay_s = 1
actions = [
  { do = "fire", group = "t34_lead" },
  { do = "fire", group = "t34_west" },
  { do = "fire", group = "t34_east" },
  { do = "fire", group = "t34_rear" },
  { do = "fire", group = "infantry" },
  { do = "order", group = "t34_west", to = "spread_west", order = "move" },
  { do = "order", group = "t34_east", to = "spread_east", order = "move" },
  { do = "order", group = "t34_rear", to = "spread_rear", order = "move" },
  { do = "barrage", group = "launchers", at = "wood", radius_m = 35 },
  { do = "order", group = "infantry", to = "infantry_goal", order = "advance" },
]

[[trigger]]
id = "bombers"
after = ["contact"]
when = "time"
delay_s = 15
actions = [
  { do = "air", player = 1, mission = "bomb", at = "bombs_from", to = "bombs_to" },
]
