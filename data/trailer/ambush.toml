# Trailer scene (prompt 082): a Soviet column crosses the tall grass of
# `ambush_meadow` towards the wood in the north and runs into a German
# ambush: two camouflaged Tigers at the wood's edge, infantry and MG teams
# in the edge and in the wood along the west flank.
# Format: docs/MISSIONS.md; played by godot/scenes/tools/trailer_shots.gd.
#
# Everything is a normal command of the units' owner. Times (game seconds;
# the events are those of seed 14, the seed of the shots):
#    0    the Tigers put up their camouflage (30 s), the Soviet infantry
#         starts walking north beside the standing vehicles
#   34    the vehicles drive off (tanks 20 m/s, infantry 2.2 m/s: the column
#         stretches); the launchers halt 400 m from the wood and set up
#   50.0  the point tank is 100 m from the wood: the Germans open fire, it
#         blows up and loses its turret
#   51    the other tanks spread and fire back, the launchers get their
#         target, the infantry advances
#   56.5  the launchers fire (until 60.75); 57.75 a Tiger blows up; 60.0 and
#         64.75 two T-34 are destroyed
#   65    the Germans call their bombers along the column (17 s of flight)
#   69.25 the rockets land in the wood (until 74.25); 74.5 the last T-34
#   82.25 the bombs fall (until 86.0)
# Left at the end: one Tiger (42 %), the German infantry nearly whole, both
# launchers damaged, the Soviet infantry at 56 to 100 %.

[mission]
title = "Trailer: ambush"
player = 0
elimination = false

# --- Places ---------------------------------------------------------------------

[[area]]
name = "kill_zone"
center_m = [0, -100]
radius_m = 80

[[spawn]]
name = "halt"
position_m = [0, -60]

[[spawn]]
name = "launch"
position_m = [0, 300]

[[spawn]]
name = "infantry_goal"
position_m = [0, 150]

[[spawn]]
name = "spread_west"
position_m = [-70, -30]

[[spawn]]
name = "spread_east"
position_m = [70, -40]

[[spawn]]
name = "spread_rear"
position_m = [0, 25]

[[spawn]]
name = "wood"
position_m = [0, -126]

[[spawn]]
name = "bombs_from"
position_m = [0, 140]

[[spawn]]
name = "bombs_to"
position_m = [0, 340]

