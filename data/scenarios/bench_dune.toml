# Dune coast benchmark (prompt 114, after `bench_coastal.toml`): half
# the armies of `bench_large.toml` (63 tanks and 62 rifle squads per side,
# 1116 soldiers in all) on `dune_coast`, around the four starts at the
# south and north ends of the island (heath and fields in the south,
# marsh between the dunes and the tidal flats in the north); the Hard AIs
# fight through the dunes and the village. Used by
# `just bench --scenario data/scenarios/bench_dune.toml`
# (docs/PERFORMANCE.md). Integers only.
#
# The first group of every player moves to the map's start position (the
# trucks); the armies keep the positions below.

map = "dune_coast"

# Player 0: the south (starts at (-2100, 200) and (-2100, 600)).
