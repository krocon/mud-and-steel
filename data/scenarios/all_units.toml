# Test scenario: every German and Soviet unit type three times on the
# large map `river_valley` (3.6 x 2 km), the armies about 3.3 km apart
# (out of sight and range), to test performance and sound with many unit
# types. Aircraft and fortifications (bunker, minefields) are left out.
# Generated: one group per unit, each on open ground near the player's map start.
#
#   just run-scenario all_units.toml [--ai=passive]
#
# The first group of each player stands exactly on the map's start, so
# the layout is not shifted (docs/MAPS.md). Integers only.

map = "river_valley"

