# Harbor city benchmark (prompt 081): half the armies of `bench_large.toml`
# (63 tanks and 62 rifle squads per side, 1116 soldiers in all) on
# `harbor_city`, on the levelled ground around the four starts at the ends
# of the coastal strip (the town leaves no room for the full armies); the
# Hard AIs fight through the town. Used by
# `just bench --scenario data/scenarios/bench_harbor.toml`
# (docs/PERFORMANCE.md). Integers only.
#
# The first group of every player moves to the map's start position (the
# trucks); the armies keep the positions below.

map = "harbor_city"

# Player 0: the west end (starts at (-1470, 540) and (-1290, 800)).
[[group]]
owner = 0
unit = "de_opel_blitz"
count = 2
columns = 2
spacing_m = 15
center_m = [-1470, 540]

