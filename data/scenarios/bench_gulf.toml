# Landing gulf benchmark (prompt 121, after `bench_rhine.toml`): half the
# armies of `bench_large.toml` (63 tanks and 62 rifle squads per side,
# 1116 soldiers in all) on `landing_gulf`, around the four starts: the
# north holds the fields of the plain (starts at (-550, -1760) and
# (-1500, -1200)), the south the west edge of the village and the coast
# plain (starts at (-1420, 200) and (-2210, 280)). The Hard AIs fight over
# the plain. Used by `just bench --scenario data/scenarios/bench_gulf.toml`
# (docs/PERFORMANCE.md). Integers only.
#
# The first group of every player moves to the map's start position (the
# trucks); the armies keep the positions below.

map = "landing_gulf"

# Player 0: the north (the plain).
[[group]]
owner = 0
unit = "de_opel_blitz"
count = 2
columns = 2
spacing_m = 15
center_m = [-550, -1760]

[[group]]
