# Coastal heights benchmark (prompt 113, after `bench_brick.toml`): half
# the armies of `bench_large.toml` (63 tanks and 62 rifle squads per side,
# 1116 soldiers in all) on `coastal_heights`, around the four starts at
# the forts in the west and east (the starts lie in valleys between
# slopes; the full armies would stand on the hillsides); the Hard AIs
# fight over the ridges. Used by
# `just bench --scenario data/scenarios/bench_coastal.toml`
# (docs/PERFORMANCE.md). Integers only.
#
# The first group of every player moves to the map's start position (the
# trucks); the armies keep the positions below.

map = "coastal_heights"

