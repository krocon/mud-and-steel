# Demo scenario: two players with eight tanks and two rifle squads each,
# facing each other across the start meadow of the test map. Integers only.
# Prompt 097 halved the distances with the direct-fire factor (1/4 -> 1/8):
# the tanks start 60 m apart (before 120 m, the starts of test_small moved
# with them), inside the 87.5 m of their guns, as before inside 175 m.
# Used by the game, the CLI, the golden-hash test and the network tests.
#
# Every [[group]] places `count` units of the catalog id `unit` for player
# `owner` in a grid of `columns` columns, `spacing_m` apart, centered on
# `center_m` = [x, y] (x east, y south, meters). `role = "infantry"` makes
# the faction swap use `[faction_infantry]` instead of `[faction_units]`.

# Map the scenario is made for: data/maps/<map>/.
map = "test_small"

[[group]]
owner = 0
unit = "de_pz4_h"
count = 8
columns = 4
spacing_m = 12
center_m = [0, 30]

[[group]]
owner = 1
unit = "su_t34_76_1943"
count = 8
columns = 4
spacing_m = 12
center_m = [0, -30]

# Infantry behind the tanks (prompt 022). Appended after the tanks, so the
# tanks keep their unit ids.
[[group]]
owner = 0
unit = "de_inf_rifle_squad"
role = "infantry"
count = 2
columns = 2
spacing_m = 24
center_m = [0, 44]

[[group]]
owner = 1
unit = "su_inf_rifle_squad"
role = "infantry"
count = 2
columns = 2
spacing_m = 24
center_m = [0, -44]

# Unit that replaces a player's groups when they pick another faction in the
# skirmish setup (prompt 027). Keys are the faction ids of the catalog.
[faction_units]
de = "de_pz4_h"
su = "su_t34_76_1943"
us = "us_m4a3_75"
uk = "uk_cromwell"

[faction_infantry]
de = "de_inf_rifle_squad"
su = "su_inf_rifle_squad"
us = "us_inf_rifle_squad"
uk = "uk_inf_rifle_squad"

# Tank groups of a faction in percent of `count` when the player picks a
# faction (skirmish setup, LAN, tournaments; prompt 045 [provisional]):
# battle armies of equal strength instead of equal numbers. Under the game
# rules a Panzer IV outranges the T-34 and the M4A3 (375 m against 250 m,
# catalog effective ranges x 1/4) and fires twice as fast as the T-34;
# with 8 tanks each Germany won 71 % of all battles, the Soviet Union 25 %
# (docs/BALANCE.md). The plain demo without a faction choice (golden hash,
# tests) keeps its counts.
# Prompt 067: with typical combat distances all three tanks reach 175 m;
# the Panzer IV still penetrates more and fires twice as fast as the T-34,
# and measured again with these counts the factions win 49 / 48 / 46 % of
# the battles, so the counts stay.
[faction_count_pct]
su = 125
us = 112
# Prompt 117 [provisional]: the Cromwell IV has the 75 mm of the M4A3
# (same ammunition), a thicker but vertical front, so it starts with the
# M4A3 count.
uk = 112
