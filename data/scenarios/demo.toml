# Demo scenario: two players with eight tanks each, facing each other across
# the start meadow of the test map. Integers only. Used by the game, the CLI,
# the golden-hash test and the network tests.
#
# Every [[group]] places `count` units of the catalog id `unit` for player
# `owner` in a grid of `columns` columns, `spacing_m` apart, centered on
# `center_m` = [x, y] (x east, y south, meters).

# Map the scenario is made for: data/maps/<map>/.
map = "test_small"

[[group]]
owner = 0
unit = "de_pz4_h"
count = 8
columns = 4
spacing_m = 12
center_m = [0, 60]

[[group]]
owner = 1
unit = "su_t34_76_1943"
count = 8
columns = 4
spacing_m = 12
center_m = [0, -60]

# Unit that replaces a player's groups when they pick another faction in the
# skirmish setup (prompt 027). Keys are the faction ids of the catalog.
[faction_units]
de = "de_pz4_h"
su = "su_t34_76_1943"
us = "us_m4a3_75"
