[[unit]]
id = "fort_trench_section"
faction = "neutral"
category = "fort_trench"
name_de = "Schützengraben (Abschnitt)"
name_en = "Infantry fire trench section"
tier = 1
length_mm = 5000
width_mm = 1200
height_mm = 1700
source = [
    { ref = "US Army FM 5-15 Field Fortifications (14 Feb 1944), para. 48b and fig. 40 (printed pp. 81-83)", covers = "standard trench 4 ft wide at top, 2 ft at bottom, 5.5 ft deep, built in short irregular sections, spoil parapet 3 ft wide each side" },
    { ref = "US Army FM 5-15 (1944), para. 32 and fig. 17 (pp. 48-49)", covers = "one-man foxhole 2 ft x 3.5 ft, 4-5 ft deep, for comparison" },
]
uncertain = ["length_mm"]
note = "Standard trench (width = 4 ft top, 1220 mm rounded to 1200; height field holds depth, 5.5 ft = 1676 mm rounded to 1700). Length 5 m per section is a choice: FM 5-15 only says short irregular sections. Parapet not included in the height."

