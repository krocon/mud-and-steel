[[unit]]
id = "fort_barbed_wire"
faction = "neutral"
category = "fort_wire"
name_de = "Stacheldrahtverhau (Doppelzaun)"
name_en = "Barbed wire (double apron fence section)"
tier = 1
length_mm = 3000
width_mm = 3000
height_mm = 1400
source = [
    { ref = "TM-E 30-451 Handbook on German Military Forces (1945), ch. V sec. II para. 7c", covers = "double-apron fence 4 to 5 feet high (middle 4.5 ft = 1372 mm, rounded to 1400)" },
    { ref = "War Department MIS Special Series No. 15, German Coastal Defenses (15 Jun 1943), sec. III item 10b(2)", covers = "apron fences 4-5 ft high, up to 30 ft wide" },
    { ref = "https://tpub.com/seabee/5-2.htm (US Navy Seabee manual, derived from FM 5-30 practice)", covers = "double-apron fence 4-and-2 pace and 6-and-3 pace types; anchor pickets 2 paces each side of the centre line" },
]
uncertain = ["length_mm", "width_mm"]
note = "Double apron fence (not concertina); height from TM-E 30-451. The 3 m section length and 3 m width (about 4 paces between anchor pickets for the 4-and-2 pace type) are estimates; FM 5-15 (1944) does not cover obstacles (it refers to FM 5-30), and FM 5-30 itself was not found."
