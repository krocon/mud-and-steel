    { ref = "https://battleorder.org/ussr-rifle-co-1944 (seen as search excerpt; direct fetch returned 404)", covers = "shtat 04/550 with early-1944 changes: squad of leader/deputy, DP-27 gunner, assistant gunner and riflemen; PPSh replacing some rifles from mid-1943" },
