]
uncertain = ["squad_size", "weapon"]
note = "Rifle squad per shtat 04/550 (1943/44): squad leader, DP-27 gunner and assistant, 6 riflemen = 9. Sources agree on one DP team plus 6-8 riflemen; exact headcount differs. The number of PPSh-41 grew during 1943-45 and varied by unit (2 is a typical value; assistant gunner and some riflemen received SMGs). Rifle rate is practical. Automatic weapons use cyclic rates: PPSh-41 given as 900-1250 rpm across sources (Wikipedia infobox 1250), 1000 chosen, practical ~100 rpm; DP-27 practical (combat) rate up to 80 rpm."

