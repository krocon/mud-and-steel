    { ref = "Zaloga/Ness, Red Army Handbook 1939-1945 (Sutton 1998), rifle division organisation", covers = "squad strength and weapons mix 1943/44 (not checked online)" },
    { ref = "https://en.wikipedia.org/wiki/Mosin%E2%80%93Nagant (infobox)", covers = "M1891/30: 7.62x54R, muzzle velocity ~865 m/s, effective range 500 m (iron sights)" },
