# Catalog: su. Field reference: data/catalog/SCHEMA.md

# ---------------------------------------------------------------------------
# Infantry
# Infantry speeds use the project default (50 road / 40 offroad); no field
# manual value was found. Balancing belongs into scale overrides.
# rate_rpm: cyclic for automatic weapons, practical for everything else.
# ---------------------------------------------------------------------------

[[unit]]
id = "su_inf_rifle_squad"
faction = "su"
category = "inf_rifle"
name_de = "Schützengruppe"
name_en = "Rifle Squad"
designation = "Strelkovoye otdeleniye (shtat 04/550, 1943/44)"
year_from = 1943
year_to = 1945
tier = 1
model = "assets/models/su/su_inf_rifle_squad.tscn"
squad_size = 9
speed_road_kmh_x10 = 50
speed_offroad_kmh_x10 = 40
weapon = [
    { name = "Mosin-Nagant M1891/30", count = 6, caliber_mm_x10 = 76, ammo = "7.62x54R ball", rate_rpm = 10, muzzle_velocity_mps = 865, range_effective_m = 500, range_typical_m = 300 },
    { name = "PPSh-41", count = 2, caliber_mm_x10 = 76, ammo = "7.62x25 Tokarev, 71-round drum or 35-round box", rate_rpm = 1000, muzzle_velocity_mps = 488, range_effective_m = 200, range_typical_m = 100 },
    { name = "DP-27", count = 1, caliber_mm_x10 = 76, ammo = "7.62x54R ball, 47-round pan", rate_rpm = 550, muzzle_velocity_mps = 840, range_effective_m = 800, range_typical_m = 400 },
]
source = [
    { ref = "https://battleorder.org/ussr-rifle-co-1944 (seen as search excerpt; direct fetch returned 404)", covers = "shtat 04/550 with early-1944 changes: squad of leader/deputy, DP-27 gunner, assistant gunner and riflemen; PPSh replacing some rifles from mid-1943" },
    { ref = "https://community.battlefront.com/topic/28010-soviet-squad-orgs/ (forum, secondary)", covers = "squad type 1: leader, LMG gunner, assistant, 6 riflemen (= 9)" },
    { ref = "Zaloga/Ness, Red Army Handbook 1939-1945 (Sutton 1998), rifle division organisation", covers = "squad strength and weapons mix 1943/44 (not checked online)" },
    { ref = "https://en.wikipedia.org/wiki/Mosin%E2%80%93Nagant (infobox)", covers = "M1891/30: 7.62x54R, muzzle velocity ~865 m/s, effective range 500 m (iron sights)" },
    { ref = "https://en.wikipedia.org/wiki/PPSh-41 (infobox)", covers = "PPSh-41: 7.62x25, muzzle velocity 488 m/s, effective range 150-200 m, 71-round drum / 35-round box, rate 1250 rpm" },
    { ref = "https://en.wikipedia.org/wiki/DP_machine_gun (infobox and text)", covers = "DP-27: 7.62x54R, 550 rpm, combat rate up to 80 rpm, 840 m/s, effective range 800 m, 47-round pan" },
    { ref = "N. A. Hitchman, Operational Requirements for an Infantry Hand Weapon, ORO-T-160 (Operations Research Office, Johns Hopkins University, for the US Dept. of the Army, 1952), https://archive.org/details/DTIC_AD0000346", covers = "range_typical_m: about 80 % of the effective rifle and LMG fire in the European actions of WW2 took place at less than 200 yd, 90 % at less than 300 yd (275 m); frequently used rifle ranges do not exceed 300 yd" },
    { ref = "TM-E 30-451 Handbook on German Military Forces (US War Dept., March 1945), ch. VII sec. II, https://lonesentry.com/manuals/tme30/ch7sec2sub6.html", covers = "range_typical_m: MG 34 / MG 42 effective range as light MG 600-800 yd, as heavy MG (tripod) 2,000-2,500 yd: upper bounds for the typical distance" },
]
uncertain = ["squad_size", "weapon"]
note = "Rifle squad per shtat 04/550 (1943/44): squad leader, DP-27 gunner and assistant, 6 riflemen = 9. Sources agree on one DP team plus 6-8 riflemen; exact headcount differs. The number of PPSh-41 grew during 1943-45 and varied by unit (2 is a typical value; assistant gunner and some riflemen received SMGs). Rifle rate is practical. Automatic weapons use cyclic rates: PPSh-41 given as 900-1250 rpm across sources (Wikipedia infobox 1250), 1000 chosen, practical ~100 rpm; DP-27 practical (combat) rate up to 80 rpm. range_typical_m (prompt 067): submachine guns 100 m (class estimate: the battle sight setting); bipod and flexible-mount machine guns 400 m (class estimate between the 300 yd of ORO-T-160 and the 600-800 yd 'effective as light MG' of TM-E 30-451)."

