# Compounds (prompt 059): groups of map objects that the map editor places
# as one stamp ("Compound" tool, "Village" brush) and `cli gen-village`
# builds villages from. Read by `crates/editor` (`editor::compound`); the
# simulation never sees a compound, only its objects (houses, wall
# segments, props), so compounds are no game rule and not in any hash.
#
# Coordinates are millimeters relative to the yard center at heading 0:
# x east, y south (like map coordinates). A compound can be turned in
# steps of 90°; its objects turn with it.
#
# [wall]: the courtyard wall. `kind` with the variants `segment` (normal),
#   `low`, `broken`, `gate` and `corner`; `segment_mm` = length of one
#   segment (the catalog length; segments run along their heading).
#
# Every [[compound]]:
#   name     id used by the editor and the generator
#   label    shown in the editor
#   yard_mm  [x, y] size of the walled yard, multiples of `segment_mm`;
#            [0, 0] = no wall
#   gate     side of the gate segment: "north", "south", "east" or "west"
#            (the middle segment of that side)
#   wall     variant of the wall segments (default: the `segment` variant)
#   village  true: the village brush and generator may pick it
#   family   building family (prompt 120): "desert" (default, [wall]) or
#            a family of [walls.<family>]; the village brush of a family
#            picks only its compounds
#   [[compound.object]]  kind, variant, x_mm, y_mm, heading_deg (0..359)
#
# Wall segments and corner piers whose center lies inside a building of
# the compound (its catalog box plus 0.5 m) are left out: the house's own
# wall closes the yard there. Houses stand with their outer wall 0.25 m
# beyond the yard edge and their door side (model +X) towards the yard.

[wall]
kind = "env_wall_mud"
segment_mm = 3000
segment = "Segment"
low = "Low"
broken = "Broken"
gate = "Gate"
corner = "Corner"

# Prompt 120: the Mediterranean family builds its yards of field stone.
[walls.mediterranean]
kind = "env_wall_field"
segment_mm = 3000
segment = "Segment"
low = "Low"
broken = "Broken"
gate = "Gate"
corner = "Corner"

